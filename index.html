        }));
        const lo = counts.reduce((a, b) => a.n <= b.n ? a : b);
        const hi = counts.reduce((a, b) => a.n >= b.n ? a : b);
        if (hi.n - lo.n > 2) {
          warnings.push(`${rarity} pools are lopsided: ${hi.cid} has ${hi.n}, ${lo.cid} has ${lo.n} (max spread is 2)`);
        }
      }

      // The shop's neutral slot draws from SHARED alone. It was a 6-card rotation
      // containing zero rares, so that slot could never once show a rare in the
      // entire history of the game, and nothing said so because "6 cards" looks
      // like a pool rather than a rotation.
      const sharedPool = Object.values(CARDS_DB).filter(c =>
        c.character === 'SHARED' && c.rarity !== CARD_RARITIES.BASIC && c.type !== CARD_TYPES.CURSE);
      if (sharedPool.length < 10) warnings.push(`SHARED rollable pool is ${sharedPool.length}; the shop's neutral slot needs >=10`);
      if (sharedPool.filter(c => c.rarity === CARD_RARITIES.RARE).length < 2) {
        warnings.push(`SHARED pool has <2 rares — the neutral shop slot can never show one`);
      }
      for (const event of EVENTS_DB) {
        if (!event.id || !event.choices || !event.choices.length) warnings.push(`Event missing fields: ${event.id || 'unknown'}`);
      }
      if (warnings.length) console.warn('Cinder Vault content warnings:', warnings);
      return warnings;
    }

    function buildBalanceReport() {
      return Object.values(CARDS_DB).map(card => ({
        id: card.id,
        name: card.name,
        type: card.type,
        rarity: card.rarity,
        cost: card.cost,
        text: describeCard(card)
      }));
    }

    function autoplay(seed, floors, opts) {
      _headless = true;
      try { return _autoplayRun(seed, floors, opts); }
      finally { _headless = false; }
    }

    function _autoplayRun(seed, floors, opts) {
      opts = opts || {};
      startNewRun({ seed: seed || 1, characterId: opts.characterId || 'cinder-knight', ascension: opts.ascension || 0 });
      // Take a boon so the bot exercises the same run shape a player gets. The
      // card-picker boon is skipped — it needs UI state the bot doesn't drive.
      // boonPoolFor, not BOONS_DB: class-restricted boons exist now, and handing
      // a Knight the Tinker's opener would measure a run no player can have.
      const botBoon = pickOne(boonPoolFor(STATE.run.characterId).filter(b => b.id !== 'clarity'));
      botBoon.apply(STATE);
      goTo(SCREENS.MAP);
      let steps = 0;
      const maxSteps = opts.maxSteps || 5000;
      // opts.acts: how many acts to play through, default 1. Without it nothing
      // automated could ever see Act 2 — the loop stopped dead at VICTORY on
      // floor 16, so balance.mjs and the gate were both measuring Act 1 only and
      // every act-scoped table below was invisible to them.
      const wantActs = opts.acts || 1;
      while (STATE.screen !== SCREENS.GAMEOVER && steps++ < maxSteps && STATE.run.floor <= (floors || LAYOUT.FLOORS)) {
        if (STATE.screen === SCREENS.VICTORY) {
          if ((STATE.act || 1) >= wantActs) break;
          continueEndlessRun(STATE);
        } else if (STATE.screen === SCREENS.MAP) {
          const next = availableNodeIds(STATE)[0];
          if (!next) break;
          travelToNode(STATE, next);
        } else if (STATE.screen === SCREENS.COMBAT) {
          // A turn cap catches real soft-locks; the action cap catches infinite
          // card loops. Draw-heavy decks legitimately play 8+ cards per turn, so
          // actions must be far looser than turns. Attacks are preferred so the
          // random player reliably closes out fights instead of block-cycling.
          let turns = 0, actions = 0;
          while (STATE.screen === SCREENS.COMBAT && turns < 60 && actions++ < 800) {
            const playable = STATE.combat.hand.filter(c => {
              const def = CARDS_DB[c.defId];
              return def && !def.unplayable && (def.cost === 'X' || def.cost <= STATE.combat.energy);
            });
            if (!playable.length) { turns++; endPlayerTurn(STATE); continue; }
            const attacks = playable.filter(c => CARDS_DB[c.defId].type === CARD_TYPES.ATTACK);
            const card = (attacks.length && rand() < 0.7) ? pickOne(attacks) : pickOne(playable);
            const def = CARDS_DB[card.defId];
            const target = STATE.combat.enemies.find(e => e.alive);
            playCard(STATE, card.uid, def.target === 'ENEMY_SINGLE' && target ? target.uid : null);
          }
          if (STATE.screen === SCREENS.COMBAT) throw new Error('Autoplay combat cap hit (turns=' + turns + ', actions=' + actions + ')');
        } else if (STATE.screen === SCREENS.CARD_REWARD) {
          selectCardReward(STATE, null);
        } else if (STATE.screen === SCREENS.REST) {
          applyRest(STATE, STATE.run.hp < STATE.run.maxHp * 0.65 ? 'rest' : 'refine');
          if (STATE.ui.picker) { STATE.ui.picker = null; goTo(SCREENS.MAP); }
        } else if (STATE.screen === SCREENS.SHOP) {
          goTo(SCREENS.MAP);
        } else if (STATE.screen === SCREENS.EVENT) {
          const event = STATE.ui.eventDef;
          const choice = event.choices.find(c => !c.canApply || c.canApply(STATE)) || event.choices[0];
          choice.apply(STATE);
          STATE.ui.eventDef = null;
          if (checkRunDeath(STATE)) break;
          goTo(SCREENS.MAP);
        } else if (STATE.screen === SCREENS.TREASURE) {
          openTreasureCache(STATE, pickOne(TREASURE_CACHES).id);
          goTo(SCREENS.MAP);
        } else {
          break;
        }
      }
      return { screen: STATE.screen, act: STATE.act || 1, floor: STATE.run.floor, hp: STATE.run.hp, gold: STATE.run.gold, steps };
    }

    // Runs autoplay across every character (and optional ascension levels) for a
    // set of seeds; returns per-character aggregate stats for balance review.
    function autoplayAll(seeds, opts) {
      opts = opts || {};
      const seedList = Array.isArray(seeds) && seeds.length ? seeds : Array.from({ length: 10 }, (_, i) => i + 1);
      const ascensions = Array.isArray(opts.ascensions) && opts.ascensions.length ? opts.ascensions : [0];
      const results = {};
      for (const characterId of Object.keys(CHARACTERS_DB)) {
        const stats = { runs: 0, wins: 0, floors: [], errors: [] };
        for (const ascension of ascensions) {
          for (const seed of seedList) {
            try {
              const r = autoplay(seed, opts.floors, { characterId, ascension, maxSteps: opts.maxSteps });
              stats.runs++;
              if (r.screen === SCREENS.VICTORY) stats.wins++;
              stats.floors.push(r.floor);
            } catch (err) {
              stats.errors.push({ seed, ascension, message: String((err && err.message) || err) });
            }
          }
        }
        stats.winRate = stats.runs ? +(stats.wins / stats.runs).toFixed(2) : 0;
        stats.avgFloor = stats.floors.length ? +(stats.floors.reduce((a, b) => a + b, 0) / stats.floors.length).toFixed(1) : 0;
        results[characterId] = stats;
      }
      return results;
    }

    function initApp() {
      STATE = { screen: SCREENS.MENU, run: null, combat: null, ui: {}, seed: null, ascension: 0 };
      validateContent();

      // Catch what the two handler boundaries structurally cannot: throws from
      // rAF callbacks, media element handlers, and any future async work.
      window.addEventListener('error', (ev) => {
        logError('window.onerror', (ev && ev.error) || (ev && ev.message) || ev);
      });
      window.addEventListener('unhandledrejection', (ev) => {
        logError('unhandledrejection', (ev && ev.reason) || ev);
      });

      window.CINDER_DEBUG = {
        getState: () => STATE,
        validateContent,
        balanceReport: buildBalanceReport,
        saveGame: () => saveGame(STATE),
        loadGame,
        clearSave,
        autoplay,
        autoplayAll,
        continueEndless: () => continueEndlessRun(STATE),
        startSeed: (seed, characterId, ascension) => { startNewRun({ seed, characterId: characterId || 'cinder-knight', ascension: ascension || 0 }); goTo(SCREENS.MAP); },
        // Read by tools/cdp-verify.mjs. A caught error is invisible to
        // Runtime.exceptionThrown, so the gate asserts on this too.
        errorLog: () => _errorLog.slice(),
        // Render/save accounting. A navigating click should be exactly 1 of each.
        counters: () => ({ renders: _renderCount, saves: _saveCount }),
        resetCounters: () => { _renderCount = 0; _saveCount = 0; },
        // Test hook: inject a card whose custom() throws, to prove the boundary
        // rolls back rather than leaving the run half-mutated.
        injectThrowingCard: () => {
          CARDS_DB['test-throw'] = {
            id: 'test-throw', name: 'Test Throw', cost: 0, type: CARD_TYPES.SKILL,
            rarity: CARD_RARITIES.BASIC, character: 'SHARED', target: 'SELF',
            desc: () => 'Throws on play.',
            custom: () => { throw new Error('deliberate test throw'); }
          };
          const inst = { uid: uid(), defId: 'test-throw', upgraded: false };
          STATE.combat.hand.push(inst);
          render();
          return inst.uid;
        }
      };

      // Persistent sound toggle + first-gesture audio unlock. #mute-btn and the
      // settings panel are two views of one flag, so each reflects the other.
      const muteBtn = document.getElementById('mute-btn');
      if (muteBtn) {
        syncMuteButton();
        muteBtn.addEventListener('click', () => {
          AudioEngine.unlock();
          AudioEngine.toggleMute();
          syncMuteButton();
          // Redraw only if the panel is open and would now show a stale label.
          if (STATE.ui && STATE.ui.settings) render();
        });
      }
      window.addEventListener('keydown', () => AudioEngine.unlock(), { once: true });
      window.addEventListener('pointerdown', () => AudioEngine.unlock(), { once: true });

      applyMotionPreference();
      render();
    }

    // ============ 12. INIT ============

    initApp();
  </script>
</body>
</html>
