      '\\b(' + Object.keys(GLOSSARY_TERMS).sort((a, b) => b.length - a.length).join('|') + ')\\b',
      'gi');

    // ===== ICON INFRASTRUCTURE (injected by tools/inject-icons.mjs) =====
    // game-icons.net icons (CC BY 3.0). Values are raw SVG path 'd' strings, 512x512 viewBox.
    // The 205-entry path-data map lives in assets/icons.js (generated, ~293KB).
    // Falls back to an empty map so a missing/404 file renders an ugly game rather
    // than throwing on the first icon() call and leaving a blank page.
    const ICONS = window.ICONS || {};
    // Memoised. Every render rebuilds #app's whole innerHTML, and a combat screen
    // emits roughly 50 icons — 10 cards x (art + type), enemy portraits, intents,
    // status chips, energy orbs, potion slots and one per relic in the status bar.
    // Each was a fresh concatenation of a ~1.2KB path string, so a single redraw
    // rebuilt ~40KB of identical markup from scratch. The set of distinct
    // (name, cls) pairs is small and fixed, so the cache is bounded by content.
    const _iconCache = new Map();
    function icon(name, cls) {
      const key = name + '|' + (cls || '');
      let html = _iconCache.get(key);
      if (html !== undefined) return html;
      const d = ICONS[name];
      html = d
        ? '<svg class="icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="' + d + '"/></svg>'
        : '';
      _iconCache.set(key, html);
      return html;
    }
    // Content -> icon key lookups.
    const NODE_ICONS = { COMBAT: 'combat', ELITE: 'elite', REST: 'rest', SHOP: 'shop', EVENT: 'event', TREASURE: 'treasure', BOSS: 'boss' };
    const INTENT_ICONS = { ATTACK: 'int-attack', ATTACK_ALL: 'int-attack-all', BUFF_MIGHT: 'int-buff', BLOCK_INTENT: 'int-block', SAPPED: 'int-sapped', EXPOSED: 'int-exposed', BLIGHT: 'int-blight', BRITTLE: 'int-brittle', HEAL: 'int-heal', ADD_CURSE: 'int-curse', SUMMON: 'int-summon', UNKNOWN: 'int-unknown' };
    const STATUS_ICONS = { might: 'st-might', sapped: 'st-sapped', exposed: 'st-exposed', mending: 'st-mending', blight: 'st-blight', warded: 'st-warded', grace: 'st-grace', brittle: 'st-brittle', aegis: 'st-aegis' };
    // Module scope: read by both the enemy panel and the log's Incoming block.
    const INTENT_DESC = {
      ATTACK: 'Attacks', ATTACK_ALL: 'Attacks all', BUFF_MIGHT: 'Buffing Might',
      BLOCK_INTENT: 'Defending', SAPPED: 'Weakening you', EXPOSED: 'Exposing you',
      BLIGHT: 'Poisoning you', BRITTLE: 'Making you Brittle', HEAL: 'Healing',
      ADD_CURSE: 'Cursing your deck', SUMMON: 'Summoning help', UNKNOWN: 'Unknown'
    };
    const CARD_TYPE_ICONS = { ATTACK: 'type-attack', SKILL: 'type-skill', POWER: 'type-power', CURSE: 'type-curse' };
    const POTION_ICONS = { 'focus-tonic': 'pot-focus', 'blazing-draught': 'pot-blazing', 'second-breath': 'pot-breath', 'overcharge': 'pot-overcharge', 'vigor': 'pot-vigor', 'might-brew': 'pot-might', 'ward-flask': 'pot-ward', 'ghost-oil': 'pot-ghost', 'fire-bomb': 'pot-fire-bomb', 'blight-vial': 'pot-blight', 'fear-gas': 'pot-fear', 'snap-freeze': 'pot-freeze', 'draw-draught': 'pot-draw', 'purging-elixir': 'pot-purge', 'coin-purse': 'pot-coin-purse', 'whetting-oil': 'pot-whetting', 'marrow-tonic': 'pot-marrow', 'solvent': 'pot-solvent' };
    const ENEMY_ICONS = { 'ooze-crawler': 'e-ooze-crawler', 'basilisk': 'e-basilisk', 'cultist': 'e-cultist', 'guardian': 'e-guardian', 'shade': 'e-shade', 'wraith': 'e-wraith', 'molten-egg': 'e-molten-egg', 'golem': 'e-golem', 'harpy': 'e-harpy', 'phantom': 'e-phantom', 'crypt-mender': 'e-crypt-mender', 'gravemaw': 'e-gravemaw', 'revenant': 'e-revenant', 'grave-summoner': 'e-grave-summoner', 'ashhound': 'e-ashhound', 'chanter': 'e-chanter', 'warden': 'e-warden', 'pyromancer': 'e-pyromancer', 'leviathan': 'e-leviathan', 'slag-titan': 'e-slag-titan', 'mirror-thief': 'e-mirror-thief', 'bonelord': 'e-bonelord', 'archlich': 'e-archlich', 'ashen-warden': 'e-ashen-warden', 'hollow-choir': 'e-hollow-choir', 'ash-vicar': 'e-ash-vicar', 'cinder-ordinator': 'e-cinder-ordinator', 'hollow-conductor': 'e-hollow-conductor', 'emberling': 'e-emberling', 'slagbeast': 'e-slagbeast', 'hollow-acolyte': 'e-hollow-acolyte', 'vault-sentinel': 'e-vault-sentinel', 'ash-swarm': 'e-ash-swarm', 'furnace-warden': 'e-furnace-warden', 'mirrorplate-golem': 'e-mirrorplate-golem' };
    const RELIC_ICONS = { 'old-locket': 'r-old-locket', 'cracked-whetstone': 'r-whetstone', 'brass-knuckles': 'r-knuckles', 'vulture-feather': 'r-feather', 'ember-charm': 'r-ember-charm', 'shattered-mind': 'r-shattered-mind', 'war-drums': 'r-drums', 'ancient-shield': 'r-ancient-shield', 'pen-nib': 'r-pen-nib', 'molten-heart': 'r-molten-heart', 'prayer-beads': 'r-beads', 'hand-of-greed': 'r-greed', 'iron-tortoise': 'r-tortoise', 'thornmail': 'r-thornmail', 'bloodstained-idol': 'r-idol', 'runic-hourglass': 'r-hourglass', 'gilded-chalice': 'r-chalice', 'plague-sigil': 'r-plague', 'deadwood-totem': 'r-deadwood', 'ember-lens': 'r-lens', 'flowing-ink': 'r-ink', 'mirror-shard': 'r-mirror', 'heavy-anchor': 'r-anchor', 'golden-needle': 'r-needle', 'war-banner': 'r-banner', 'bone-dice': 'r-dice', 'vital-ember': 'r-vital-ember', 'pocket-sundial': 'r-sundial', 'cracked-core': 'r-cracked-core', 'sunless-coil': 'r-sunless-coil' };
    const CARD_ICONS = { slash: 'c-slash', guard: 'c-guard', adrenaline: 'c-adrenaline', bash: 'c-bash', cleave: 'c-heavy-cleave', reinforce: 'c-reinforce', 'strike-twice': 'c-double-strike', overwhelm: 'c-overwhelm', recover: 'c-second-wind', brace: 'c-brace-impact', bloodpact: 'c-bloodpact', execute: 'c-execute', jab: 'c-quick-jab', 'poison-dart': 'c-poison-dart', 'shield-bash': 'c-shield-bash', sweep: 'c-wide-sweep', quickstep: 'c-quickstep', scout: 'c-scout-ahead', 'first-aid': 'c-first-aid', flurry: 'c-flurry', 'toxic-cloud': 'c-toxic-cloud', bulwark: 'c-bulwark', 'battle-trance': 'c-battle-trance', 'seething-rage': 'c-seething-rage', immolate: 'c-immolate', whirlwind: 'c-whirlwind', sanctuary: 'c-sanctuary', reckoning: 'c-reckoning', 'echo-chamber': 'c-echo-chamber', 'curse-doubt': 'c-doubt', 'curse-decay': 'c-decay', 'reckless-blow': 'c-reckless-blow', 'iron-stance': 'c-iron-stance', 'war-cry': 'c-war-cry', 'pommel-strike': 'c-pommel-strike', bloodletting: 'c-bloodletting', 'ember-plating': 'c-ember-plating', 'inner-furnace': 'c-inner-furnace', 'thorn-plate': 'c-thorn-plate', earthshatter: 'c-earthshatter', 'venom-spit': 'c-venom-spit', fester: 'c-fester', 'caustic-lash': 'c-caustic-lash', wither: 'c-wither', 'miasma-veil': 'c-miasma-veil', 'spore-burst': 'c-spore-burst', 'catalyst-brew': 'c-catalyst-brew', 'creeping-rot': 'c-creeping-rot', 'leech-life': 'c-leech-life', 'plague-ward': 'c-plague-ward', 'noxious-bloom': 'c-noxious-bloom', 'grim-harvest': 'c-grim-harvest', 'corrosive-aura': 'c-corrosive-aura', pestilence: 'c-pestilence', 'deaths-bloom': 'c-deaths-bloom', 'spring-blade': 'c-spring-blade', 'gear-throw': 'c-gear-throw', 'oil-flask': 'c-oil-flask', calibrate: 'c-calibrate', 'pocket-shiv': 'c-pocket-shiv', 'tinker-kit': 'c-tinker-kit', overclock: 'c-overclock', 'power-surge': 'c-power-surge', 'aegis-core': 'c-aegis-core', 'shock-coil': 'c-shock-coil', 'card-engine': 'c-card-engine', 'haste-gear': 'c-haste-gear', dynamo: 'c-dynamo', 'echo-loop': 'c-echo-loop', 'piston-ram': 'c-piston-ram', contingency: 'c-contingency', 'field-ration': 'c-field-ration', 'desperate-strike': 'c-desperate-strike' };
    // Ids (relics + potions) that have a curated colored pixel-art raster in assets/art/icons/.
    // Any id NOT listed here falls through to the monochrome game-icons.net SVG below.
    const RASTER_ICONS = new Set([
      "focus-tonic",
      "blazing-draught",
      "second-breath",
      "overcharge",
      "vigor",
      "old-locket",
      "ember-charm",
      "vital-ember",
      "prayer-beads",
      "vulture-feather",
      "pen-nib",
      "bloodstained-idol",
      "ancient-shield",
      "iron-tortoise",
      "thornmail",
      "cracked-whetstone",
      "hand-of-greed",
      "molten-heart",
      "ember-lens",
      "mirror-shard",
    ]);
    function rasterIcon(id) { return '<img class="icon icon-img" src="assets/art/icons/' + id + '.png" alt="">'; }
    // Helper accessors. Each returns final HTML (raster img, icon svg, or a text fallback), never throws.
    function nodeIcon(type) { return icon(NODE_ICONS[type] || 'int-unknown'); }
    function intentIconFor(type) { return icon(INTENT_ICONS[type] || 'int-unknown'); }
    function statusIcon(name) { return icon(STATUS_ICONS[name]) || statusShort(name); }
    function typeIcon(type) { return icon(CARD_TYPE_ICONS[type] || ''); }
    function potionIcon(pid) { return RASTER_ICONS.has(pid) ? rasterIcon(pid) : (icon(POTION_ICONS[pid] || 'potion') || icon('potion')); }
    function relicIcon(id, abbr) { return RASTER_ICONS.has(id) ? rasterIcon(id) : (icon(RELIC_ICONS[id]) || (abbr || '')); }
    function enemyIcon(defId) { return icon(ENEMY_ICONS[defId] || '') || icon('int-unknown'); }
    function cardArtIcon(defId, type) { return icon(CARD_ICONS[defId]) || typeIcon(type); }
    // ===== END ICON INFRASTRUCTURE =====

    // ============ 2. DATA TABLES ============

    const CARDS_DB = {
      // BASIC
      'slash': {
        id: 'slash', name: 'Slash', cost: 1, type: CARD_TYPES.ATTACK, rarity: CARD_RARITIES.BASIC, character: 'SHARED',
        target: 'ENEMY_SINGLE', values: { dmg: 6 }, upgradedValues: { dmg: 9 },
        effects: [{ type: 'DAMAGE', key: 'dmg' }]
      },
      'guard': {
        id: 'guard', name: 'Guard', cost: 1, type: CARD_TYPES.SKILL, rarity: CARD_RARITIES.BASIC, character: 'SHARED',
        target: 'SELF', values: { block: 5 }, upgradedValues: { block: 8 },
        effects: [{ type: 'BLOCK', key: 'block' }]
      },
      'adrenaline': {
        id: 'adrenaline', name: 'Adrenaline Surge', cost: 0, type: CARD_TYPES.SKILL, rarity: CARD_RARITIES.BASIC, character: 'SHARED',
        exhaust: true, target: 'SELF',
        effects: [{ type: 'ENERGY', value: 1 }, { type: 'DRAW', value: 1 }]
      },
      // COMMON
      'bash': {
        id: 'bash', name: 'Bash', cost: 1, type: CARD_TYPES.ATTACK, rarity: CARD_RARITIES.COMMON, character: 'cinder-knight',
        target: 'ENEMY_SINGLE', values: { dmg: 8 }, upgradedValues: { dmg: 11 },
        effects: [{ type: 'DAMAGE', key: 'dmg' }, { type: 'APPLY_STATUS', status: 'sapped', value: 1 }]
      },
      'cleave': {
        id: 'cleave', name: 'Heavy Cleave', cost: 2, type: CARD_TYPES.ATTACK, rarity: CARD_RARITIES.COMMON, character: 'cinder-knight',
        target: 'ENEMY_ALL', values: { dmg: 10 }, upgradedValues: { dmg: 13 },
        effects: [{ type: 'DAMAGE', key: 'dmg' }]
      },
      'reinforce': {
        id: 'reinforce', name: 'Reinforce', cost: 1, type: CARD_TYPES.SKILL, rarity: CARD_RARITIES.COMMON, character: 'cinder-knight',
        target: 'SELF', values: { block: 8 }, upgradedValues: { block: 11 },
        effects: [{ type: 'BLOCK', key: 'block' }]
      },
      'strike-twice': {
        id: 'strike-twice', name: 'Double Strike', cost: 2, type: CARD_TYPES.ATTACK, rarity: CARD_RARITIES.COMMON, character: 'cinder-knight',
        target: 'ENEMY_SINGLE', values: { dmg: 5 }, upgradedValues: { dmg: 7 },
        desc: (up) => `Deal ${up ? 7 : 5} damage twice.`,
        custom: (game, target, card) => {
          const damage = (card && card.upgraded) ? 7 : 5;
          dealDamage(game, game.combat.player, target, damage);
          if (target.alive) dealDamage(game, game.combat.player, target, damage);
        }
      },
      // UNCOMMON
      'overwhelm': {
        id: 'overwhelm', name: 'Overwhelm', cost: 2, type: CARD_TYPES.ATTACK, rarity: CARD_RARITIES.UNCOMMON, character: 'cinder-knight',
        target: 'ENEMY_SINGLE', values: { dmg: 14 }, upgradedValues: { dmg: 17 },
        effects: [{ type: 'DAMAGE', key: 'dmg' }, { type: 'APPLY_STATUS', status: 'exposed', value: 2 }]
      },
      'recover': {
        id: 'recover', name: 'Second Wind', cost: 1, type: CARD_TYPES.POWER, rarity: CARD_RARITIES.UNCOMMON, character: 'cinder-knight',
        target: 'SELF',
        desc: (up) => `Gain ${up ? 2 : 1} Warded (+block whenever you gain block).`,
        custom: (game, target, card) => {
          applyPlayerStatus(game, game.combat.player, 'warded', (card && card.upgraded) ? 2 : 1);
        }
      },
      'brace': {
        id: 'brace', name: 'Brace Impact', cost: 1, type: CARD_TYPES.SKILL, rarity: CARD_RARITIES.UNCOMMON, character: 'cinder-knight',
        target: 'SELF', values: { block: 12 }, upgradedValues: { block: 15 },

    // Boons available to a given character: unrestricted ones plus that class's.
    function boonPoolFor(characterId) {
      return BOONS_DB.filter(b => !b.characters || b.characters.includes(characterId));
    }

    // Roll the opening offer. Stored as IDS, not objects: BOONS_DB entries carry
    // an apply() function, JSON drops functions, and STATE.ui goes into the save —
    // so a reload on the boon screen would hand the handler a def it could not
    // apply. The event system solves the identical problem the identical way
    // (see rehydrateState's eventDef lookup).
    function rollBoonChoices(game, count) {
      const pool = shuffle(boonPoolFor(game.run.characterId).map(b => b.id));
      return pool.slice(0, count || 4);
    }

        gold: character.gold != null ? character.gold : LAYOUT.STARTING_GOLD,
        relics: [...character.relics],
        potions: [null, null, null],
        floor: 1,
        map: null,
        currentNodeId: null,
        seenEventIds: [],
        removalsThisRun: 0
      };
    }

    // ============ 4. UTILS ============

    // Seedable PRNG (mulberry32). All game randomness routes through rand()
    // so runs can be reproduced from a seed.
    let _rngState = (Math.random() * 4294967296) >>> 0;

    function seedRng(seed) {
      _rngState = (seed >>> 0) || 1;
    }

    function rand() {
      _rngState |= 0;
      _rngState = (_rngState + 0x6D2B79F5) | 0;
      let t = Math.imul(_rngState ^ (_rngState >>> 15), 1 | _rngState);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function randInt(min, max) {
      // inclusive min, exclusive max
      return min + Math.floor(rand() * (max - min));
    }

    function pickOne(arr) {
      return arr[Math.floor(rand() * arr.length)];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function weightedPick(weights) {
      const sum = Object.values(weights).reduce((a, b) => a + b, 0);
      let roll = rand() * sum;
      for (const [key, weight] of Object.entries(weights)) {
        roll -= weight;
        if (roll <= 0) return key;
      }
      return Object.keys(weights)[0];
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function uid() {
      return Math.random().toString(36).substring(2, 11);
    }

    function statusLabel(statusName) {
      return (STATUS_INFO[statusName] && STATUS_INFO[statusName].label) || statusName;
    }

    function statusShort(statusName) {
      return (STATUS_INFO[statusName] && STATUS_INFO[statusName].short) || statusName.slice(0, 3);
    }

    function healRun(game, amount, source) {
      if (!game || !game.run) return 0;
      const before = game.run.hp;
      game.run.hp = Math.min(game.run.maxHp, game.run.hp + amount);
      const healed = game.run.hp - before;
      if (healed > 0 && game.combat && game.combat.log) {
        combatLog(game, 'you', 'heal', `${source || 'Healing'} restores ${healed} HP.`);
        // Also the first thing that ever plays assets/audio/sfx/heal.mp3, which
        // shipped with zero call sites: rest sites, First Aid, Mending ticks and
        // Leech Life were all silent. spawnFloatingNumber owns the sound.
        spawnFloatingNumber('player', `+${healed}`, 'heal');
      }
      return healed;
    }

    // Self-inflicted HP loss (blood-cost cards, the Decay curse, event prices).
    // Unlike the old inline `Math.max(1, ...)` clamps, this CAN take you to 0 —
    // otherwise "pay life for power" is strictly free once you're low, which
    // removed all risk from the Cinder Knight's whole identity.
    // In combat, death is picked up by checkCombatEnd (playCard and endPlayerTurn
    // both call it). Outside combat, callers use checkRunDeath below.
    function loseHp(game, amount, source) {
      if (!game || !game.run || amount <= 0) return 0;
      const before = game.run.hp;
      game.run.hp = Math.max(0, game.run.hp - amount);
      const lost = before - game.run.hp;
      if (lost > 0 && game.combat && game.combat.log) {
        combatLog(game, 'you', 'cost', `${source || 'The cost'} drains ${lost} HP.`);
      }
      return lost;
    }

    // Death check for HP lost outside combat (events). Returns true if the run ended.
    function checkRunDeath(game) {
      if (!game || !game.run || game.run.hp > 0) return false;
      game.run.hp = 0;
      recordRunResult(game, false);
      goTo(SCREENS.GAMEOVER);
      return true;
    }

    // The self-inflicted HP a card costs to play, for the lethal-cost warning in
    // the hand. Declared alongside the card's own numbers in CARDS_DB.
    function cardHpCost(cardDef, upgraded) {
      if (!cardDef || cardDef.hpCost == null) return 0;
      return typeof cardDef.hpCost === 'function' ? cardDef.hpCost(!!upgraded) : cardDef.hpCost;
    }

    function gainMaxHp(game, amount, alsoHeal) {
      if (!game || !game.run || amount <= 0) return 0;
      game.run.maxHp += amount;
      if (alsoHeal) game.run.hp = Math.min(game.run.maxHp, game.run.hp + amount);
      if (game.combat && game.combat.log) combatLog(game, 'you', 'heal', `Max HP increased by ${amount}.`);
      return amount;
    }

    // The card pool visible to the current run: the character's own cards plus
    // (by default) SHARED neutrals. BASIC and CURSE cards never appear.
    function cardPoolFor(game, opts) {
      opts = opts || {};
      const characterId = game && game.run ? game.run.characterId : null;
      return Object.values(CARDS_DB).filter(c => {
        if (c.rarity === CARD_RARITIES.BASIC || c.type === CARD_TYPES.CURSE) return false;
        if (opts.rarity && c.rarity !== opts.rarity) return false;
        if (opts.exclude && opts.exclude.has(c.id)) return false;
        if (c.character === 'SHARED') return opts.includeShared !== false;
        return !characterId || c.character === characterId;
      });
    }

    // opts.includeShared: false restricts the grant to the run's own class.
    // Needed from Phase 10 on: cardPoolFor defaults to including SHARED, and
    // there are now SHARED rares, so a caller that PROMISES a class card ("Add a
    // random rare card of your class") would otherwise be able to hand out a
    // neutral one. Accidentally correct before, when SHARED had no rares.
    function grantRandomCard(game, rarity, opts) {
      const pool = cardPoolFor(game, { rarity, ...(opts || {}) });
      if (!pool.length) return null;
      const card = pickOne(pool);
      game.run.deck.push({ uid: uid(), defId: card.id, upgraded: false });
      return card.id;
    }

    // The one place a potion is chosen. Both callers — the post-combat drop and
    // the shop — used to inline `pickOne(Object.keys(POTIONS_DB))`, which is why
    // POTION_RARITY_WEIGHTS could be declared on all fourteen potions and read by
    // none of them. `exclude` is a Set of ids already taken, so the shop cannot
    // stock the same potion at two prices.
    //
    // Falls back a rarity at a time rather than giving up: a rarity band emptied
    // by `exclude` must not silently mean "no potion".
    function rollPotion(exclude) {
      exclude = exclude || new Set();
      const byRarity = {};
      for (const p of Object.values(POTIONS_DB)) {
        if (exclude.has(p.id)) continue;
        (byRarity[p.rarity] = byRarity[p.rarity] || []).push(p.id);
      }
      const weights = {};
      for (const [rarity, w] of Object.entries(POTION_RARITY_WEIGHTS)) {
        if ((byRarity[rarity] || []).length) weights[rarity] = w;
      }
      const available = Object.keys(weights);
      if (!available.length) return null;
      return pickOne(byRarity[weightedPick(weights)]);
    }

    function isCurseCardInstance(card) {
      const def = card && CARDS_DB[card.defId];
      return !!def && def.type === CARD_TYPES.CURSE;
    }

    function upgradeRandomCard(game) {
      const pool = game.run.deck.filter(c => !c.upgraded && !isCurseCardInstance(c));
      if (!pool.length) return null;
      const card = pickOne(pool);
      card.upgraded = true;
      return card.uid;
    }

    // --- Persistence / meta-stats ---
    const SAVE_KEY = 'cinderVaultSave';
    const META_KEY = 'cinderVaultMeta';
    // Bump this and add a migrateSave() branch whenever the STATE shape changes.
    // It used to be a bare literal in three places (writer, reader, and prose in
    // OVERVIEW.md); bumping the writer without the reader ships a Continue button
    // that silently does nothing, because hasSave() only checks the key exists.
    const SAVE_VERSION = 5;

    function clearSave() {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }

    function defaultMeta() {
      return { wins: 0, losses: 0, bestFloor: 0, bestGold: 0, highestAscensionUnlocked: 0, runs: [] };
    }

    function loadMeta() {
      try { return { ...defaultMeta(), ...(JSON.parse(localStorage.getItem(META_KEY)) || {}) }; }
      catch (e) { return defaultMeta(); }
    }

    function saveMeta(meta) {
      try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
    }

    // ===== SETTINGS =====
    // Deliberately its OWN store, not part of STATE and not part of the run save:
    //   - preferences must outlive clearSave(), which abandoning a run calls;
    //   - they must not force a save-version bump, and this shape needs no
    //     migration at all. Spreading over defaults (the same trick loadMeta
    //     uses) means an old stored object silently gains new keys and an
    //     unknown key is simply carried along.
    const SETTINGS_KEY = 'cinderVaultSettings';

    function defaultSettings() {
      // music/sfx keep the values that were compile-time constants until now.
      return { master: 1, music: 0.35, sfx: 0.6, muted: false, reducedMotion: false };
    }

    function loadSettings() {
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch (e) {}
      const s = { ...defaultSettings(), ...(stored || {}) };
      // Adopt the standalone flag the mute button used before this existed, so
      // an existing player's choice survives the upgrade.
      if (!stored) {
        try { if (localStorage.getItem('cinderMuted') === '1') s.muted = true; } catch (e) {}
      }
      // Clamp: these come back from localStorage, which anyone can edit, and a
      // volume outside 0..1 throws on assignment to a media element.
      for (const k of ['master', 'music', 'sfx']) {
        const n = Number(s[k]);
        s[k] = Number.isFinite(n) ? Math.max(0, Math.min(1, n)) : defaultSettings()[k];
      }
      s.muted = !!s.muted;
      s.reducedMotion = !!s.reducedMotion;
      return s;
    }

    function saveSettings() {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) {}
      // Kept in sync so the pre-settings key never disagrees with the new store.
      try { localStorage.setItem('cinderMuted', SETTINGS.muted ? '1' : '0'); } catch (e) {}
    }

    let SETTINGS = loadSettings();

    // The manual reduced-motion override. The CSS media query handles the OS
    // setting; this class is the in-game toggle on top of it.
    function applyMotionPreference() {
      if (document.body) document.body.classList.toggle('reduced-motion', !!SETTINGS.reducedMotion);
    }

    function hasSave() {
      try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
    }

    // True while a headless autoplay/smoke run is driving the game; blocks the
    // real save file and meta stats from being touched by simulated runs.
    let _headless = false;

    // Keys that must never reach the save file.
    //   template        a live ENEMIES_DB reference stashed on every combat enemy
    //                   (see startCombat). JSON drops the functions but faithfully
    //                   serialises name/maxHp/pattern into every save, and
    //                   rehydrateState() reattaches the real object on load — so
    //                   the serialised copy is pure weight in a synchronous write.
    //   lastRunOptions  written by startNewRun() and read by absolutely nothing.
    function saveReplacer(key, value) {
      if (key === 'template' || key === 'lastRunOptions') return undefined;
      return value;
    }

    function serializeGame(game) {
      return JSON.stringify(
        { version: SAVE_VERSION, rngState: _rngState, savedAt: Date.now(), state: game },
        saveReplacer);
    }

    // Returns the serialised payload when it actually wrote, else null. The
    // error boundary reuses the return value as its rollback snapshot, so a
    // protected action costs one stringify, not two.
    function saveGame(game) {
      if (_headless) return null;
      if (!game || !game.run || game.screen === SCREENS.MENU || game.screen === SCREENS.VICTORY || game.screen === SCREENS.GAMEOVER) return null;
      try {
        const payload = serializeGame(game);
        localStorage.setItem(SAVE_KEY, payload);
        _saveCount++;
        return payload;
      } catch (e) { return null; }
    }

    // Fills defaults for fields added after older save versions. Content ids are
    // never renamed or removed across versions, so decks/relics load as-is.
    function migrateSave(game) {
      if (!game || !game.run) return game;
      const run = game.run;
      if (!run.characterId) {
        const match = Object.values(CHARACTERS_DB).find(c => c.name === run.characterName);
        run.characterId = match ? match.id : 'cinder-knight';
      }
      if (run.removalsThisRun == null) run.removalsThisRun = 0;
      if (!run.seenEventIds) run.seenEventIds = [];
      if (game.act == null) game.act = 1;
      // Treasure nodes used to record only a boolean. Give already-looted ones a
      // result object so the new cache screen doesn't hand out a second reward.
      if (run.map && run.map.nodes) {
        for (const node of run.map.nodes) {
          if (node.rewardedTreasure && !node.treasureResult) node.treasureResult = { cache: 'legacy', gold: 0 };
        }
      }
      // SAVE v5: the combat log became objects (turn/actor/kind) so it can be
      // grouped and styled. Wrap any v<=4 plain strings; they keep their text and
      // simply carry no turn attribution.
      if (game.combat && Array.isArray(game.combat.log)) {
        game.combat.log = game.combat.log.map(e =>
          typeof e === 'string' ? { t: 0, side: 'sys', kind: 'info', text: e } : e);
      }
      return game;
    }

    function rehydrateState(game) {
      if (!game) return game;
      game.ui = game.ui || {};
      // saveGame() serialises all of STATE, so these would otherwise come back
      // up. Both are a keypress or a click away; neither is run state. The error
      // banner in particular must not outlive the session that produced it.
      game.ui.keyHelp = false;
      game.ui.error = null;
      game.ui.confirm = null;    // a pending yes/no must not survive a reload
      game.ui.history = false;
      game.ui.settings = false;
      game.act = game.act || 1;
      // Saves written on non-combat screens by older builds still carry the
      // finished combat object. Stale combat renders every potion usable and
      // lets checkCombatEnd re-run a settled payout, so drop it on load. Not a
      // shape change — combat: null is the normal between-fights state.
      if (game.screen !== SCREENS.COMBAT) game.combat = null;
      if (game.combat && game.combat.enemies) {
        for (const enemy of game.combat.enemies) enemy.template = ENEMIES_DB[enemy.defId];
      }
      if (game.ui.eventDef && game.ui.eventDef.id) {
        game.ui.eventDef = EVENTS_DB.find(e => e.id === game.ui.eventDef.id) || game.ui.eventDef;
      }
      if (game.ui.cardRewardChoices) {
        game.ui.cardRewardChoices = game.ui.cardRewardChoices.map(c => CARDS_DB[c.id] || c).filter(Boolean);
      }
      return game;
    }

    function loadGame() {
      let candidate, candidateRng;
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!saved || !saved.state || saved.version < 2 || saved.version > SAVE_VERSION) return false;
        candidate = rehydrateState(migrateSave(saved.state));
        // != null, not ||: 0 is a legal mulberry32 state and must not be
        // silently replaced with a reseed.
        candidateRng = saved.rngState != null ? saved.rngState : (candidate.seed || 1);
      } catch (e) { logError('loadGame/parse', e); return false; }

      // Commit to STATE only once we know the save can actually be drawn.
      // This used to replace STATE first and render inside the same try, so a
      // save that parsed but could not render (one naming content a later edit
      // removed) left STATE swapped in, returned false, and the caller's
      // fallback render() then threw against it — every later click throwing,
      // no message, no way back. Bricked silently.
      const prevState = STATE, prevRng = _rngState;
      STATE = candidate;
      _rngState = candidateRng;
      try {
        renderScreen();
      } catch (e) {
        STATE = prevState;
        _rngState = prevRng;
        logError('loadGame/render', e);
        return false;
      }
      _lastGood = serializeGame(STATE);
      return true;
    }

    // ===== ERROR BOUNDARY =====
    // The game is one global STATE mutated in place by a 34-case delegated click
    // handler, and roughly fifty hand-written custom()/apply() closures across
    // CARDS_DB, POTIONS_DB, EVENTS_DB and RELICS_DB. A throw part-way through one
    // of those used to leave the run genuinely corrupt AND the screen lying about
    // it: playCard() applies effects, logs, and only then removes the card,
    // deducts energy and restores the Pen Nib upgrade override — so a mid-effect
    // throw dealt the damage, kept the card in hand, charged no energy, left the
    // card permanently upgraded, and skipped the tail render(), so the pre-click
    // screen stayed up and clicking again re-applied the whole thing.
    //
    // _lastGood is the serialised state as of the end of the last action that
    // completed. Rolling back to it is exactly "undo the action that threw", and
    // it reuses the save system's own round-trip rather than inventing an undo.
    let _lastGood = null;
    const _errorLog = [];

    // Save, and remember what we wrote as the rollback point for the next action.
    function checkpoint(game) {
      const payload = saveGame(game);
      if (payload) _lastGood = payload;
    }

    // True while a click or keydown dispatch is in flight.
    //
    // goTo() and several mid-action helpers each used to render and save on
    // their own, on top of the handler's own tail. A navigating click therefore
    // rebuilt #app two or three times and wrote localStorage two or three times;
    // Menu Start was three of each (startNewRun -> goTo -> tail). Every one of
    // those renders re-serialises ~50 SVG icons and re-parses them into fresh
    // DOM, and every save is a synchronous stringify of the whole run.
    //
    // The handler tails now own the single render+save for the whole action.
    // Anything reached from inside one defers via refresh(); anything calling in
    // from outside (autoplay, CINDER_DEBUG, initApp) still gets its redraw.
    let _inDispatch = false;
    let _renderCount = 0, _saveCount = 0;

    function refresh() {
      if (_inDispatch) return;
      render();
      checkpoint(STATE);
    }

    function logError(where, err) {
      const entry = {
        where,
        message: String((err && err.message) || err),
        stack: String((err && err.stack) || ''),
        at: Date.now()
      };
      _errorLog.push(entry);
      if (_errorLog.length > 20) _errorLog.shift();
      // Deliberate: tools/cdp-verify.mjs collects Runtime.consoleAPICalled of type
      // 'error' into the same bucket as uncaught exceptions. Catching an exception
      // would otherwise HIDE it from the gate — the boundary would make a broken
      // game report green. This line is what keeps the gate honest.
      try { console.error('[cinder] ' + where + ':', err); } catch (e) {}
      return entry;
    }

    function recoverFromError(where, err) {
      logError(where, err);
      let restored = false;
      if (_lastGood) {
        try {
          const saved = JSON.parse(_lastGood);
          if (saved && saved.state) {
            STATE = rehydrateState(migrateSave(saved.state));
            _rngState = saved.rngState != null ? saved.rngState : (STATE.seed || 1);
            restored = true;
          }
        } catch (e) { logError('rollback', e); }
      }
      if (!STATE) return;
      STATE.ui = STATE.ui || {};
      // Clear transient UI so the banner is not buried under a half-open overlay.
      STATE.ui.picker = null;
      STATE.ui.pileViewer = null;
      STATE.ui.inspect = null;
      STATE.ui.error = { message: String((err && err.message) || err), restored };
      try { renderScreen(); } catch (e) { paintFatal(e); }
    }

    // Last resort: renderScreen() itself is broken, so no game screen can be
    // drawn. Write plain markup straight into #app — no helpers, nothing that
    // could throw again — so the player gets an exit instead of a blank page.
    function paintFatal(err) {
      logError('render/fatal', err);
      try {
        document.getElementById('app').innerHTML =
          '<div class="fatal-panel">'
          + '<h2>The vault collapsed.</h2>'
          + '<p>Something broke badly enough that the game cannot draw itself.</p>'
          + '<p class="fatal-detail">' + attrEscape(String((err && err.message) || err)) + '</p>'
          + '<button class="menu-button" onclick="location.reload()">Reload</button>'
          + '<button class="menu-button" onclick="try{localStorage.removeItem(\'cinderVaultSave\')}catch(e){};location.reload()">Clear save and reload</button>'
          + '</div>';
      } catch (e) {}
    }

    function recordRunResult(game, won) {
      if (_headless) return;
      try {
        const meta = loadMeta();
        if (won) meta.wins++; else meta.losses++;
        meta.bestFloor = Math.max(meta.bestFloor || 0, game.run.floor || 0);
        meta.bestGold = Math.max(meta.bestGold || 0, game.run.gold || 0);
        if (won) meta.highestAscensionUnlocked = Math.min(ASCENSION_MAX, Math.max(meta.highestAscensionUnlocked || 0, (game.ascension || 0) + 1));
        meta.runs = meta.runs || [];
        meta.runs.unshift({
          won,
          date: new Date().toISOString(),
          character: game.run.characterName || 'Cinder Knight',
          boss: game.run.bossName || 'Unknown',
          floor: game.run.floor || 0,
          gold: game.run.gold || 0,
          deckSize: game.run.deck ? game.run.deck.length : 0,
          relics: game.run.relics ? game.run.relics.length : 0,
          ascension: game.ascension || 0,
          act: game.act || 1,
          seed: game.seed,
          // Distinguishes "walked away" from "died" in the history. meta.runs is
          // unversioned (loadMeta spreads over defaults), so adding a field here
          // needs no save migration.
          abandoned: !!game.run.abandoned
        });
        meta.runs = meta.runs.slice(0, 10);
        saveMeta(meta);
      } catch (e) {}
      clearSave();
    }

    // ============ COMBAT LOG ============
    // Entries are objects, not strings, so the log can be grouped by turn and
    // styled by actor: { t, side, kind, text, minor?, snap? }.
    //   side  'you' | 'foe' | 'sys'   — drives the accent colour
    //   kind  attack/block/status/heal/death/card/relic/power/tick/turn/info
    //   minor true for background chatter (status ticks, relic procs) so the panel
    //         can de-emphasise it without hiding it
    //   snap  only on kind:'turn' — the HP/energy state entering that turn
    // Older saves stored plain strings; migrateSave() wraps them (see SAVE v5).
    const LOG_CAP = 400;   // bounded: combat.log lives inside the saved state

    function combatLog(game, side, kind, text, opts) {
      if (!game || !game.combat || !Array.isArray(game.combat.log)) return;
      const entry = { t: game.combat.turnNum || 1, side, kind, text };
      if (opts && opts.minor) entry.minor = true;
      if (opts && opts.snap) entry.snap = opts.snap;
      // Structured damage, so the turn-header summary can add up what happened
      // instead of regex-scraping the numbers back out of the prose it just
      // formatted. The old form did `text.match(/dealt (\d+)/)`, which meant
      // rewording a log line silently made the summary read zero.
      if (opts && opts.dmg != null) entry.dmg = opts.dmg;
      game.combat.log.push(entry);
      const over = game.combat.log.length - LOG_CAP;
      if (over > 0) game.combat.log.splice(0, over);
    }

    // Snapshot of everything the turn header summarises. Taken entering a turn, so
    // consecutive snapshots give the deltas the log panel shows.
    function turnSnapshot(game) {
      const c = game.combat;
      return {
        hp: game.run.hp,
        maxHp: game.run.maxHp,
        block: c.player.block || 0,
        energy: c.energyMax,
        foes: c.enemies.filter(e => e.alive).map(e => ({ name: e.name, hp: e.hp, maxHp: e.maxHp }))
      };
    }

    // Where a combat FX for `targetKey` belongs on screen. Both FX systems
    // resolved this identically and then drifted in what they did with it; one
    // definition means a renamed panel class breaks both at once, visibly,
    // instead of one of them silently.
    function anchorRect(targetKey) {
      const sel = targetKey === 'player'
        ? '.player-panel'
        : `.enemy-panel[data-enemyuid="${targetKey}"]`;
      let anchor = document.querySelector(sel);
      if (!anchor && targetKey !== 'player') anchor = document.querySelector('.combat-enemies');
      return anchor ? anchor.getBoundingClientRect() : null;
    }

    // --- Fire-and-forget floating combat numbers (Phase 1.7) ---
    // Appends a transient element over the target's panel, outside the
    // full-rerender cycle, and removes itself when the animation ends.
    // Fan-out counter for numbers that land in the same frame. Module-level
    // rather than per-call, because the whole point is that separate calls from
    // one synchronous enemy turn need to know about each other.
    let _floatFanout = 0, _floatFanoutReset = null;

    function spawnFloatingNumber(targetKey, text, kind) {
      // Audio cue per kind. 'heal' was added in Phase 6 — heal.mp3 shipped with
      // no call site at all, so healing had been silent since it was recorded.
      AudioEngine.sfx(kind === 'block' ? 'block' : kind === 'heal' ? 'heal' : 'hit');
      // Deferred so it runs after render() repaints the DOM for this action.
      setTimeout(() => {
        const rect = anchorRect(targetKey);
        if (!rect) return;
        const el = document.createElement('div');
        el.className = 'floating-number ' + (kind === 'block' ? 'floating-block' : kind === 'heal' ? 'floating-heal' : 'floating-dmg');
        el.textContent = text;

        // Fan out. runEnemyTurn resolves every enemy in one synchronous pass and
        // every call computed the SAME position (the anchor's centre, upper
        // third), so three attackers stacked three numbers on one pixel: you saw
        // one figure and could not tell who hit you for what. Multi-hit cards and
        // ENEMY_ALL had the same problem. The counter resets once the frame
        // drains, so a normal single hit is still dead centre.
        const step = _floatFanout++;
        if (_floatFanoutReset == null) {
          _floatFanoutReset = setTimeout(() => { _floatFanout = 0; _floatFanoutReset = null; }, 250);
        }
        // Alternate left/right of centre so a pair reads symmetrically.
        const spread = step === 0 ? 0 : (step % 2 ? 1 : -1) * Math.ceil(step / 2) * 34;
        el.style.left = (rect.left + rect.width / 2 + spread) + 'px';
        el.style.top = (rect.top + rect.height / 3 - step * 6) + 'px';
        // Stagger, so simultaneous numbers arrive as a burst you can read rather
        // than all at once. Purely visual; the engine stays synchronous.
        el.style.animationDelay = (step * 70) + 'ms';

        // Into #fx-layer, not document.body. The layer is z-index 9999 and the
        // number used to be 1000 on the body, so the attack sprite drew OVER the
        // damage number it was meant to accompany.
        fxLayer().appendChild(el);
        el.addEventListener('animationend', () => el.remove());
        // Backstop, and load-bearing: the reduced-motion rules set
        // `animation: none`, so animationend never fires and this is the only
        // thing that removes the element.
        setTimeout(() => el.remove(), 1400 + step * 70);
      }, 0);
    }

    // Shared, because playEffect used to create its own if missing and
    // spawnFloatingNumber appended to document.body instead.
    function fxLayer() {
      let layer = document.getElementById('fx-layer');
      if (!layer) { layer = document.createElement('div'); layer.id = 'fx-layer'; document.body.appendChild(layer); }
      return layer;
    }

    // Impact feedback. Nothing in the game shook, flashed or recoiled: taking 30
    // damage looked exactly like taking 3, plus a different numeral.
    function shakeScreen(strength) {
      if (prefersReducedMotion()) return;
      const app = document.getElementById('app');
      if (!app) return;
      app.classList.remove('shake-light', 'shake-heavy');
      // Force a reflow so re-adding the class restarts the animation on a
      // back-to-back hit instead of being a no-op.
      void app.offsetWidth;
      app.classList.add(strength >= 12 ? 'shake-heavy' : 'shake-light');
      setTimeout(() => app.classList.remove('shake-light', 'shake-heavy'), 400);
    }

    function flashTarget(targetKey) {
      if (prefersReducedMotion()) return;
      setTimeout(() => {
        const sel = targetKey === 'player' ? '.player-panel' : `.enemy-panel[data-enemyuid="${targetKey}"]`;
        const el = document.querySelector(sel);
        if (!el) return;
        el.classList.remove('hit-flash');
        void el.offsetWidth;
        el.classList.add('hit-flash');
        setTimeout(() => el.classList.remove('hit-flash'), 260);
      }, 0);
    }

    function prefersReducedMotion() {
      if (document.body && document.body.classList.contains('reduced-motion')) return true;
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    // --- Fire-and-forget pixel-art combat effect sprites ---
    // Cycles a folder of numbered frames (assets/art/fx/<name>/<i>.png) over the
    // target's panel. Mirrors spawnFloatingNumber: deferred past render(), lives in
    // #fx-layer (outside #app so it survives re-render), self-removes when done.
    const FX_DEFS = {
      attack: { frames: 8, size: 108, dur: 45 },  // fiery burst when an enemy is hit
      block:  { frames: 7, size: 88, dur: 55 },   // shield orb when the player gains block
      potion: { frames: 7, size: 96, dur: 55 },   // magical burst when a potion is quaffed
    };
    function playEffect(targetKey, name) {
      const def = FX_DEFS[name];
      if (!def) return;
      setTimeout(() => {
        const rect = anchorRect(targetKey);
        if (!rect) return;
        const cx = rect.left + rect.width / 2;
        // Anchor to the upper third, aligning with where floating damage/block numbers pop.
        const cy = rect.top + rect.height / 3;
        const layer = fxLayer();
        const img = document.createElement('img');
        img.className = 'fx-sprite';
        img.alt = '';
        img.style.width = def.size + 'px';
        img.style.height = def.size + 'px';
        img.style.left = (cx - def.size / 2) + 'px';
        img.style.top = (cy - def.size / 2) + 'px';
        img.src = 'assets/art/fx/' + name + '/0.png';
        layer.appendChild(img);
        let i = 0;
        const timer = setInterval(() => {
          i++;
          if (i >= def.frames) { clearInterval(timer); img.remove(); return; }
          img.src = 'assets/art/fx/' + name + '/' + i + '.png';
        }, def.dur);
        // Safety net in case the interval is throttled (background tab, etc.).
        setTimeout(() => { clearInterval(timer); img.remove(); }, def.dur * (def.frames + 2) + 300);
      }, 0);
    }

    // ============ 5. MAP GENERATION ============

    function generateMap(act) {
      const nodes = [];
      const nodeIds = {};
      act = act || 1;
      const guaranteed = guaranteedFloorsFor(act);

      // ELITE is capped high enough that the floor-6+ weight actually spreads
      // across the back half instead of exhausting itself by floor 8.
      //
      // Act 2 raises the elite cap and lowers the rest cap: the same sixteen
      // floors, but you are asked to spend them differently. Shops go to 3 with
      // two of them guaranteed (see GUARANTEED_FLOORS_ACT2).
      const nodeCaps = act >= 2
        ? { ELITE: 10, SHOP: 3, TREASURE: 2, REST: 5 }
        : { ELITE: 8, SHOP: 3, TREASURE: 3, REST: 6 };
      let nodeCounts = { ELITE: 0, SHOP: 0, TREASURE: 0, REST: 0 };

      for (let floor = 1; floor <= LAYOUT.FLOORS; floor++) {
        const numNodesOnFloor = floor === LAYOUT.FLOORS ? 1 : (floor === 1 ? 3 : Math.floor(3 + rand() * 3));

        // Spread nodes across distinct lanes so they don't overlap on screen.
        const lanes = [];
        for (let c = 0; c < LAYOUT.COLS; c++) lanes.push(c);
        const chosenLanes = shuffle(lanes).slice(0, numNodesOnFloor).sort((a, b) => a - b);

        for (let nodeNum = 0; nodeNum < numNodesOnFloor; nodeNum++) {
          let col;
          if (floor === LAYOUT.FLOORS) {
            col = Math.floor(LAYOUT.COLS / 2); // boss centered
          } else {
            col = chosenLanes[nodeNum];
          }
          const nodeId = `node_${floor}_${nodeNum}`;
          nodeIds[nodeId] = { floor, col };

          let nodeType;
          if (floor === 1) {
            nodeType = NODE_TYPES.COMBAT;
          } else if (floor === LAYOUT.FLOORS) {
            nodeType = NODE_TYPES.BOSS;
          } else if (floor === LAYOUT.FLOORS - 1) {
            nodeType = NODE_TYPES.REST;
          } else if (guaranteed[floor]) {
            // Whole reserved floors (like the boss/rest floors) are how we make
            // sure a shop and a treasure are reachable on EVERY path. Weighted
            // placement used to leave ~45% of runs with no shop at all, which
            // made gold and the gold relics dead in those runs.
            nodeType = guaranteed[floor];
          } else {
            // Elites ramp up in the back half so taking one is a real
            // risk/reward call rather than a rare coin flip.
            const hard = !!(STATE && STATE.ascension >= 2);
            const ramp = ELITE_RAMP[act] || ELITE_RAMP[2];
            let eliteWeight = 0;
            if (nodeCounts.ELITE < nodeCaps.ELITE) {
              for (const [from, w, wHard] of ramp) {
                if (floor >= from) { eliteWeight = hard ? wHard : w; break; }
              }
            }
            const weights = {
              [NODE_TYPES.COMBAT]: 0.42,
              [NODE_TYPES.EVENT]: 0.20,
              [NODE_TYPES.ELITE]: eliteWeight,
              [NODE_TYPES.REST]: nodeCounts.REST < nodeCaps.REST ? 0.12 : 0,
              // Shop/treasure keep a small weight so bonus ones still appear
              // beyond the guaranteed floors.
              [NODE_TYPES.SHOP]: nodeCounts.SHOP < nodeCaps.SHOP ? 0.05 : 0,
              [NODE_TYPES.TREASURE]: nodeCounts.TREASURE < nodeCaps.TREASURE ? 0.04 : 0
            };

            nodeType = weightedPick(Object.fromEntries(Object.entries(weights).filter(([k, v]) => v > 0)));
          }

          if (nodeType in nodeCounts) nodeCounts[nodeType]++;

          nodes.push({ id: nodeId, floor, col, type: nodeType, connections: [], visited: false });
        }
      }

      // Connect nodes
      for (let floor = 1; floor < LAYOUT.FLOORS; floor++) {
        const currentFloor = nodes.filter(n => n.floor === floor);
        const nextFloor = nodes.filter(n => n.floor === floor + 1);

        for (const node of currentFloor) {
          // Lanes are re-randomized every floor, so a +/-1 reach frequently
          // matched nothing and fell through to the repair pass (which forces
          // exactly one edge). +/-2 lets most nodes find real targets.
          const targetsInRange = nextFloor.filter(n => Math.abs(n.col - node.col) <= 2);
          if (targetsInRange.length > 0) {
            // Two outgoing edges is the common case, so standing on a node
            // usually means a choice. Targets are picked at random — the old
            // slice(0, n) always took the leftmost, which biased every map.
            const roll = rand();
            const numConnections = roll < 0.25 ? 1 : roll < 0.80 ? 2 : 3;
            // Shuffle first (random tie-breaking), then take the NEAREST lanes so
            // the drawn graph stays readable instead of a mess of long diagonals.
            const targets = shuffle(targetsInRange)
              .sort((a, b) => Math.abs(a.col - node.col) - Math.abs(b.col - node.col))
              .slice(0, numConnections);
            for (const target of targets) {
              if (!node.connections.includes(target.id)) node.connections.push(target.id);
            }
          }
        }
      }

      // Repair pass: ensure all nodes have paths
      for (let floor = 1; floor < LAYOUT.FLOORS; floor++) {
        const currentFloor = nodes.filter(n => n.floor === floor);
        const nextFloor = nodes.filter(n => n.floor === floor + 1);

        for (const node of currentFloor) {
          if (node.connections.length === 0 && nextFloor.length > 0) {
            const closest = nextFloor.reduce((a, b) => Math.abs(a.col - node.col) < Math.abs(b.col - node.col) ? a : b);
            node.connections.push(closest.id);
          }
        }

        for (const node of nextFloor) {
          const hasPredecessor = currentFloor.some(n => n.connections.includes(node.id));
          if (!hasPredecessor && currentFloor.length > 0) {
            const closest = currentFloor.reduce((a, b) => Math.abs(a.col - node.col) < Math.abs(b.col - node.col) ? a : b);
            if (!closest.connections.includes(node.id)) closest.connections.push(node.id);
          }
        }
      }

      // Floor 15 -> Boss
      for (const node of nodes.filter(n => n.floor === LAYOUT.FLOORS - 1)) {
        const bossNode = nodes.find(n => n.floor === LAYOUT.FLOORS);
        if (!node.connections.includes(bossNode.id)) node.connections.push(bossNode.id);
      }

      return { nodes, edges: [] };
    }

    function availableNodeIds(game) {
      if (!game.run.currentNodeId) {
        return game.run.map.nodes.filter(n => n.floor === 1).map(n => n.id);
      }
      const current = game.run.map.nodes.find(n => n.id === game.run.currentNodeId);
      return current ? current.connections : [];
    }

    function travelToNode(game, nodeId) {
      const node = game.run.map.nodes.find(n => n.id === nodeId);
      if (!node) return;

      game.run.currentNodeId = nodeId;
      node.visited = true;
      game.run.floor = node.floor;

      switch (node.type) {
        // The combat branches guard the goTo: startCombat can end the run on
        // the spot (turn-1 blight against a near-dead player), leaving combat
        // null and the screen on GAMEOVER. Do not drag the corpse back in.
        case NODE_TYPES.COMBAT:
          startCombat(game, selectEncounter(game, false));
          if (game.combat) goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.ELITE:
          startCombat(game, selectEncounter(game, true));
          if (game.combat) goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.BOSS:
          startCombat(game, selectEncounter(game, 'boss'));
          if (game.combat) goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.REST:
          goTo(SCREENS.REST);
          break;
        case NODE_TYPES.SHOP:
          goTo(SCREENS.SHOP);
          break;
        case NODE_TYPES.EVENT:
          goTo(SCREENS.EVENT);
          break;
        case NODE_TYPES.TREASURE:
          goTo(SCREENS.TREASURE);
          break;
      }
    }

    // Encounter tables. Each entry is a list of enemy ids that fight together.
    // Bands scale with floor so late floors are meaningfully harder.
    //
    // MAXIMUM FOUR BODIES PER ENTRY. .enemy-panel is
    // `flex: 0 1 clamp(13rem, 20vw, 20rem)` with a 1.25rem gap and 1.25rem row
    // padding, so at the 1000px minimum window four panels come to 932px and a
    // fifth turns .combat-enemies into a horizontal scroller mid-fight. The gate
    // measures the widest authored encounter at 1000x660 and fails on overflow.
    const ENCOUNTER_TABLES = {
      early: [ // floors 1-5
        ['ooze-crawler'], ['wraith', 'wraith'], ['molten-egg'], ['ashhound'],
        ['cultist'], ['ooze-crawler', 'molten-egg']
      ],
      mid: [ // floors 6-10
        ['shade'], ['harpy'], ['phantom', 'phantom'], ['guardian'], ['crypt-mender', 'ashhound'],
        ['basilisk'], ['wraith', 'wraith', 'ashhound'], ['cultist', 'molten-egg']
      ],
      late: [ // floors 11-15
        ['golem'], ['gravemaw'], ['revenant'], ['harpy', 'harpy'], ['grave-summoner'],
        ['gravemaw', 'ashhound'], ['revenant', 'phantom'], ['golem', 'molten-egg'], ['grave-summoner', 'crypt-mender'],
        // The late band topped out at two bodies while the only three-body fight
        // in the game sat in mid, so the last third of Act 1 was narrower than
        // its middle.
        ['wraith', 'wraith', 'revenant'], ['phantom', 'phantom', 'crypt-mender'],
        ['ashhound', 'ashhound', 'harpy']
      ]
    };

    // Every one of the eleven entries here used to be a single enemy, and `early`
    // was two of them — so every early elite on every run of every character was
    // one of exactly two fights. startCombat has always mapped over
    // encounterDef.enemies; nothing but the data was stopping groups.
    const ELITE_TABLES = {
      early: [
        ['chanter'], ['warden'],
        // Both early groups are Vicar escorts: the smallest possible version of
        // "kill the support first", at a total HP the floor-3 deck can still clear.
        ['ash-vicar', 'wraith'], ['ash-vicar', 'ashhound']
      ],
      mid: [
        ['warden'], ['pyromancer'], ['chanter'], ['mirror-thief'], ['cinder-ordinator'],
        ['ash-vicar', 'warden'], ['chanter', 'ashhound']
      ],
      late: [
        ['pyromancer'], ['leviathan'], ['warden'], ['slag-titan'], ['mirror-thief'],
        ['hollow-conductor'], ['ash-vicar', 'pyromancer'], ['cinder-ordinator', 'chanter']
      ]
    };

    // Act 2 is not Act 1 again. It used to be literally that: continueEndlessRun
    // regenerated the same sixteen floors from these same tables at +20% HP, so
    // the "deeper vault" was the shallow one with bigger numbers.
    const ACT2_ENCOUNTER_TABLES = {
      early: [
        ['emberling', 'emberling'], ['slagbeast'], ['ash-swarm', 'ash-swarm', 'ash-swarm'],
        ['hollow-acolyte', 'ashhound'], ['vault-sentinel'], ['emberling', 'ash-swarm']
      ],
      mid: [
        ['slagbeast', 'emberling'], ['vault-sentinel', 'hollow-acolyte'], ['gravemaw'],
        ['ash-swarm', 'ash-swarm', 'emberling'], ['revenant', 'ash-swarm'],
        ['slagbeast', 'ash-swarm'], ['hollow-acolyte', 'slagbeast'], ['golem', 'emberling']
      ],
      late: [
        ['slagbeast', 'slagbeast'], ['vault-sentinel', 'emberling', 'ash-swarm'],
        ['revenant', 'hollow-acolyte'], ['gravemaw', 'slagbeast'], ['golem', 'vault-sentinel'],
        ['grave-summoner', 'hollow-acolyte'], ['revenant', 'revenant'],
        // The widest authored encounter in the game, and the one the gate measures
        // at 1000x660. Four cheap-to-mid bodies, not four bricks.
        ['ash-swarm', 'ash-swarm', 'slagbeast', 'emberling']
      ]
    };

    const ACT2_ELITE_TABLES = {
      early: [
        ['furnace-warden'], ['hollow-conductor'],
        ['cinder-ordinator', 'ash-swarm'], ['ash-vicar', 'slagbeast']
      ],
      mid: [
        ['furnace-warden'], ['mirrorplate-golem'], ['slag-titan'], ['leviathan'],
        ['ash-vicar', 'furnace-warden'], ['cinder-ordinator', 'vault-sentinel'],
        ['hollow-conductor', 'emberling']
      ],
      late: [
        ['mirrorplate-golem'], ['leviathan'], ['hollow-conductor'],
        ['furnace-warden', 'ash-vicar'], ['slag-titan', 'emberling'],
        ['mirrorplate-golem', 'vault-sentinel'], ['cinder-ordinator', 'slagbeast'],
        ['furnace-warden', 'hollow-acolyte', 'ash-swarm']
      ]
    };

    // Acts own their tables AND their boss pool. The pools are disjoint, which is
    // what makes an Act 2 rematch with the boss you just killed structurally
    // impossible rather than something a filter has to remember to catch —
    // continueEndlessRun re-rolled from all four bosses, so roughly one descent in
    // four opened against the corpse you were standing on.
    const ACT_TABLES = {
      1: { encounters: ENCOUNTER_TABLES, elites: ELITE_TABLES, bosses: ['bonelord', 'archlich'] },
      2: { encounters: ACT2_ENCOUNTER_TABLES, elites: ACT2_ELITE_TABLES, bosses: ['ashen-warden', 'hollow-choir'] }
    };

    // Act 3+ has no authored content of its own, so it reuses Act 2's.
    function actTables(act) {
      return ACT_TABLES[act] || ACT_TABLES[2];
    }

    // Act 3+ is the only case that needs the filter, because it is the only case
    // where the pool it draws from is the same one the current boss came from.
    function rollBossFor(game, act) {
      const known = !!ACT_TABLES[act];
      let pool = actTables(act).bosses.filter(id => ENEMIES_DB[id]);
      if (!known && game && game.run && game.run.bossId) {
        const filtered = pool.filter(id => id !== game.run.bossId);
        if (filtered.length) pool = filtered;
      }
      return pickOne(pool);
    }

    function encounterBand(floor) {
      if (floor <= 5) return 'early';
      if (floor <= 10) return 'mid';
      return 'late';
    }

    function selectEncounter(game, type) {
      const tables = actTables(game.act || 1);
      if (type === 'boss') {
        return { enemies: [game.run.bossId || tables.bosses[0]] };
      }
      const band = encounterBand(game.run.floor);
      const table = type === true ? tables.elites : tables.encounters;
      return { enemies: pickOne(table[band]).slice() };
    }

    // ============ 6. RELIC HELPERS ============

    function hasRelic(game, relicId) {
      return game.run.relics && game.run.relics.includes(relicId);
    }

    function grantRelic(game, relicId) {
      if (!game.run.relics.includes(relicId)) {
        game.run.relics.push(relicId);
      }
    }

    // Archetype-locked relics are weighted DOWN for the wrong class rather than
    // excluded, so off-class rolls stay possible (and can still enable a pivot)
    // but an elite kill rarely hands you a relic your deck can't use at all.
    const OFF_CLASS_RELIC_WEIGHT = 0.25;

    function relicWeightFor(game, relicId) {
      const def = RELICS_DB[relicId];
      if (!def || !def.characters) return 1;
      return def.characters.includes(game.run.characterId) ? 1 : OFF_CLASS_RELIC_WEIGHT;
    }

    function getRandomRelic(game, exclude) {
      exclude = exclude || [];
      const owned = game.run.relics || [];
      const pool = Object.keys(RELICS_DB).filter(rid => !owned.includes(rid) && !exclude.includes(rid));
      if (!pool.length) return null;
      const weights = {};
      for (const rid of pool) weights[rid] = relicWeightFor(game, rid);
      return weightedPick(weights);
    }

    // Per-turn energy for this run: the base plus every owned relic's energyBonus.
    // Read once at combat start, so mid-combat relic grants don't apply until the
    // next fight (there are none today, but the rule is worth being explicit about).
    function energyMaxFor(game) {
      let max = LAYOUT.ENERGY_MAX;
      for (const rid of (game.run.relics || [])) {
        const def = RELICS_DB[rid];
        if (def && def.energyBonus) max += def.energyBonus;
      }
      return max;
    }

    function relicScratch(game, relicId) {
      if (!game.combat._relic) game.combat._relic = {};
      if (!game.combat._relic[relicId]) game.combat._relic[relicId] = {};
      return game.combat._relic[relicId];
    }

    // Fire a named void hook across every owned relic.
    function fireRelicHook(game, hookName, ...args) {
      if (!game.combat) return;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') {
          def[hookName](game, ...args);
        }
      }
    }

    // Fold a value through every owning relic's transform hook.
    function applyRelicModifier(game, hookName, value, ...args) {
      if (!game.combat) return value;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') {
          value = def[hookName](game, value, ...args);
        }
      }
      return value;
    }

    function anyRelic(game, pred) {
      return game.run.relics.some(rid => RELICS_DB[rid] && pred(RELICS_DB[rid]));
    }

    function fireNonCombatRelicHook(game, hookName, ...args) {
      if (!game || !game.run || !game.run.relics) return;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') def[hookName](game, ...args);
      }
    }

    // ============ 7. COMBAT ENGINE ============

    function startCombat(game, encounterDef) {
      const enemies = encounterDef.enemies.map(enemyDefId => {
        const template = ENEMIES_DB[enemyDefId];
        let hpScale = 1 + Math.max(0, game.run.floor - 1) * 0.035;
        if (game.ascension >= 1) hpScale += 0.10;
        hpScale += Math.max(0, (game.act || 1) - 1) * 0.20;
        if (template.isBoss && game.ascension >= 4) hpScale += 0.25;
        const scaledMaxHp = Math.max(1, Math.round(template.maxHp * hpScale));
        return {
          uid: uid(),
          defId: enemyDefId,
          name: template.name,
          hp: scaledMaxHp,
          maxHp: scaledMaxHp,
          block: 0,
          // A10 Crowned in Ash: a boss that opens with Might turns every number
          // on its intent list up, including the ones it has not shown you yet.
          statuses: (template.isBoss && game.ascension >= 10) ? { might: 2 } : {},
          intent: null,
          alive: true,
          intentIndex: 0,
          template
        };
      });

      // Innate cards surface (stably) to the top of the shuffled draw pile so
      // they land in the opening hand.
      const drawPile = shuffle(game.run.deck.map(c => ({ ...c })));
      drawPile.sort((a, b) => {
        const ai = CARDS_DB[a.defId] && CARDS_DB[a.defId].innate ? 1 : 0;
        const bi = CARDS_DB[b.defId] && CARDS_DB[b.defId].innate ? 1 : 0;
        return bi - ai;
      });

      const energyMax = energyMaxFor(game);

      game.combat = {
        enemies,
        // A9 Tainted Air: you open every fight already ticking.
        player: { block: 0, statuses: game.ascension >= 9 ? { blight: 2 } : {} },
        energy: energyMax,
        energyMax,
        drawPile,
        hand: [],
        discardPile: [],
        exhaustPile: [],
        activePowers: [],
        turnNum: 1,
        phase: 'PLAYER',
        pendingCardUid: null,
        pendingPotionSlot: null,
        _relic: {},
        log: [{ t: 1, side: 'sys', kind: 'info', text: 'Combat started.' }]
      };

      for (const enemy of game.combat.enemies) {
        chooseIntent(game, enemy);
      }

      resetLogView();   // collapse state is per-combat

      // Combat-start relic hooks.
      fireRelicHook(game, 'onCombatStart');

      startPlayerTurn(game);
    }

    function startPlayerTurn(game) {
      // Turn marker first, so everything below files under the right turn and the
      // log panel has a state snapshot to summarise the turn with.
      combatLog(game, 'sys', 'turn', `Turn ${game.combat.turnNum}`, { snap: turnSnapshot(game) });

      // Clear block at start of turn unless a relic preserves it.
      if (!anyRelic(game, r => r.preservesBlock)) game.combat.player.block = 0;

      // Per-turn relic hooks (reset flags, prime draws, etc.).
      game.combat._extraDraw = 0;
      fireRelicHook(game, 'onTurnStart');

      // Apply start-of-turn statuses (blight/mending).
      tickStatusesStartOfTurn(game, game.combat.player);
      if (game.run.hp <= 0) { checkCombatEnd(game); return; }

      // Refill energy.
      game.combat.energy = game.combat.energyMax;

      // Active POWER per-turn hooks (Inner Furnace, Card Engine, Dynamo, ...).
      // After the energy refill so energy-granting powers aren't overwritten,
      // before the draw so extra-draw powers count this turn.
      firePowerHook(game, 'onTurnStart');

      // Draw cards (base 5 + any relic/power-granted extra).
      drawCards(game, 5 + (game.combat._extraDraw || 0));

      game.combat.phase = 'PLAYER';
      game.combat._playsThisTurn = 0;
      game.combat.pendingCardUid = null;
      game.combat.pendingPotionSlot = null;
    }

    function drawCards(game, n) {
      let drew = 0;
      for (let i = 0; i < n; i++) {
        // At the hand cap, stop drawing entirely — undrawn cards stay in the
        // draw pile rather than being discarded (or worse, destroyed).
        if (game.combat.hand.length >= LAYOUT.HAND_SIZE) break;
        if (game.combat.drawPile.length === 0) {
          game.combat.drawPile = shuffle(game.combat.discardPile);
          game.combat.discardPile = [];
          if (game.combat.drawPile.length === 0) break;
        }
        game.combat.hand.push(game.combat.drawPile.shift());
        drew++;
      }
      if (drew > 0) AudioEngine.sfx('draw');
    }

    // Active POWER cards can declare hooks on their defs:
    //   onTurnStart(game, card)               — each player turn (after energy refill, before draw)
    //   onDamageTaken(game, card, ctx)        — the player took unblocked attack damage ({source, amount})
    //   onEnemyKilled(game, card, enemy)      — any enemy died (attacks, thorns, or blight)
    function firePowerHook(game, hookName, ctx) {
      if (!game.combat || !game.combat.activePowers) return;
      for (const powerCard of game.combat.activePowers) {
        const def = CARDS_DB[powerCard.defId];
        if (def && typeof def[hookName] === 'function') def[hookName](game, powerCard, ctx);
      }
    }

    function playCard(game, cardUid, targetUid) {
      const cardIdx = game.combat.hand.findIndex(c => c.uid === cardUid);
      if (cardIdx === -1) return;

      const card = game.combat.hand[cardIdx];
      const cardDef = CARDS_DB[card.defId];

      if (game.combat.pendingCardUid === cardUid && !targetUid) {
        game.combat.pendingCardUid = null;
        return;
      }

      // Unplayable cards (curses) can't be played.
      if (cardDef.unplayable) return;

      // Validate energy. X-cost cards spend all remaining energy (0 is legal).
      const isXCost = cardDef.cost === 'X';
      if (!isXCost && game.combat.energy < cardDef.cost) return;

      // Handle targeting
      if (cardDef.target === 'ENEMY_SINGLE' && !targetUid) {
        const aliveEnemies = game.combat.enemies.filter(e => e.alive);
        if (aliveEnemies.length > 1) {
          game.combat.pendingCardUid = cardUid;
          return;
        }
        if (aliveEnemies.length === 1) {
          targetUid = aliveEnemies[0].uid;
        }
      }

      // Get target
      let target = null;
      if (cardDef.target === 'ENEMY_SINGLE') {
        target = game.combat.enemies.find(e => e.uid === targetUid && e.alive);
        if (!target) return;
      }

      // X-cost cards snapshot the energy they consume; effects read card._x.
      if (isXCost) card._x = game.combat.energy;

      // Relic: Pen Nib primes an upgraded card. Temporarily treat this play as upgraded.
      const originallyUpgraded = card.upgraded;
      if (game.combat._penNibPrimed) {
        card.upgraded = true;
        game.combat._penNibPrimed = false;
      }

      // Log the play itself, before its effects resolve, so the log reads in the
      // order things happened: "You play Guard" then what it did. Without this a
      // block-only card produced no log line at all (gainBlock never logs).
      const spent = isXCost ? card._x : cardDef.cost;
      combatLog(game, 'you', 'card',
        `You play ${cardDef.name}${card.upgraded ? '+' : ''}`
        + `${target ? ` on ${target.name}` : ''} (${spent} energy).`);

      // Apply effects
      if (cardDef.custom) {
        cardDef.custom(game, target, card);
      } else if (cardDef.effects) {
        applyEffects(game, card, cardDef, target);
      }

      // Echo Loop power: the first card(s) played each turn resolve twice.
      const echoPower = game.combat.activePowers.find(p => p.defId === 'echo-loop');
      const echoLimit = echoPower ? (echoPower.upgraded ? 2 : 1) : 0;
      if (echoPower && !game.combat._echoing && (game.combat._playsThisTurn || 0) < echoLimit
          && !(cardDef.target === 'ENEMY_SINGLE' && target && !target.alive)) {
        game.combat._echoing = true;
        combatLog(game, 'you', 'power', `Echo Loop repeats ${cardDef.name}!`, { minor: true });
        if (cardDef.custom) cardDef.custom(game, target, card);
        else if (cardDef.effects) applyEffects(game, card, cardDef, target);
        game.combat._echoing = false;
      }

      card.upgraded = originallyUpgraded;

      // Relic hooks reacting to a card being played (War Drums, Pen Nib, ...).
      fireRelicHook(game, 'onCardPlayed', card, cardDef);

      // ...and the POWER equivalent. firePowerHook has always been generic, but
      // the engine only ever called it with onTurnStart / onDamageTaken /
      // onEnemyKilled, so play-triggered powers were impossible to write. One
      // line to an existing dispatcher, not a new hook system.
      //
      // Deliberately AFTER the Echo Loop block: firing inside the replay would
      // make an echoed card trigger twice, so Ordnance Rack would silently do
      // double duty on the first card each turn.
      firePowerHook(game, 'onCardPlayed', { card, def: cardDef });

      // Move card
      game.combat.hand.splice(cardIdx, 1);
      if (cardDef.type === CARD_TYPES.POWER) {
        game.combat.activePowers.push(card);
      } else if (cardDef.exhaust) {
        game.combat.exhaustPile.push(card);
      } else {
        game.combat.discardPile.push(card);
      }

      game.combat.energy -= isXCost ? card._x : cardDef.cost;
      if (isXCost) delete card._x;
      game.combat._playsThisTurn = (game.combat._playsThisTurn || 0) + 1;
      game.combat.pendingCardUid = null;

      // SFX cue by card type (block/hit cues come from the damage/block floats)
      if (cardDef.type === CARD_TYPES.ATTACK) AudioEngine.sfx('attack');
      else if (cardDef.type === CARD_TYPES.POWER) AudioEngine.sfx('power');

      checkCombatEnd(game);
    }

    function applyEffects(game, card, cardDef, target) {
      const values = (card.upgraded && cardDef.upgradedValues) ? cardDef.upgradedValues : (cardDef.values || {});

      for (const effect of cardDef.effects) {
        if (effect.type === 'DAMAGE') {
          if (cardDef.target === 'ENEMY_ALL') {
            for (const enemy of game.combat.enemies.filter(e => e.alive)) {
              dealDamage(game, game.combat.player, enemy, values[effect.key]);
            }
          } else if (target) {
            dealDamage(game, game.combat.player, target, values[effect.key]);
          }
        } else if (effect.type === 'BLOCK') {
          gainBlock(game.combat.player, values[effect.key]);
        } else if (effect.type === 'DRAW') {
          drawCards(game, effect.value);
        } else if (effect.type === 'ENERGY') {
          game.combat.energy += effect.value;
        } else if (effect.type === 'HEAL') {
          game.run.hp = Math.min(game.run.maxHp, game.run.hp + effect.value);
        } else if (effect.type === 'APPLY_STATUS') {
          // Fans out on ENEMY_ALL, mirroring the DAMAGE branch above.
          //
          // It did not, and playCard() leaves `target` null for ENEMY_ALL cards,
          // so this branch simply never ran for them. Toxic Cloud — a 2-cost
          // uncommon whose ONLY effect is APPLY_STATUS on ENEMY_ALL, with no
          // custom() fallback — did literally nothing at all. Immolate and Spore
          // Burst dealt their damage and applied zero of their Blight. All three
          // belong to Plague Seer, whose entire identity is stacking Blight.
          const base = effect.key != null ? values[effect.key] : effect.value;
          if (cardDef.target === 'ENEMY_ALL') {
            for (const enemy of game.combat.enemies.filter(e => e.alive)) {
              applyPlayerStatus(game, enemy, effect.status, base);
            }
          } else if (target) {
            applyPlayerStatus(game, target, effect.status, base);
          }
        } else if (effect.type === 'APPLY_SELF_STATUS') {
          const base = effect.key != null ? values[effect.key] : effect.value;
          applyPlayerStatus(game, game.combat.player, effect.status, base);
        }
      }
    }

    function endPlayerTurn(game) {
      // In-hand end-of-turn card effects (e.g. Decay curse) run before the hand
      // resolves, so retained cards still pay their in-hand price.
      for (const card of game.combat.hand) {
        const def = CARDS_DB[card.defId];
        if (def && typeof def.onEndTurnInHand === 'function') def.onEndTurnInHand(game, card);
      }

      // Resolve the hand: Retain keeps a card, Ethereal exhausts it, the rest discard.
      const kept = [];
      for (const card of game.combat.hand) {
        const def = CARDS_DB[card.defId] || {};
        if (def.retain) kept.push(card);
        else if (def.ethereal) game.combat.exhaustPile.push(card);
        else game.combat.discardPile.push(card);
      }
      game.combat.hand = kept;

      tickStatusesEndOfTurn(game.combat.player);

      if (game.run.hp <= 0) { checkCombatEnd(game); return; }

      game.combat.phase = 'ENEMY';
      runEnemyTurn(game);
    }

    function runEnemyTurn(game) {
      combatLog(game, 'sys', 'phase', 'Enemy turn');
      for (const enemy of game.combat.enemies.filter(e => e.alive)) {
        enemy.block = 0;
        tickStatusesStartOfTurn(game, enemy);
        if (allEnemiesDefeated(game)) { checkCombatEnd(game); return; }
        if (!enemy.alive) continue;
        executeIntent(game, enemy);
        if (game.run.hp <= 0 || allEnemiesDefeated(game)) { checkCombatEnd(game); return; }
      }

      if (allEnemiesDefeated(game)) { checkCombatEnd(game); return; }

      for (const enemy of game.combat.enemies) {
        tickStatusesEndOfTurn(enemy);
        chooseIntent(game, enemy);
      }

      game.combat.turnNum++;
      startPlayerTurn(game);
    }

    function executeIntent(game, enemy) {
      if (!enemy.intent) return;

      const intent = enemy.intent;
      // Every branch logs. applyStatus() and gainBlock() are shared with cards and
      // relics and carry no actor, so attribution has to happen here at the call
      // site — otherwise these six intents resolve completely silently, which is
      // why enemy turns used to be impossible to follow.
      switch (intent.type) {
        case 'ATTACK':
          dealDamage(game, enemy, game.combat.player, intent.value);
          break;
        case 'ATTACK_ALL':
          dealDamage(game, enemy, game.combat.player, intent.value);
          break;
        case 'BUFF_MIGHT':
          applyStatus(enemy, 'might', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} gains ${intent.value} Might.`);
          break;
        case 'BLOCK_INTENT': {
          const before = enemy.block;
          gainBlock(enemy, intent.value);
          combatLog(game, 'foe', 'block', `${enemy.name} gains ${enemy.block - before} block.`);
          break;
        }
        case 'SAPPED':
          applyStatus(game.combat.player, 'sapped', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Sapped to you.`);
          break;
        case 'EXPOSED':
          applyStatus(game.combat.player, 'exposed', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Exposed to you.`);
          break;
        case 'BLIGHT':
          applyStatus(game.combat.player, 'blight', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Blight to you.`);
          break;
        case 'BRITTLE':
          applyStatus(game.combat.player, 'brittle', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Brittle to you.`);
          break;
        case 'HEAL': {
          const wounded = game.combat.enemies.filter(e => e.alive && e.hp < e.maxHp);
          const target = wounded.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || enemy;
          target.hp = Math.min(target.maxHp, target.hp + intent.value);
          combatLog(game, 'foe', 'heal', `${enemy.name} healed ${target.name} for ${intent.value}.`);
          break;
        }
        case 'ADD_CURSE': {
          // Honours `value` and an optional `pile`. It used to push exactly one
          // card into the discard pile regardless of what the intent declared —
          // invisible while both users happened to declare value: 1, but it is
          // what makes the status-card tier possible.
          const cardId = intent.cardId || 'curse-doubt';
          const def = CARDS_DB[cardId];
          if (!def) break;
          const count = Math.max(1, intent.value || 1);
          const pile = intent.pile || 'discard';
          for (let i = 0; i < count; i++) {
            const inst = { uid: uid(), defId: cardId, upgraded: false };
            if (pile === 'draw') {
              // Shuffled in, not stacked on top: landing three Cinders as your
              // next three draws is a different (and much worse) card than one
              // that pollutes the pile.
              const d = game.combat.drawPile;
              d.splice(Math.floor(rand() * (d.length + 1)), 0, inst);
            } else if (pile === 'hand' && game.combat.hand.length < LAYOUT.HAND_SIZE) {
              game.combat.hand.push(inst);
            } else {
              game.combat.discardPile.push(inst);
            }
