      const weights = {};
      for (const rid of pool) weights[rid] = relicWeightFor(game, rid);
      return weightedPick(weights);
    }

    // Per-turn energy for this run: the base plus every owned relic's energyBonus.
    // Read once at combat start, so mid-combat relic grants don't apply until the
    // next fight (there are none today, but the rule is worth being explicit about).
    function energyMaxFor(game) {
      let max = LAYOUT.ENERGY_MAX;
      for (const rid of (game.run.relics || [])) {
        const def = RELICS_DB[rid];
        if (def && def.energyBonus) max += def.energyBonus;
      }
      return max;
    }

    function relicScratch(game, relicId) {
      if (!game.combat._relic) game.combat._relic = {};
      if (!game.combat._relic[relicId]) game.combat._relic[relicId] = {};
      return game.combat._relic[relicId];
    }

    // Fire a named void hook across every owned relic.
    function fireRelicHook(game, hookName, ...args) {
      if (!game.combat) return;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') {
          def[hookName](game, ...args);
        }
      }
    }

    // Fold a value through every owning relic's transform hook.
    function applyRelicModifier(game, hookName, value, ...args) {
      if (!game.combat) return value;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') {
          value = def[hookName](game, value, ...args);
        }
      }
      return value;
    }

    function anyRelic(game, pred) {
      return game.run.relics.some(rid => RELICS_DB[rid] && pred(RELICS_DB[rid]));
    }

    function fireNonCombatRelicHook(game, hookName, ...args) {
      if (!game || !game.run || !game.run.relics) return;
      for (const rid of game.run.relics) {
        const def = RELICS_DB[rid];
        if (def && typeof def[hookName] === 'function') def[hookName](game, ...args);
      }
    }

    // ============ 7. COMBAT ENGINE ============

    function startCombat(game, encounterDef) {
      const enemies = encounterDef.enemies.map(enemyDefId => {
        const template = ENEMIES_DB[enemyDefId];
        let hpScale = 1 + Math.max(0, game.run.floor - 1) * 0.035;
        if (game.ascension >= 1) hpScale += 0.10;
        hpScale += Math.max(0, (game.act || 1) - 1) * 0.20;
        if (template.isBoss && game.ascension >= 4) hpScale += 0.25;
        const scaledMaxHp = Math.max(1, Math.round(template.maxHp * hpScale));
        return {
          uid: uid(),
          defId: enemyDefId,
          name: template.name,
          hp: scaledMaxHp,
          maxHp: scaledMaxHp,
          block: 0,
          statuses: {},
          intent: null,
          alive: true,
          intentIndex: 0,
          template
        };
      });

      // Innate cards surface (stably) to the top of the shuffled draw pile so
      // they land in the opening hand.
      const drawPile = shuffle(game.run.deck.map(c => ({ ...c })));
      drawPile.sort((a, b) => {
        const ai = CARDS_DB[a.defId] && CARDS_DB[a.defId].innate ? 1 : 0;
        const bi = CARDS_DB[b.defId] && CARDS_DB[b.defId].innate ? 1 : 0;
        return bi - ai;
      });

      const energyMax = energyMaxFor(game);

      game.combat = {
        enemies,
        player: { block: 0, statuses: {} },
        energy: energyMax,
        energyMax,
        drawPile,
        hand: [],
        discardPile: [],
        exhaustPile: [],
        activePowers: [],
        turnNum: 1,
        phase: 'PLAYER',
        pendingCardUid: null,
        pendingPotionSlot: null,
        _relic: {},
        log: [{ t: 1, side: 'sys', kind: 'info', text: 'Combat started.' }]
      };

      for (const enemy of game.combat.enemies) {
        chooseIntent(game, enemy);
      }

      resetLogView();   // collapse state is per-combat

      // Combat-start relic hooks.
      fireRelicHook(game, 'onCombatStart');

      startPlayerTurn(game);
    }

    function startPlayerTurn(game) {
      // Turn marker first, so everything below files under the right turn and the
      // log panel has a state snapshot to summarise the turn with.
      combatLog(game, 'sys', 'turn', `Turn ${game.combat.turnNum}`, { snap: turnSnapshot(game) });

      // Clear block at start of turn unless a relic preserves it.
      if (!anyRelic(game, r => r.preservesBlock)) game.combat.player.block = 0;

      // Per-turn relic hooks (reset flags, prime draws, etc.).
      game.combat._extraDraw = 0;
      fireRelicHook(game, 'onTurnStart');

      // Apply start-of-turn statuses (blight/mending).
      tickStatusesStartOfTurn(game, game.combat.player);
      if (game.run.hp <= 0) { checkCombatEnd(game); return; }

      // Refill energy.
      game.combat.energy = game.combat.energyMax;

      // Active POWER per-turn hooks (Inner Furnace, Card Engine, Dynamo, ...).
      // After the energy refill so energy-granting powers aren't overwritten,
      // before the draw so extra-draw powers count this turn.
      firePowerHook(game, 'onTurnStart');

      // Draw cards (base 5 + any relic/power-granted extra).
      drawCards(game, 5 + (game.combat._extraDraw || 0));

      game.combat.phase = 'PLAYER';
      game.combat._playsThisTurn = 0;
      game.combat.pendingCardUid = null;
      game.combat.pendingPotionSlot = null;
    }

    function drawCards(game, n) {
      let drew = 0;
      for (let i = 0; i < n; i++) {
        // At the hand cap, stop drawing entirely — undrawn cards stay in the
        // draw pile rather than being discarded (or worse, destroyed).
        if (game.combat.hand.length >= LAYOUT.HAND_SIZE) break;
        if (game.combat.drawPile.length === 0) {
          game.combat.drawPile = shuffle(game.combat.discardPile);
          game.combat.discardPile = [];
          if (game.combat.drawPile.length === 0) break;
        }
        game.combat.hand.push(game.combat.drawPile.shift());
        drew++;
      }
      if (drew > 0) AudioEngine.sfx('draw');
    }

    // Active POWER cards can declare hooks on their defs:
    //   onTurnStart(game, card)               — each player turn (after energy refill, before draw)
    //   onDamageTaken(game, card, ctx)        — the player took unblocked attack damage ({source, amount})
    //   onEnemyKilled(game, card, enemy)      — any enemy died (attacks, thorns, or blight)
    function firePowerHook(game, hookName, ctx) {
      if (!game.combat || !game.combat.activePowers) return;
      for (const powerCard of game.combat.activePowers) {
        const def = CARDS_DB[powerCard.defId];
        if (def && typeof def[hookName] === 'function') def[hookName](game, powerCard, ctx);
      }
    }

    function playCard(game, cardUid, targetUid) {
      const cardIdx = game.combat.hand.findIndex(c => c.uid === cardUid);
      if (cardIdx === -1) return;

      const card = game.combat.hand[cardIdx];
      const cardDef = CARDS_DB[card.defId];

      if (game.combat.pendingCardUid === cardUid && !targetUid) {
        game.combat.pendingCardUid = null;
        return;
      }

      // Unplayable cards (curses) can't be played.
      if (cardDef.unplayable) return;

      // Validate energy. X-cost cards spend all remaining energy (0 is legal).
      const isXCost = cardDef.cost === 'X';
      if (!isXCost && game.combat.energy < cardDef.cost) return;

      // Handle targeting
      if (cardDef.target === 'ENEMY_SINGLE' && !targetUid) {
        const aliveEnemies = game.combat.enemies.filter(e => e.alive);
        if (aliveEnemies.length > 1) {
          game.combat.pendingCardUid = cardUid;
          return;
        }
        if (aliveEnemies.length === 1) {
          targetUid = aliveEnemies[0].uid;
        }
      }

      // Get target
      let target = null;
      if (cardDef.target === 'ENEMY_SINGLE') {
        target = game.combat.enemies.find(e => e.uid === targetUid && e.alive);
        if (!target) return;
      }

      // X-cost cards snapshot the energy they consume; effects read card._x.
      if (isXCost) card._x = game.combat.energy;

      // Relic: Pen Nib primes an upgraded card. Temporarily treat this play as upgraded.
      const originallyUpgraded = card.upgraded;
      if (game.combat._penNibPrimed) {
        card.upgraded = true;
        game.combat._penNibPrimed = false;
      }

      // Log the play itself, before its effects resolve, so the log reads in the
      // order things happened: "You play Guard" then what it did. Without this a
      // block-only card produced no log line at all (gainBlock never logs).
      const spent = isXCost ? card._x : cardDef.cost;
      combatLog(game, 'you', 'card',
        `You play ${cardDef.name}${card.upgraded ? '+' : ''}`
        + `${target ? ` on ${target.name}` : ''} (${spent} energy).`);

      // Apply effects
      if (cardDef.custom) {
        cardDef.custom(game, target, card);
      } else if (cardDef.effects) {
        applyEffects(game, card, cardDef, target);
      }

      // Echo Loop power: the first card(s) played each turn resolve twice.
      const echoPower = game.combat.activePowers.find(p => p.defId === 'echo-loop');
      const echoLimit = echoPower ? (echoPower.upgraded ? 2 : 1) : 0;
      if (echoPower && !game.combat._echoing && (game.combat._playsThisTurn || 0) < echoLimit
          && !(cardDef.target === 'ENEMY_SINGLE' && target && !target.alive)) {
        game.combat._echoing = true;
        combatLog(game, 'you', 'power', `Echo Loop repeats ${cardDef.name}!`, { minor: true });
        if (cardDef.custom) cardDef.custom(game, target, card);
        else if (cardDef.effects) applyEffects(game, card, cardDef, target);
        game.combat._echoing = false;
      }

      card.upgraded = originallyUpgraded;

      // Relic hooks reacting to a card being played (War Drums, Pen Nib, ...).
      fireRelicHook(game, 'onCardPlayed', card, cardDef);

      // Move card
      game.combat.hand.splice(cardIdx, 1);
      if (cardDef.type === CARD_TYPES.POWER) {
        game.combat.activePowers.push(card);
      } else if (cardDef.exhaust) {
        game.combat.exhaustPile.push(card);
      } else {
        game.combat.discardPile.push(card);
      }

      game.combat.energy -= isXCost ? card._x : cardDef.cost;
      if (isXCost) delete card._x;
      game.combat._playsThisTurn = (game.combat._playsThisTurn || 0) + 1;
      game.combat.pendingCardUid = null;

      // SFX cue by card type (block/hit cues come from the damage/block floats)
      if (cardDef.type === CARD_TYPES.ATTACK) AudioEngine.sfx('attack');
      else if (cardDef.type === CARD_TYPES.POWER) AudioEngine.sfx('power');

      checkCombatEnd(game);
    }

    function applyEffects(game, card, cardDef, target) {
      const values = (card.upgraded && cardDef.upgradedValues) ? cardDef.upgradedValues : (cardDef.values || {});

      for (const effect of cardDef.effects) {
        if (effect.type === 'DAMAGE') {
          if (cardDef.target === 'ENEMY_ALL') {
            for (const enemy of game.combat.enemies.filter(e => e.alive)) {
              dealDamage(game, game.combat.player, enemy, values[effect.key]);
            }
          } else if (target) {
            dealDamage(game, game.combat.player, target, values[effect.key]);
          }
        } else if (effect.type === 'BLOCK') {
          gainBlock(game.combat.player, values[effect.key]);
        } else if (effect.type === 'DRAW') {
          drawCards(game, effect.value);
        } else if (effect.type === 'ENERGY') {
          game.combat.energy += effect.value;
        } else if (effect.type === 'HEAL') {
          game.run.hp = Math.min(game.run.maxHp, game.run.hp + effect.value);
        } else if (effect.type === 'APPLY_STATUS') {
          if (target) {
            const base = effect.key != null ? values[effect.key] : effect.value;
            applyPlayerStatus(game, target, effect.status, base);
          }
        } else if (effect.type === 'APPLY_SELF_STATUS') {
          const base = effect.key != null ? values[effect.key] : effect.value;
          applyPlayerStatus(game, game.combat.player, effect.status, base);
        }
      }
    }

    function endPlayerTurn(game) {
      // In-hand end-of-turn card effects (e.g. Decay curse) run before the hand
      // resolves, so retained cards still pay their in-hand price.
      for (const card of game.combat.hand) {
        const def = CARDS_DB[card.defId];
        if (def && typeof def.onEndTurnInHand === 'function') def.onEndTurnInHand(game, card);
      }

      // Resolve the hand: Retain keeps a card, Ethereal exhausts it, the rest discard.
      const kept = [];
      for (const card of game.combat.hand) {
        const def = CARDS_DB[card.defId] || {};
        if (def.retain) kept.push(card);
        else if (def.ethereal) game.combat.exhaustPile.push(card);
        else game.combat.discardPile.push(card);
      }
      game.combat.hand = kept;

      tickStatusesEndOfTurn(game.combat.player);

      if (game.run.hp <= 0) { checkCombatEnd(game); return; }

      game.combat.phase = 'ENEMY';
      runEnemyTurn(game);
    }

    function runEnemyTurn(game) {
      combatLog(game, 'sys', 'phase', 'Enemy turn');
      for (const enemy of game.combat.enemies.filter(e => e.alive)) {
        enemy.block = 0;
        tickStatusesStartOfTurn(game, enemy);
        if (allEnemiesDefeated(game)) { checkCombatEnd(game); return; }
        if (!enemy.alive) continue;
        executeIntent(game, enemy);
        if (game.run.hp <= 0 || allEnemiesDefeated(game)) { checkCombatEnd(game); return; }
      }

      if (allEnemiesDefeated(game)) { checkCombatEnd(game); return; }

      for (const enemy of game.combat.enemies) {
        tickStatusesEndOfTurn(enemy);
        chooseIntent(game, enemy);
      }

      game.combat.turnNum++;
      startPlayerTurn(game);
    }

    function executeIntent(game, enemy) {
      if (!enemy.intent) return;

      const intent = enemy.intent;
      // Every branch logs. applyStatus() and gainBlock() are shared with cards and
      // relics and carry no actor, so attribution has to happen here at the call
      // site — otherwise these six intents resolve completely silently, which is
      // why enemy turns used to be impossible to follow.
      switch (intent.type) {
        case 'ATTACK':
          dealDamage(game, enemy, game.combat.player, intent.value);
          break;
        case 'ATTACK_ALL':
          dealDamage(game, enemy, game.combat.player, intent.value);
          break;
        case 'BUFF_MIGHT':
          applyStatus(enemy, 'might', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} gains ${intent.value} Might.`);
          break;
        case 'BLOCK_INTENT': {
          const before = enemy.block;
          gainBlock(enemy, intent.value);
          combatLog(game, 'foe', 'block', `${enemy.name} gains ${enemy.block - before} block.`);
          break;
        }
        case 'SAPPED':
          applyStatus(game.combat.player, 'sapped', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Sapped to you.`);
          break;
        case 'EXPOSED':
          applyStatus(game.combat.player, 'exposed', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Exposed to you.`);
          break;
        case 'BLIGHT':
          applyStatus(game.combat.player, 'blight', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Blight to you.`);
          break;
        case 'BRITTLE':
          applyStatus(game.combat.player, 'brittle', intent.value);
          combatLog(game, 'foe', 'status', `${enemy.name} applies ${intent.value} Brittle to you.`);
          break;
        case 'HEAL': {
          const wounded = game.combat.enemies.filter(e => e.alive && e.hp < e.maxHp);
          const target = wounded.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0] || enemy;
          target.hp = Math.min(target.maxHp, target.hp + intent.value);
          combatLog(game, 'foe', 'heal', `${enemy.name} healed ${target.name} for ${intent.value}.`);
          break;
        }
        case 'ADD_CURSE': {
          const cardId = intent.cardId || 'curse-doubt';
          game.combat.discardPile.push({ uid: uid(), defId: cardId, upgraded: false });
          combatLog(game, 'foe', 'status', `${enemy.name} added ${CARDS_DB[cardId].name} to your discard pile.`);
          break;
        }
        case 'SUMMON': {
          summonEnemy(game, intent.enemyId || 'wraith');
          combatLog(game, 'foe', 'status', `${enemy.name} summoned help!`);
          break;
        }
      }
    }

    function parseIntentToken(token) {
      if (!token) return { type: 'UNKNOWN', value: 0 };
      const numeric = (regex, type) => {
        const match = token.match(regex);
        return match ? { type, value: parseInt(match[1], 10) } : null;
      };
      return numeric(/^ATK(\d+)$/, 'ATTACK')
        || numeric(/^ATK-ALL(\d+)$/, 'ATTACK_ALL')
        || numeric(/^SAPPED(\d+)$/, 'SAPPED')
        || numeric(/^EXPOSED(\d+)$/, 'EXPOSED')
        || numeric(/^BLIGHT(\d+)$/, 'BLIGHT')
        || numeric(/^BRITTLE(\d+)$/, 'BRITTLE')
        || numeric(/^BUFF_MIGHT(\d+)$/, 'BUFF_MIGHT')
        || numeric(/^BLOCK(\d+)$/, 'BLOCK_INTENT')
        || numeric(/^HEAL(\d+)$/, 'HEAL')
        || { type: 'UNKNOWN', value: 0, raw: token };
    }

    function chooseIntent(game, enemy) {
      let intentStr;

      if (enemy.template.getIntent) {
        const result = enemy.template.getIntent(enemy, game.combat);
        enemy.intent = result || { type: 'UNKNOWN', value: 0 };
      } else if (enemy.template.pattern) {
        intentStr = enemy.template.pattern[enemy.intentIndex % enemy.template.pattern.length];
        enemy.intentIndex++;
        enemy.intent = parseIntentToken(intentStr);
      }
    }

    function checkCombatEnd(game) {
      if (game.run.hp <= 0) {
        recordRunResult(game, false);
        goTo(SCREENS.GAMEOVER);
        return;
      }

      const allDead = game.combat.enemies.every(e => e.hp <= 0 || !e.alive);
      if (!allDead) return;

      for (const enemy of game.combat.enemies) {
        if (enemy.hp <= 0) enemy.alive = false;
      }

      const isElite = game.combat.enemies.some(e => e.template.isElite);
      const isBoss = game.combat.enemies.some(e => e.template.isBoss);

      const eventReward = game.ui.eventRewardOverride || null;
      let gold = rollCombatGold(game, isElite, isBoss) + (eventReward && eventReward.gold ? eventReward.gold : 0);
      game.run.gold += gold;
      AudioEngine.sfx('reward');
      combatLog(game, 'sys', 'info', `Combat won! Gained ${gold} gold.`);

      let relicId = null;
      const maxHpBefore = game.run.maxHp;
      let eventRewardText = eventReward && eventReward.text ? eventReward.text : '';
      if (isElite) {
        relicId = getRandomRelic(game);
        if (relicId) grantRelic(game, relicId);
        gainMaxHp(game, 2, true);
      }
      if (eventReward) {
        if (eventReward.relicId === 'random') {
          const eventRelic = getRandomRelic(game);
          if (eventRelic) { grantRelic(game, eventRelic); relicId = relicId || eventRelic; }
        } else if (eventReward.relicId && RELICS_DB[eventReward.relicId]) {
          grantRelic(game, eventReward.relicId);
          relicId = relicId || eventReward.relicId;
        }
        if (eventReward.maxHp) gainMaxHp(game, eventReward.maxHp, true);
        fireNonCombatRelicHook(game, 'onEventComplete', { eventCombat: true, reward: eventReward });
        game.ui.eventRewardOverride = null;
      }

      // End-of-combat relic hooks (Prayer Beads, Hand of Greed, Vulture Feather, ...).
      fireRelicHook(game, 'onCombatEnd', { isElite, isBoss });

      // Max-HP delta across the whole payout (elite bonus, event rewards, relic
      // hooks like Vital Ember) so the reward banner reports the true total.
      const maxHpGained = game.run.maxHp - maxHpBefore;

      if (isBoss) {
        recordRunResult(game, true);
        goTo(SCREENS.VICTORY);
        return;
      }

      // Build a reward bundle: gold (already granted) + maybe a potion + a card choice.
      let potionId = null;
      const potionSlotFree = game.run.potions.some(p => p === null);
      if (eventReward && eventReward.potionId) {
        potionId = eventReward.potionId;
      } else if (potionSlotFree && rand() < 0.30) {
        potionId = pickOne(Object.keys(POTIONS_DB));
      }
      game.ui.combatReward = {
        gold,
        potionId,
        potionTaken: false,
        relicId,
        maxHpGained,
        eventRewardText,
        isElite,
        isBoss
      };
      goTo(SCREENS.CARD_REWARD);
    }

    function startEventCombat(game, enemyIds, rewardOverride) {
      game.ui.eventRewardOverride = rewardOverride || {};
      startCombat(game, { enemies: enemyIds && enemyIds.length ? enemyIds : ['warden'] });
      goTo(SCREENS.COMBAT);
    }

    function continueEndlessRun(game) {
      if (!game || !game.run) return;
      game.act = (game.act || 1) + 1;
      game.combat = null;
      game.ui = {};
      game.run.floor = 1;
      game.run.currentNodeId = null;
      game.run.seenEventIds = [];
      // Each endless act resets the removal price ladder along with the economy.
      game.run.removalsThisRun = 0;
      healRun(game, Math.floor(game.run.maxHp * 0.25), 'Endless respite');
      const bossPool = Object.values(ENEMIES_DB).filter(e => e.isBoss);
      game.run.bossId = pickOne(bossPool).id;
      game.run.bossName = ENEMIES_DB[game.run.bossId].name;
      game.run.map = generateMap();
      goTo(SCREENS.MAP);
    }

    function rollCombatGold(game, isElite, isBoss) {
      const band = encounterBand(game.run.floor);
      const ranges = {
        early: { normal: [12, 20], elite: [35, 50] },
        mid: { normal: [18, 30], elite: [45, 65] },
        late: { normal: [26, 42], elite: [60, 85] }
      };
      let lo, hi;
      if (isBoss) [lo, hi] = [90, 120];
      else [lo, hi] = isElite ? ranges[band].elite : ranges[band].normal;
      let gold = lo + Math.floor(rand() * (hi - lo + 1));
      gold = Math.floor(gold * (1 + Math.max(0, (game.act || 1) - 1) * 0.15));
      if (game.ascension >= 3) gold = Math.floor(gold * 0.85);
      return gold;
    }

    function allEnemiesDefeated(game) {
      return !!(game && game.combat) && game.combat.enemies.every(e => e.hp <= 0 || !e.alive);
    }

    function summonEnemy(game, enemyDefId) {
      const template = ENEMIES_DB[enemyDefId];
      if (!template || !game.combat) return null;
      let hpScale = 1 + Math.max(0, game.run.floor - 1) * 0.035;
      if (game.ascension >= 1) hpScale += 0.10;
      hpScale += Math.max(0, (game.act || 1) - 1) * 0.20;
      const scaledMaxHp = Math.max(1, Math.round(template.maxHp * hpScale));
      const enemy = { uid: uid(), defId: enemyDefId, name: template.name, hp: scaledMaxHp, maxHp: scaledMaxHp, block: 0, statuses: {}, intent: null, alive: true, intentIndex: 0, template };
      chooseIntent(game, enemy);
      game.combat.enemies.push(enemy);
      return enemy;
    }

    function dealDamage(game, source, target, baseAmount, ctx) {
      ctx = ctx || {};
      const isPlayerTarget = target === game.combat.player;
      const sourceIsPlayer = source === game.combat.player;

      let amount = baseAmount + (source.statuses.might || 0);

      // Player attack damage modifiers (Brass Knuckles, Cracked Whetstone, ...).
      // Thorns/reactive damage is not an "attack" and skips these.
      if (sourceIsPlayer && !ctx.thorns) {
        amount = applyRelicModifier(game, 'modifyOutgoingDamage', amount, { isAttack: ctx.isAttack !== false, target });
      }

      if (source.statuses.sapped) amount = Math.floor(amount * 0.75);
      if (target.statuses.exposed) amount = Math.floor(amount * 1.5);
      amount = Math.max(0, amount);

      // Block absorbs first; leftover block persists.
      const blocked = Math.min(target.block, amount);
      target.block -= blocked;
      const hpDamage = amount - blocked;

      if (hpDamage > 0) {
        if (isPlayerTarget) {
          game.run.hp -= hpDamage;
        } else {
          target.hp -= hpDamage;
        }
      }

      combatLog(game, sourceIsPlayer ? 'you' : 'foe', 'attack', `${sourceIsPlayer ? 'You' : (source.name || 'Enemy')} dealt ${hpDamage} damage${blocked > 0 ? ` (${blocked} blocked)` : ''}${isPlayerTarget ? ' to you' : ' to ' + target.name}.`);
      spawnFloatingNumber(isPlayerTarget ? 'player' : target.uid, hpDamage > 0 ? `-${hpDamage}` : (blocked > 0 ? 'blocked' : '0'), hpDamage > 0 ? 'dmg' : 'block');
      if (hpDamage > 0 && !isPlayerTarget) playEffect(target.uid, 'attack');  // fiery burst on the struck enemy

      if (isPlayerTarget) {
        if (game.run.hp <= 0) game.run.hp = 0;
        if (hpDamage > 0) {
          fireRelicHook(game, 'onDamageTaken', hpDamage);
          // Retaliation powers (Thorn Plate, Corrosive Aura). Thorns damage
          // itself never re-triggers them.
          if (!ctx.thorns) firePowerHook(game, 'onDamageTaken', { source, amount: hpDamage });
        }
      } else {
        if (sourceIsPlayer && hpDamage > 0) fireRelicHook(game, 'onDamageDealt', hpDamage);
        if (target.hp <= 0) {
          target.hp = 0;
          if (target.alive) {
            target.alive = false;
            AudioEngine.sfx('death');
            combatLog(game, 'you', 'death', `${target.name} was defeated!`);
            if (target.template && typeof target.template.onDeath === 'function') target.template.onDeath(game, target);
            firePowerHook(game, 'onEnemyKilled', target);
          }
        }
      }
    }

    function gainBlock(entity, amount) {
      const statuses = entity.statuses || {};
      let total = amount + (statuses.warded || 0);
      // Brittle cuts the whole gain (after Warded) by 25%.
      if (statuses.brittle) total = Math.floor(total * 0.75);
      entity.block += total;
      // Shield-orb feedback only when the player gains block (not enemies, not combat-start relics before render).
      if (STATE && STATE.combat && entity === STATE.combat.player) playEffect('player', 'block');
    }

    const DEBUFF_STATUSES = ['sapped', 'exposed', 'blight', 'brittle'];

    function applyStatus(entity, statusName, stacks) {
      if (!entity || !entity.statuses || !statusName || !stacks) return;
      // Aegis eats the next incoming debuff, one stack per debuff.
      if (stacks > 0 && DEBUFF_STATUSES.includes(statusName) && entity.statuses.aegis) {
        entity.statuses.aegis--;
        if (entity.statuses.aegis <= 0) delete entity.statuses.aegis;
        // Worth logging: without this, a debuff simply fails to appear and the
        // player has no way to tell Aegis absorbed it. No `game` in scope here, so
        // read the live STATE the way gainBlock() already does for its FX.
        if (STATE && STATE.combat) {
          const isPlayer = entity === STATE.combat.player;
          combatLog(STATE, isPlayer ? 'you' : 'foe', 'status',
            `Aegis absorbs ${stacks} ${statusName} on ${isPlayer ? 'you' : (entity.name || 'an enemy')}.`);
        }
        return;
      }
      if (!entity.statuses[statusName]) entity.statuses[statusName] = 0;
      entity.statuses[statusName] += stacks;
    }

    function applyPlayerStatus(game, entity, statusName, stacks) {
      const modified = applyRelicModifier(game, 'modifyStatusApply', stacks, statusName);
      applyStatus(entity, statusName, modified);
    }

    function tickStatusesStartOfTurn(game, entity) {
      const isPlayer = entity === game.combat.player;

      // Grace grants its stacks as Block at the start of each turn (does not decay).
      if (entity.statuses.grace) gainBlock(entity, entity.statuses.grace);

      if (entity.statuses.mending) {
        const heal = entity.statuses.mending;
        if (isPlayer) game.run.hp = Math.min(game.run.maxHp, game.run.hp + heal);
        else entity.hp = Math.min(entity.maxHp, entity.hp + heal);
        combatLog(game, isPlayer ? 'you' : 'foe', 'tick',
          `${isPlayer ? 'You heal' : entity.name + ' heals'} ${heal} from Mending.`, { minor: true });
        entity.statuses.mending--;
        if (entity.statuses.mending <= 0) delete entity.statuses.mending;
      }

      if (entity.statuses.blight) {
        const dmg = entity.statuses.blight;
        combatLog(game, isPlayer ? 'foe' : 'you', 'tick',
          `${isPlayer ? 'You take' : entity.name + ' takes'} ${dmg} Blight damage.`, { minor: true });
        if (isPlayer) {
          game.run.hp = Math.max(0, game.run.hp - dmg);
        } else {
          entity.hp -= dmg;
          if (entity.hp <= 0) {
            entity.hp = 0;
            if (entity.alive) {
              entity.alive = false;
              AudioEngine.sfx('death');
              combatLog(game, 'you', 'death', `${entity.name} succumbed to Blight!`);
              // Blight deaths fire the same death hooks as attack kills.
              if (entity.template && typeof entity.template.onDeath === 'function') entity.template.onDeath(game, entity);
              firePowerHook(game, 'onEnemyKilled', entity);
            }
          }
        }
        entity.statuses.blight--;
        if (entity.statuses.blight <= 0) delete entity.statuses.blight;
      }
    }

    function tickStatusesEndOfTurn(entity) {
      if (entity.statuses.sapped) {
        entity.statuses.sapped--;
        if (entity.statuses.sapped <= 0) delete entity.statuses.sapped;
      }

      if (entity.statuses.exposed) {
        entity.statuses.exposed--;
        if (entity.statuses.exposed <= 0) delete entity.statuses.exposed;
      }

      if (entity.statuses.brittle) {
        entity.statuses.brittle--;
        if (entity.statuses.brittle <= 0) delete entity.statuses.brittle;
      }
    }

    // ============ 8. NON-COMBAT LOGIC ============

    function applyRest(game, choice) {
      const node = game.run.map.nodes.find(n => n.id === game.run.currentNodeId);
      const triggerRestRelics = () => {
        if (node && !node.restRelicTriggered) {
          fireNonCombatRelicHook(game, 'onRest', { node, choice });
          node.restRelicTriggered = true;
        }
      };
      if (choice === 'rest') {
        // Relics can lock the campfire heal off in exchange for raw power.
        if (anyRelic(game, r => r.blocksRest)) return;
        const heal = Math.floor(game.run.maxHp * 0.3);
        healRun(game, heal, 'Rest');
        triggerRestRelics();
        goTo(SCREENS.MAP);
      } else if (choice === 'refine') {
        triggerRestRelics();
        game.ui.picker = { purpose: 'refine' };
        render();
      } else if (choice === 'purge') {
        if (game.run.deck.length <= 1) return;
        triggerRestRelics();
        game.ui.picker = { purpose: 'purge' };
        render();
      } else if (choice === 'fortify') {
        gainMaxHp(game, REST_FORTIFY_HP, true);
        triggerRestRelics();
        goTo(SCREENS.MAP);
      }
    }

    function applyShop(game) {
      const node = game.run.map.nodes.find(n => n.id === game.run.currentNodeId);
      if (!node.shopInventory) {
        node.shopInventory = {
          cards: generateShopCards(game),
          relics: generateShopRelics(game),
          potions: generateShopPotions()
        };
      }
      if (!node.shopRelicTriggered) {
        fireNonCombatRelicHook(game, 'onShopEnter', { node });
        node.shopRelicTriggered = true;
      }
    }

    function generateShopCards(game) {
      const cards = [];
      const picked = new Set();
      const priceFor = (rarity) => ({ COMMON: 55, UNCOMMON: 85, RARE: 140 }[rarity] + Math.floor((rand() - 0.5) * 20));
      // Four class-card slots...
      let guard = 0;
      while (cards.length < 4 && guard++ < 50) {
        const rarity = weightedPick(RARITY_WEIGHTS);
        const cardPool = cardPoolFor(game, { rarity, exclude: picked, includeShared: false });
        if (cardPool.length > 0) {
          const card = cardPool[Math.floor(rand() * cardPool.length)];
          picked.add(card.id);
          cards.push({ id: card.id, name: card.name, price: priceFor(rarity) });
        }
      }
      // ...plus one dedicated neutral slot (SHARED cards only appear here and in events).
      const sharedPool = Object.values(CARDS_DB).filter(c =>
        c.character === 'SHARED' && c.rarity !== CARD_RARITIES.BASIC && c.type !== CARD_TYPES.CURSE && !picked.has(c.id));
      if (sharedPool.length > 0) {
        const card = sharedPool[Math.floor(rand() * sharedPool.length)];
        cards.push({ id: card.id, name: card.name, price: priceFor(card.rarity) });
      }
      return cards;
    }

    function generateShopRelics(game) {
      const relics = [];
      const picked = [];
      const count = 2 + Math.floor(rand() * 2);
      for (let i = 0; i < count; i++) {
        const relic = getRandomRelic(game, picked);
        if (!relic) break; // no unowned relics left
        picked.push(relic);
        const price = 150 + Math.floor(rand() * 50);
        relics.push({ id: relic, name: RELICS_DB[relic].name, price });
      }
      return relics;
    }

    function generateShopPotions() {
      const potions = [];
      const count = 1 + Math.floor(rand() * 2);
      for (let i = 0; i < count; i++) {
        const potion = Object.values(POTIONS_DB)[Math.floor(rand() * Object.values(POTIONS_DB).length)];
        const price = 40 + Math.floor(rand() * 20);
        potions.push({ id: potion.id, name: potion.name, price });
      }
      return potions;
    }

    function applyEvent(game) {
      if (game.ui.eventDef) return;
      let unseen = EVENTS_DB.filter(e => !game.run.seenEventIds.includes(e.id));
      if (unseen.length === 0) {
        game.run.seenEventIds = [];
        unseen = EVENTS_DB.slice();
      }
      const event = unseen[Math.floor(rand() * unseen.length)];
      game.run.seenEventIds.push(event.id);
      game.ui.eventDef = event;
    }

    // ============ 9. NAVIGATION ============

    function goTo(screen, payload) {
      STATE.screen = screen;

      if (screen === SCREENS.SHOP) {
        applyShop(STATE);
      } else if (screen === SCREENS.EVENT) {
        applyEvent(STATE);
      } else if (screen === SCREENS.CARD_REWARD) {
        if (!STATE.ui.cardRewardChoices || STATE.ui.cardRewardChoices.length === 0) STATE.ui.cardRewardChoices = generateCardReward(STATE);
      }

      render();
      saveGame(STATE);
    }

    function generateCardReward(game) {
      const choices = [];
      const used = new Set();
      const reward = game.ui && game.ui.combatReward ? game.ui.combatReward : {};
      const weights = reward.isBoss ? BOSS_RARITY_WEIGHTS : reward.isElite ? ELITE_RARITY_WEIGHTS : RARITY_WEIGHTS;
      let guard = 0;
      while (choices.length < 3 && guard++ < 30) {
        const rarity = weightedPick(weights);
        const cardPool = cardPoolFor(game, { rarity, exclude: used, includeShared: false });
        if (cardPool.length > 0) {
          const card = cardPool[Math.floor(rand() * cardPool.length)];
          used.add(card.id);
          choices.push(card);
        }
      }
      // Fallbacks stay in-pool: first any-rarity class cards, then (only if the
      // class pool is somehow exhausted) SHARED neutrals.
      if (choices.length < 3) {
        for (const card of cardPoolFor(game, { exclude: used, includeShared: false })) {
          used.add(card.id);
          choices.push(card);
          if (choices.length >= 3) break;
        }
      }
      if (choices.length < 3) {
        for (const card of cardPoolFor(game, { exclude: used })) {
          used.add(card.id);
          choices.push(card);
          if (choices.length >= 3) break;
        }
      }
      return choices;
    }

    function selectCardReward(game, cardDef) {
      if (cardDef) {
        game.run.deck.push({ uid: uid(), defId: cardDef.id, upgraded: false });
      }
      game.ui.cardRewardChoices = null;
      game.ui.combatReward = null;
      saveGame(game);
      goTo(SCREENS.MAP);
    }

    function startNewRun(opts) {
      opts = opts || {};
      const seed = opts.seed != null ? opts.seed : ((Math.random() * 4294967296) >>> 0);
      seedRng(seed);

      STATE = {
        screen: SCREENS.MENU,
        run: createNewRun(opts.characterId),
        combat: null,
        ui: {},
        seed: seed,
        ascension: opts.ascension || 0,
        act: 1,
        lastRunOptions: { characterId: opts.characterId || 'cinder-knight', ascension: opts.ascension || 0 }
      };
      if (STATE.ascension >= 5) STATE.run.deck.push({ uid: uid(), defId: 'curse-doubt', upgraded: false });
      // Choose the boss up front so the player can plan around it.
      const bossPool = Object.values(ENEMIES_DB).filter(e => e.isBoss);
      STATE.run.bossId = pickOne(bossPool).id;
      STATE.run.bossName = ENEMIES_DB[STATE.run.bossId].name;
      STATE.run.map = generateMap();
      clearSave();
      render();
    }

    // ============ 10. RENDER ============

    // ============ AUDIO ENGINE ============
    // Music (one looping element) + SFX (cached, cloned so they overlap).
    // Assets live in assets/audio/. Autoplay is unlocked on the first user
    // gesture. Mute persists in localStorage.
    //
    // Music was 48MB of WAV, which is a fine payload inside an APK and an absurd
    // one over HTTP. It ships as Vorbis now (3.5MB, q3) — chosen over MP3 as the
    // primary because these tracks loop, and MP3's encoder padding puts an
    // audible gap at the seam. Safari has never played Ogg in <audio>, so an MP3
    // set is there for it; LAME writes gapless headers, so the seam is tolerable.
    // Only one set is ever downloaded. SFX were already MP3 and are ~470KB total.
    const AudioEngine = (function () {
      const BASE = 'assets/audio/';
      const MUSIC_EXT = (function () {
        const probe = document.createElement('audio');
        // canPlayType returns 'probably' | 'maybe' | '' — anything non-empty will do.
        return probe.canPlayType && probe.canPlayType('audio/ogg; codecs="vorbis"') ? 'ogg' : 'mp3';
      })();
      const MUSIC_FILES = {
        menu:    BASE + 'music/menu.'    + MUSIC_EXT,
        combat:  BASE + 'music/combat.'  + MUSIC_EXT,
        boss:    BASE + 'music/boss.'    + MUSIC_EXT,
        victory: BASE + 'music/victory.' + MUSIC_EXT,
        defeat:  BASE + 'music/defeat.'  + MUSIC_EXT,
      };
      const SFX_FILES = {
        click:  BASE + 'sfx/click.wav',
        attack: BASE + 'sfx/attack.mp3',
        hit:    BASE + 'sfx/hit.mp3',
        block:  BASE + 'sfx/block.mp3',
        heal:   BASE + 'sfx/heal.mp3',
        power:  BASE + 'sfx/power.mp3',
        reward: BASE + 'sfx/reward.mp3',
        draw:   BASE + 'sfx/draw.mp3',
        death:  BASE + 'sfx/death.mp3',
        potion: BASE + 'sfx/potion.mp3',
      };
      const SFX_VOL = { click: 0.3, _default: 0.6 };
      const MUSIC_VOL = 0.35;

      let muted = false;
      try { muted = localStorage.getItem('cinderMuted') === '1'; } catch (e) {}
      let unlocked = false;
      let curKey = null;      // music key currently selected
      let pendingKey = null;  // desired key before the first gesture unlock
      const musicEl = new Audio();
      musicEl.loop = true;
      musicEl.volume = MUSIC_VOL;
      // A bounded pool of players per sound, grown on demand.
      //
      // This used to be one cached element per sound that sfx() cloneNode()'d on
      // every play, so overlapping repeats wouldn't cut each other off. The clone
      // was then dropped on the floor -- but a media element that is playing is
      // kept alive by the browser, and Chrome caps WebMediaPlayers per frame, so
      // the cap was reached long before GC ever collected them. Measured at ~133
      // leaked players per 16-floor run. Because "New Run" re-renders instead of
      // reloading the page, they accumulated across runs in one session until
      // every sound effect silently stopped. Music kept working (it is a single
      // reused element), which made it easy to miss.
      //
      // Reusing finished players instead caps the total at SFX_POOL_MAX per key,
      // and only for keys actually played. Overlap still works; past the cap the
      // oldest instance restarts, which is inaudible for sounds this short.
      const SFX_POOL_MAX = 4;
      const sfxPool = {};   // key -> HTMLAudioElement[]

      function sfxNode(key) {
        const src = SFX_FILES[key];
        if (!src) return null;
        const pool = sfxPool[key] || (sfxPool[key] = []);
        for (const a of pool) {
          if (a.paused || a.ended) return a;      // finished: take it back
        }
        if (pool.length < SFX_POOL_MAX) {
          const a = new Audio(src);
          a.preload = 'auto';
          pool.push(a);
          return a;
        }
        return pool[0];                            // all busy at the cap
      }

      function playMusicKey(key) {
        if (!key || !MUSIC_FILES[key]) return;
        curKey = key;
        if (muted || !unlocked) return;
        const src = MUSIC_FILES[key];
        if (!musicEl.src || !musicEl.src.endsWith(src)) { musicEl.src = src; }
        const p = musicEl.play();
        if (p && p.catch) p.catch(() => {});
      }

      function screenToKey(state) {
        if (!state) return 'menu';
        switch (state.screen) {
          case 'COMBAT': {
            const enemies = (state.combat && state.combat.enemies) || [];
            const heavy = enemies.some(e => e.template && (e.template.isBoss || e.template.isElite));
            return heavy ? 'boss' : 'combat';
          }
          case 'VICTORY':  return 'victory';
          case 'GAMEOVER': return 'defeat';
          case 'MENU':     return 'menu';
          default:         return 'menu'; // map/rest/shop/event/reward/treasure share the calm theme
        }
      }

      return {
        updateMusic(state) {
          const key = screenToKey(state);
          if (!unlocked) { pendingKey = key; curKey = key; return; }
          if (key === curKey && !musicEl.paused) return;
          playMusicKey(key);
        },
        sfx(key) {
          if (muted || !unlocked) return;
          const node = sfxNode(key);
          if (!node) return;
          try {
            node.volume = SFX_VOL[key] || SFX_VOL._default;
            // Rewind a reused player. Guarded: setting currentTime before any
            // metadata has loaded throws, and a fresh element is already at 0.
            if (node.currentTime) node.currentTime = 0;
            const p = node.play();
            if (p && p.catch) p.catch(() => {});
          } catch (e) {}
        },
        unlock() {
          if (unlocked) return;
          unlocked = true;
          playMusicKey(pendingKey || curKey || 'menu');
        },
        toggleMute() {
          muted = !muted;
          try { localStorage.setItem('cinderMuted', muted ? '1' : '0'); } catch (e) {}
          if (muted) musicEl.pause();
          else if (unlocked) playMusicKey(curKey || 'menu');
          return muted;
        },
        isMuted() { return muted; },
      };
    })();

    // Screens that show the run's HP / gold / floor / relics / potions. Everything
    // mid-run does; the menu has no run, and victory/defeat print their own stats.
    const SCREENS_WITH_STATUS = new Set([
      SCREENS.BOON, SCREENS.MAP, SCREENS.COMBAT, SCREENS.REST,
      SCREENS.SHOP, SCREENS.EVENT, SCREENS.CARD_REWARD, SCREENS.TREASURE
    ]);

    // The bar used to be emitted by renderMap and renderCombat only, so on rest,
    // shop, event, reward, treasure and the overlays your HP and relics were simply
    // invisible. Emitting it here covers every screen from one place.
    //
    // NOTE: it must stay INSIDE #app. The delegated click listener is bound once to
    // #app, so moving the bar to a body-level sibling would silently kill every
    // data-action it contains (viewPile, usePotion, discardPotion, relic inspect) —
    // no error, the buttons would just stop responding.
    function statusBarHTML() {
      if (!STATE.run) return '';
      if (STATE.ui && (STATE.ui.pileViewer || STATE.ui.picker)) return renderStatusBar();
      return SCREENS_WITH_STATUS.has(STATE.screen) ? renderStatusBar() : '';
    }

    function render() {
      const app = document.getElementById('app');

      // Overlays (card picker / pile viewer) use the same single-render strategy.
      // Both fall through to the shared tail so the inspect panel can sit on top
      // of any screen, overlays included.
      let html = '';
      if (STATE.ui && STATE.ui.pileViewer) {
        app.innerHTML = statusBarHTML() + renderPileViewer() + renderInspectPanel() + renderKeyHelp();
        return;
      }
      if (STATE.ui && STATE.ui.picker) {
        app.innerHTML = statusBarHTML() + renderCardPicker() + renderInspectPanel() + renderKeyHelp();
        return;
      }

      switch (STATE.screen) {
        case SCREENS.MENU:
          html = renderMenu();
          break;
        case SCREENS.BOON:
          html = renderBoon();
          break;
        case SCREENS.MAP:
          html = renderMap();
          break;
        case SCREENS.COMBAT:
          html = renderCombat();
          break;
        case SCREENS.REST:
          html = renderRest();
          break;
        case SCREENS.SHOP:
          html = renderShop();
          break;
        case SCREENS.EVENT:
          html = renderEvent();
          break;
        case SCREENS.CARD_REWARD:
          html = renderCardReward();
          break;
        case SCREENS.TREASURE:
          html = renderTreasure();
          break;
        case SCREENS.VICTORY:
          html = renderVictory();
          break;
        case SCREENS.GAMEOVER:
          html = renderGameOver();
          break;
      }

      app.innerHTML = statusBarHTML() + html + renderInspectPanel() + renderKeyHelp();
      if (STATE.screen === SCREENS.MAP) requestAnimationFrame(scrollMapToFocus);
      AudioEngine.updateMusic(STATE);
    }

    function scrollMapToFocus() {
      const target = document.querySelector('.map-node.current') || document.querySelector('.map-node.available');
      if (target && typeof target.scrollIntoView === 'function') target.scrollIntoView({ block: 'center', inline: 'center' });
    }

    function describeAscension(level) {
      if (!level) return 'No ascension modifiers.';
      return ASCENSIONS.filter(a => a.level <= level).map(a => `A${a.level}: ${a.name} — ${a.desc}`).join('\n');
    }

    function renderMenu() {
      const meta = loadMeta();
      const saveButton = hasSave() ? '<button class="menu-button" data-action="continueRun">Continue Run</button>' : '';
      const ascMax = Math.max(0, meta.highestAscensionUnlocked || 0);
      const shownAscensions = Array.from({ length: Math.min(ascMax, 5) + 1 }, (_, i) => i);
      const ascensionText = ASCENSIONS.slice(0, Math.max(0, ascMax)).map(a => `A${a.level}: ${a.name}`).join(' · ');
      const characterButtons = Object.values(CHARACTERS_DB).map(ch => `
        <div class="menu-character">
          <div class="menu-character-name">${ch.name}</div>
          <div class="menu-blurb">${ch.blurb}</div>
          <div class="asc-row">
            ${shownAscensions.map(a => `<button class="inline-chip-button" data-action="startGame" data-characterid="${ch.id}" data-ascension="${a}" data-ititle="Ascension ${a}" data-ibody="${attrEscape(describeAscension(a))}">Start A${a}</button>`).join('')}
          </div>
        </div>
      `).join('');
      const recent = (meta.runs || []).slice(0, 3).map(r => `<div class="stat-line"><span>${r.won ? 'Win' : 'Loss'} · ${r.character}</span><span>F${r.floor} · A${r.ascension || 0}</span></div>`).join('') || '<div class="stat-line"><span>No runs yet</span><span>—</span></div>';
      return `
        <div class="screen menu-screen">
          <div class="menu-panel">
            <div class="menu-title">${icon('t-menu','icon-title')} THE CINDER VAULT ${icon('t-menu','icon-title')}</div>
            <div class="menu-subtitle">A Text-Based Roguelike Deckbuilder · v6</div>
            ${saveButton}
            <div class="menu-section-label">Start a new run</div>
            <div class="menu-characters">${characterButtons}</div>
            <div class="menu-stats">
              <div class="stats-box">
                <div class="stat-line"><span>Wins / Losses:</span><span>${meta.wins || 0} / ${meta.losses || 0}</span></div>
                <div class="stat-line"><span>Best Floor:</span><span>${meta.bestFloor || 0}</span></div>
                <div class="stat-line"><span>Best Gold:</span><span>${meta.bestGold || 0}</span></div>
                <div class="stat-line"><span>Ascension Unlocked:</span><span>${ascMax}</span></div>
              </div>
              ${ascMax > 0 ? `<div class="stats-box"><div class="stats-box-label">Ascension Modifiers</div><div class="asc-text">${ascensionText}</div></div>` : ''}
              <div class="stats-box">
                <div class="stats-box-label">Recent Runs</div>
                ${recent}
              </div>
            </div>
            <div class="menu-tagline">
              Navigate a branching path. Build your deck. Defeat the vault boss.
            </div>
            ${DEV_TOOLS ? '<div class="debug-panel">Debug: open the console and use <code>CINDER_DEBUG</code> for validation, seed, and balance helpers.</div>' : ''}
          </div>
        </div>
      `;
    }

    function renderBoon() {
      return `
        <div class="screen center-panel-screen">
          <div class="center-panel">
            <div class="panel-title">${icon('t-event','icon-title')} Before the Descent ${icon('t-event','icon-title')}</div>
            <div class="panel-content">
              <div class="panel-text">
                A figure waits at the vault mouth with four offerings for
                ${STATE.run.characterName || 'you'}. Take exactly one.
              </div>
              ${BOONS_DB.map(boon => `
                <button class="choice-button" data-action="chooseBoon" data-boonid="${boon.id}">
                  <span class="choice-label">${boon.label}</span>
                  <span class="choice-desc">${boon.desc}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Map geometry, deliberately separate from LAYOUT: these four are pure
    // presentation, read only by nodeScreenPos/floorY/renderMap. FLOORS and COLS
    // stay in LAYOUT because they are game rules — generateMap(), validateContent()
    // and autoplayAll() all read them.
    //
    // These are the canvas's INTRINSIC units. The rendered canvas stretches to its
    // container (see .map-canvas), and both the node percentages and the edge
    // viewBox are derived from canvasW, so they stretch together.
    const MAP_LAYOUT = { FLOOR_HEIGHT: 120, COL_WIDTH: 140, PAD_X: 30, PAD_Y: 20 };

    // Floor 1 sits at the bottom. Shared by nodeScreenPos and the floor labels —
    // those two used to repeat this expression verbatim and could drift apart.
    function floorY(floor) {
      return (LAYOUT.FLOORS - floor) * MAP_LAYOUT.FLOOR_HEIGHT + MAP_LAYOUT.FLOOR_HEIGHT / 2 + MAP_LAYOUT.PAD_Y;
    }

    function nodeScreenPos(node) {
      // x from col (centered within COLS lanes), y from floor (floor 1 at bottom).
      const x = (node.col + 0.5) * MAP_LAYOUT.COL_WIDTH + MAP_LAYOUT.PAD_X;
      return { x, y: floorY(node.floor) };
    }

    function renderMap() {
      const available = availableNodeIds(STATE);
      const currentId = STATE.run.currentNodeId;
      const nodes = STATE.run.map.nodes;

      const canvasW = LAYOUT.COLS * MAP_LAYOUT.COL_WIDTH + MAP_LAYOUT.PAD_X * 2;
      const canvasH = LAYOUT.FLOORS * MAP_LAYOUT.FLOOR_HEIGHT + MAP_LAYOUT.PAD_Y * 2;

      // Map node icons are rendered via the global nodeIcon() helper (see icon infrastructure).

      // Edges (drawn first, behind nodes).
      let edgesHTML = '';
      for (const node of nodes) {
        const from = nodeScreenPos(node);
        for (const connId of node.connections) {
          const target = nodes.find(n => n.id === connId);
          if (!target) continue;
          const to = nodeScreenPos(target);
          // An edge is "reachable" if it leads out of the node you're standing on.
          const reachable = node.id === currentId && available.includes(connId);
          edgesHTML += `<line class="map-edge ${reachable ? 'reachable' : ''}" vector-effect="non-scaling-stroke" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" />`;
        }
      }

      const nodesHTML = nodes.map(node => {
        const pos = nodeScreenPos(node);
        const isAvailable = available.includes(node.id);
        const isCurrent = node.id === currentId;
        const statusClass = isCurrent ? 'current' : node.visited ? 'visited' : isAvailable ? 'available' : 'locked';
        const typeClass = node.type === NODE_TYPES.ELITE ? 'elite-node' : node.type === NODE_TYPES.BOSS ? 'boss-node' : '';
        const label = node.type === NODE_TYPES.BOSS && STATE.run.bossName ? STATE.run.bossName : node.type;
        return `
          <div class="map-node ${statusClass} ${typeClass}" style="left:${(pos.x / canvasW * 100).toFixed(3)}%; top:${pos.y}px;"
               data-nodeid="${node.id}" ${isAvailable ? `data-action="travelNode"` : ''}
               data-ititle="${attrEscape(label)}" data-ibody="${attrEscape(`Floor ${node.floor}.${isAvailable ? ' Click to travel here.' : isCurrent ? ' You are here.' : node.visited ? ' Already visited.' : ' Not reachable from where you stand.'}`)}">
            <div class="map-node-icon">${nodeIcon(node.type)}</div>
            <div class="map-node-type">${node.type === NODE_TYPES.BOSS ? 'BOSS' : node.type}</div>
          </div>
        `;
      }).join('');

      // Floor labels down the left edge.
      let floorLabels = '';
      for (let f = 1; f <= LAYOUT.FLOORS; f++) {
        floorLabels += `<div class="map-floor-label" style="top:${floorY(f)}px;">F${f}</div>`;
      }

      // Only the height is inline. Width comes from .map-canvas so the canvas can
      // use the window it is given; an inline width would override the stylesheet
      // and pin the map back to its intrinsic 900px.
      return `
        <div class="screen">
          <div class="map-screen">
            <div class="map-canvas" style="height:${canvasH}px;">
              <svg class="map-edges" viewBox="0 0 ${canvasW} ${canvasH}" preserveAspectRatio="none">${edgesHTML}</svg>
              ${floorLabels}
              ${nodesHTML}
            </div>
          </div>
        </div>
      `;
    }

    // One card face, shared by the combat hand, the pile viewer, the card picker
    // and the card reward screen. Before this, each of those built its own markup —
    // the hand as a real card, the other three as full-width text rows, which is why
    // a 30-card deck only showed about four of them.
    //
    // Accepts BOTH shapes: card instances ({defId, upgraded, uid}) from the hand,
    // deck and piles, and raw card defs ({id, name, cost, type}) from the reward
    // screen's generateCardReward().
    //
    // opts:
    //   action, dataAttr, dataValue  the delegated click hook. Omit `action` and the
    //                               face is inert — the disabled path must OMIT it
    //                               rather than use a `disabled` attribute, since a
    //                               <div> has none.
    //   previewUpgraded  show upgraded VALUES while leaving the name unsuffixed
    //                    (the upgrade picker previews what you would get).
    //   staticFace       readable but not clickable (pile viewer).
    //   disabled         dimmed and not clickable (ineligible picker cards).
    //   note             muted bottom banner, e.g. why a card is ineligible.
    //   warning          red bottom banner (the hand's LETHAL COST notice).
    //   extraClass       'unaffordable', 'lethal-cost', ...
    //   titleSuffix      extra line for the hover tooltip body (e.g. the lethal
    //                    blood-cost warning). Named for the native title= it used
    //                    to feed, which the tooltip replaced.
    function cardFaceHTML(cardOrDef, opts) {
      opts = opts || {};
      const defId = cardOrDef.defId || cardOrDef.id;
      const def = CARDS_DB[defId];
      if (!def) return '';
      // The name reflects the card's ACTUAL state; only the description previews.
      const isUpgraded = !!cardOrDef.upgraded;
      const classes = ['card', def.type.toLowerCase()];
      if (opts.extraClass) classes.push(opts.extraClass);
      if (opts.staticFace) classes.push('static-face');
      if (opts.disabled) classes.push('disabled-choice');
      const hook = opts.action
        ? `data-action="${opts.action}"${opts.dataAttr ? ` ${opts.dataAttr}="${opts.dataValue}"` : ''}`
        : '';
      const desc = describeCard(cardOrDef, opts.previewUpgraded);
      // Hover-tooltip anchor, emitted directly rather than via inspectAttrs():
      // that helper bundles data-action="inspect", which would fight the card's
      // own selectCard hook. The face already shows this text, but at --card-min
      // (92px) it is cramped, and the tooltip is where the note/warning read
      // properly. No data-action here, so the click path is untouched.
      const tip =
        `data-ititle="${attrEscape(def.name + (isUpgraded ? '+' : ''))}" ` +
        `data-ibody="${attrEscape([desc, opts.warning, opts.note, opts.titleSuffix].filter(Boolean).join('\n'))}"`;
      return `
        <div class="${classes.join(' ')}" ${hook} ${tip}>
          <div class="card-cost">${def.cost}</div>
          <div class="card-name">${def.name}${isUpgraded ? '+' : ''}</div>
          <div class="card-art">${cardArtIcon(defId, def.type)}</div>
          <div class="card-type">${typeIcon(def.type)} ${def.type}</div>
          <div class="card-desc">${desc}</div>
          ${opts.warning ? `<div class="card-lethal-warning">${opts.warning}</div>` : ''}
          ${opts.note ? `<div class="card-note">${opts.note}</div>` : ''}
        </div>
      `;
    }

    // Accepts a card instance ({defId, upgraded}) or a raw card def.
    // `forceUpgraded` overrides the upgrade flag (used to preview upgrades).
    function describeCard(cardOrDef, forceUpgraded) {
      const def = cardOrDef.defId ? CARDS_DB[cardOrDef.defId] : cardOrDef;
      const upgraded = forceUpgraded != null ? forceUpgraded : !!cardOrDef.upgraded;
      const keywords = [];
      if (def.innate) keywords.push('Innate.');
      if (def.retain) keywords.push('Retain.');
      if (def.ethereal) keywords.push('Ethereal.');
      const keywordText = keywords.length ? ' ' + keywords.join(' ') : '';
      if (def.desc) return (typeof def.desc === 'function' ? def.desc(upgraded) : def.desc) + keywordText;
      const v = (upgraded && def.upgradedValues) ? def.upgradedValues : (def.values || {});
      const statusNames = { might: 'Might', sapped: 'Sapped', exposed: 'Exposed', blight: 'Blight', mending: 'Mending', warded: 'Warded', grace: 'Grace', brittle: 'Brittle', aegis: 'Aegis' };
      const parts = [];
      for (const eff of (def.effects || [])) {
        const amt = eff.key != null ? v[eff.key] : eff.value;
        if (eff.type === 'DAMAGE') parts.push(`Deal ${amt} damage${def.target === 'ENEMY_ALL' ? ' to ALL' : ''}.`);
        else if (eff.type === 'BLOCK') parts.push(`Gain ${amt} block.`);
        else if (eff.type === 'DRAW') parts.push(`Draw ${amt}.`);
        else if (eff.type === 'ENERGY') parts.push(`Gain ${amt} energy.`);
        else if (eff.type === 'HEAL') parts.push(`Heal ${amt}.`);
        else if (eff.type === 'APPLY_STATUS') parts.push(`Apply ${amt} ${statusNames[eff.status] || eff.status}${def.target === 'ENEMY_ALL' ? ' to ALL' : ''}.`);
        else if (eff.type === 'APPLY_SELF_STATUS') parts.push(`Gain ${amt} ${statusNames[eff.status] || eff.status}.`);
      }
      if (def.exhaust) parts.push('Exhaust.');
      return parts.join(' ') + keywordText;
    }

    // ============ COMBAT LOG PANEL ============
    // Collapse state is pure view state: a module-level Set, deliberately not in
    // STATE, so it neither bloats the save nor survives a reload. Default is
    // "newest turn open, older turns closed"; this Set records the exceptions.
    const _logToggled = new Set();
    function isTurnOpen(turn, newest) {
      const def = turn === newest;
      return _logToggled.has(turn) ? !def : def;
    }
    function resetLogView() { _logToggled.clear(); }

    // What each living enemy will do next, with attack numbers already adjusted for
    // Might / Sapped / Exposed via previewEnemyAttack, so the figure shown is the
    // damage you would actually take.
    function renderIncoming(game) {
      const foes = game.combat.enemies.filter(e => e.alive);
      if (!foes.length) return '';
      const rows = foes.map(e => {
        const type = e.intent ? e.intent.type : 'UNKNOWN';
        const dmg = previewEnemyAttack(e, game.combat.player);
        const value = dmg !== '' ? dmg : (e.intent && e.intent.value ? e.intent.value : '');
        const hits = type === 'ATTACK_ALL' ? ' (all)' : '';
        return `<div class="log-incoming-row">
          <span class="log-foe">${intentIconFor(type)} ${e.name}</span>
          <span class="log-incoming-what">${INTENT_DESC[type] || 'Unknown'}${value !== '' ? ` <strong>${value}</strong>` : ''}${hits}</span>
        </div>`;
      }).join('');
      const total = foes.reduce((sum, e) => {
        const d = previewEnemyAttack(e, game.combat.player);
        return sum + (d === '' ? 0 : d);
      }, 0);
      return `<div class="log-block log-incoming">
        <div class="log-block-head">Incoming${total > 0 ? ` <span class="log-total">${total} damage</span>` : ''}</div>
        <div class="log-block-body">${rows}</div>
      </div>`;
    }

    function renderCombatLog(game) {
      const log = game.combat.log || [];

      // Group by turn, preserving order within each turn.
      const turns = [];
      const byTurn = new Map();
      for (const e of log) {
        if (!byTurn.has(e.t)) { byTurn.set(e.t, { t: e.t, entries: [], snap: null }); turns.push(byTurn.get(e.t)); }
        const g = byTurn.get(e.t);
        if (e.kind === 'turn') g.snap = e.snap || null;   // marker feeds the header, not the list
        else g.entries.push(e);
      }

      const newest = turns.length ? turns[turns.length - 1].t : 1;
      // Newest first: the interesting end of a fight is what just happened.
      const blocks = turns.slice().reverse().map(g => {
        const open = isTurnOpen(g.t, newest);
        const dealt = g.entries.filter(e => e.side === 'you' && e.kind === 'attack')
          .reduce((n, e) => n + (parseInt((e.text.match(/dealt (\d+)/) || [])[1], 10) || 0), 0);
        const taken = g.entries.filter(e => e.side === 'foe' && e.kind === 'attack')
          .reduce((n, e) => n + (parseInt((e.text.match(/dealt (\d+)/) || [])[1], 10) || 0), 0);
        const summary = [
          g.snap ? `HP ${g.snap.hp}/${g.snap.maxHp}` : '',
          dealt ? `dealt ${dealt}` : '',
          taken ? `took ${taken}` : '',
        ].filter(Boolean).join(' · ');

        const rows = g.entries.map(e => `<div class="log-row log-${e.side} log-kind-${e.kind}${e.minor ? ' log-minor' : ''}">${e.text}</div>`).join('');
        const foeHp = g.snap && g.snap.foes.length
          ? `<div class="log-row log-snap">${g.snap.foes.map(f => `${f.name} ${f.hp}/${f.maxHp}`).join(' · ')}</div>`
          : '';
        return `<div class="log-block${open ? ' open' : ''}">
          <button class="log-block-head" data-action="toggleLogTurn" data-turn="${g.t}">
            <span class="log-caret">${open ? '▾' : '▸'}</span>
            <span>${g.t === 0 ? 'Earlier' : 'Turn ' + g.t}</span>
            <span class="log-summary">${summary}</span>
          </button>
          ${open ? `<div class="log-block-body">${foeHp}${rows}</div>` : ''}
        </div>`;
      }).join('');

      return `<div class="combat-log-panel">
        <div class="log-head">Combat Log</div>
        <div class="log-scroll">${renderIncoming(game)}${blocks}</div>
      </div>`;
    }

    function previewEnemyAttack(enemy, player) {
      if (!enemy.intent || (enemy.intent.type !== 'ATTACK' && enemy.intent.type !== 'ATTACK_ALL')) return '';
      let amount = enemy.intent.value + (enemy.statuses.might || 0);
      if (enemy.statuses.sapped) amount = Math.floor(amount * 0.75);
      if (player.statuses.exposed) amount = Math.floor(amount * 1.5);
      return Math.max(0, amount);
    }

    // What the selected card would hit `enemy` for, mirroring dealDamage's order
    // of operations. Returns null for cards whose damage comes from a custom()
    // function (multi-hit, block-scaling, Blight-consuming, ...) — better to show
    // nothing than a number the engine won't honour.
    function previewCardDamage(game, cardDef, card, enemy) {
      if (!cardDef || !cardDef.effects) return null;
      const dmgEffect = cardDef.effects.find(e => e.type === 'DAMAGE');
      if (!dmgEffect) return null;
      const values = (card.upgraded && cardDef.upgradedValues) ? cardDef.upgradedValues : (cardDef.values || {});
      let amount = (dmgEffect.key != null ? values[dmgEffect.key] : dmgEffect.value) || 0;
      amount += (game.combat.player.statuses.might || 0);
      amount = applyRelicModifier(game, 'modifyOutgoingDamage', amount, { isAttack: true, target: enemy, preview: true });
      if (game.combat.player.statuses.sapped) amount = Math.floor(amount * 0.75);
      if (enemy.statuses.exposed) amount = Math.floor(amount * 1.5);
      return Math.max(0, amount);
    }

    function attrEscape(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Click-to-pin inspect. Emits the same data-ititle/data-ibody the hover
    // tooltip reads, plus the `inspect` action: hover for a glance, click to pin
    // a panel you can read while the mouse moves elsewhere.
    //
    // Only for elements with no click behaviour of their own — it sets
    // data-action, so anything that already has one (cards, enemy panels, potion
    // slots) emits the two data attributes directly instead.
    function inspectAttrs(title, body) {
      return `data-action="inspect" data-ititle="${attrEscape(title)}" data-ibody="${attrEscape(body)}"`;
    }

    function renderInspectPanel() {
      const info = STATE.ui && STATE.ui.inspect;
      if (!info) return '';
      return `
        <div class="inspect-panel" data-action="closeInspect">
          <div class="inspect-title">${info.title}</div>
          <div class="inspect-body">${info.body}</div>
          <div class="inspect-hint">Click or press Esc to dismiss</div>
        </div>
      `;
    }

    // Static content, so it rides on render() like the inspect panel rather than
    // being its own DOM node — a STATE.ui.keyHelp flag matches the existing
    // overlay pattern and needs no separate listener. Stays inside #app so the
    // delegated handler still sees its data-action.
    const KEY_HELP = [
      ['1 – 9, 0', 'Play the nth card in hand (0 is the tenth)'],
      ['1 – 9', 'While targeting: pick the nth living enemy'],
      ['E', 'End turn'],
      ['D', 'Open your deck'],
      ['Esc', 'Dismiss a panel, close the deck, or cancel targeting'],
      ['?', 'Show or hide this list'],
    ];

    function renderKeyHelp() {
      if (!STATE.ui || !STATE.ui.keyHelp) return '';
      return `
        <div class="key-help" data-action="closeKeyHelp">
          <div class="key-help-panel">
            <div class="panel-title">Keyboard</div>
            <dl class="key-help-list">
              ${KEY_HELP.map(([k, v]) => `<dt><kbd>${k}</kbd></dt><dd>${v}</dd>`).join('')}
            </dl>
            <div class="inspect-hint">Click anywhere or press ? or Esc to dismiss</div>
          </div>
        </div>
      `;
    }

    function renderCombat() {
      const { enemies, player, hand, energy, energyMax, log } = STATE.combat;

      const targeting = !!STATE.combat.pendingCardUid || STATE.combat.pendingPotionSlot !== null;
      const intentDesc = INTENT_DESC;
      // The card awaiting a target, so each enemy can show what it would take.
      const pendingCard = STATE.combat.pendingCardUid
        ? hand.find(c => c.uid === STATE.combat.pendingCardUid)
        : null;
      const pendingDef = pendingCard ? CARDS_DB[pendingCard.defId] : null;

      const enemyHTML = enemies.filter(e => e.alive).map(enemy => {
        const hpPercent = Math.max(0, Math.min(100, (enemy.hp / enemy.maxHp) * 100));
        const statusHTML = Object.entries(enemy.statuses).filter(([k, v]) => v > 0).map(([k, v]) => {
          const info = STATUS_INFO[k];
          return `<div class="status-chip" ${inspectAttrs(`${statusLabel(k)} ${v}`, info ? info.desc : '')}>${statusIcon(k)}<span class="chip-count">${v}</span></div>`;
        }).join('');

        const it = enemy.intent ? enemy.intent.type : 'UNKNOWN';
        const intentIcon = intentIconFor(it);
        const showValue = ['ATTACK','ATTACK_ALL','BUFF_MIGHT','BLOCK_INTENT','SAPPED','EXPOSED','BLIGHT','BRITTLE','HEAL','ADD_CURSE'].includes(it);
        const intentValue = showValue ? (it === 'ATTACK' || it === 'ATTACK_ALL' ? previewEnemyAttack(enemy, STATE.combat.player) : (enemy.intent.value || 1)) : '';

        const predicted = pendingDef ? previewCardDamage(STATE, pendingDef, pendingCard, enemy) : null;
        const lethal = predicted != null && predicted >= enemy.hp + enemy.block;
        const previewHTML = predicted != null
          ? `<div class="dmg-preview ${lethal ? 'lethal' : ''}">${lethal ? 'LETHAL' : `−${predicted}`}</div>`
          : '';

        return `
          <div class="enemy-panel ${targeting ? 'targetable' : ''} ${lethal ? 'lethal-target' : ''}" data-enemyuid="${enemy.uid}" ${targeting ? `data-action="targetEnemy"` : ''}
               data-ititle="${attrEscape(enemy.name)}" data-ibody="${attrEscape(`${enemy.hp}/${enemy.maxHp} HP.\nNext turn: ${intentDesc[it] || 'unknown'}${intentValue !== '' ? ' for ' + intentValue : ''}.`)}">
            <div class="enemy-intent" ${inspectAttrs(enemy.name + ' — ' + (intentDesc[it] || 'Unknown'), `Next turn: ${intentDesc[it] || 'unknown'}${intentValue !== '' ? ' for ' + intentValue : ''}.`)}>${intentIcon} ${intentValue}</div>
            <div class="enemy-body">
              <div class="enemy-portrait">${enemyIcon(enemy.defId)}</div>
              <div class="enemy-info">
                <div class="enemy-name">${enemy.name}</div>
                <div class="hp-display"><span>HP</span><span>${enemy.hp} / ${enemy.maxHp}</span></div>
                <div class="hp-bar-long"><div class="hp-fill-long" style="width: ${hpPercent}%"></div></div>
                ${previewHTML}
                ${enemy.block > 0 ? `<div class="block-display">${icon('block','icon-block')} ${enemy.block}</div>` : ''}
                <div class="statuses">${statusHTML}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const playerStatusHTML = Object.entries(player.statuses).filter(([k, v]) => v > 0).map(([k, v]) => {
        const info = STATUS_INFO[k];
        return `<div class="status-chip" ${inspectAttrs(`${statusLabel(k)} ${v}`, info ? info.desc : '')}>${statusIcon(k)}<span class="chip-count">${v}</span></div>`;
      }).join('');

      const energyOrbs = Array(Math.max(energyMax, energy)).fill(0).map((_, i) => `<div class="energy-orb ${i < energy ? 'full' : 'empty'}">${i < energy ? icon('energy') : ''}</div>`).join('');
      const activePowerHTML = (STATE.combat.activePowers || []).map(card => {
        const def = CARDS_DB[card.defId];
        return def ? `<span class="active-power-chip" ${inspectAttrs(def.name + (card.upgraded ? '+' : ''), describeCard(card))}>${def.name}${card.upgraded ? '+' : ''}</span>` : '';
      }).join('');

      const potionsHTML = STATE.run.potions.map((pid, slot) => {
        if (!pid) return `<div class="potion-slot empty" data-ititle="Empty potion slot" data-ibody="Potions you pick up land here.">·</div>`;
        const pdef = POTIONS_DB[pid];
        const selected = STATE.combat.pendingPotionSlot === slot;
        return `<div class="potion-slot" data-action="usePotion" data-slot="${slot}" data-ititle="${attrEscape(pdef.name)}" data-ibody="${attrEscape((pdef.desc || 'Use potion.') + (selected ? '\nSelect a target, or press Esc to cancel.' : ''))}">${potionIcon(pid)}</div>`;
      }).join('');

      const handHTML = hand.map(card => {
        const cardDef = CARDS_DB[card.defId];
        const affordable = cardDef.cost === 'X' || cardDef.cost <= energy;
        // Blood-cost cards can kill you now, so say so before it happens.
        const hpCost = cardHpCost(cardDef, card.upgraded);
        const lethal = hpCost > 0 && hpCost >= STATE.run.hp;
        return cardFaceHTML(card, {
          action: 'selectCard',
          dataAttr: 'data-carduid',
          dataValue: card.uid,
          extraClass: [
            affordable ? '' : 'unaffordable',
            lethal ? 'lethal-cost' : '',
            // The card awaiting a target stays lifted, so "which one did I pick?"
            // is answerable without reading the targeting hint.
            card.uid === STATE.combat.pendingCardUid ? 'pending' : ''
          ].filter(Boolean).join(' '),
          warning: lethal ? 'LETHAL COST' : '',
          titleSuffix: lethal ? ` — WARNING: its ${hpCost} HP cost would kill you` : ''
        });
      }).join('');


      // Flag an End Turn that would throw away energy you could still spend.
      const wastedEnergy = energy > 0 && hand.some(c => {
        const def = CARDS_DB[c.defId];
        return def && !def.unplayable && (def.cost === 'X' || def.cost <= energy);
      });

      return `
        <div class="screen combat-screen">
          <div class="combat-body">
            <div class="combat-main">
              <div class="combat-enemies">${enemyHTML}</div>

              <div class="combat-hand-row">
                ${targeting ? '<div class="targeting-hint">Choose a target, or click Cancel (or the selected card/potion again) to cancel.</div>' : ''}
                <div class="combat-hand">${handHTML}</div>
              </div>

              <div class="combat-dock">
                <div class="player-panel">
                  <div class="player-name">Player</div>
                  <div class="hp-display"><span>HP</span><span>${STATE.run.hp} / ${STATE.run.maxHp}</span></div>
                  <div class="hp-bar-long"><div class="hp-fill-long" style="width: ${(STATE.run.hp / STATE.run.maxHp) * 100}%"></div></div>
                  <div class="player-row">
                    <div class="energy-display">${energyOrbs}</div>
                    <div class="energy-label">Energy ${energy}/${energyMax}</div>
                    ${player.block > 0 ? `<div class="block-display">${icon('block','icon-block')} ${player.block}</div>` : ''}
                  </div>
                  <div class="statuses">${playerStatusHTML}</div>
                  <div class="potion-row">${potionsHTML}</div>
                </div>

                <div class="dock-center">
                  <div class="pile-row">
                    Hand (${hand.length}/${LAYOUT.HAND_SIZE})
                    <button class="inline-chip-button" data-action="viewPile" data-pile="drawPile">Draw ${STATE.combat.drawPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="discardPile">Discard ${STATE.combat.discardPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="exhaustPile">Exhaust ${STATE.combat.exhaustPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="activePowers">Powers ${(STATE.combat.activePowers || []).length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="deck">${icon('deck')} Deck ${STATE.run.deck.length}</button>
                  </div>
                  ${activePowerHTML ? `<div class="active-powers">Active Powers: ${activePowerHTML}</div>` : ''}
                  ${wastedEnergy ? `<div class="energy-warning">${energy} energy unspent — you still have a card you can play.</div>` : ''}
                </div>

                <div class="combat-controls">
                  ${targeting ? '<button class="end-turn-btn" data-action="cancelTargeting">Cancel</button>' : ''}
                  <button class="end-turn-btn ${wastedEnergy ? 'warn' : ''}" data-action="endTurn">End Turn</button>
                </div>
              </div>
            </div>

            ${renderCombatLog(STATE)}
          </div>
        </div>
      `;
    }

    function renderRest() {
      const healAmt = Math.floor(STATE.run.maxHp * 0.3);
      const restBlocked = anyRelic(STATE, r => r.blocksRest);
      const canRefine = STATE.run.deck.some(c => !c.upgraded && !isCurseCardInstance(c));
      const canPurge = STATE.run.deck.length > 1;

      const option = (choice, label, desc, enabled) => `
        <button class="choice-button ${enabled ? '' : 'disabled-choice'}" ${enabled ? `data-action="applyRestChoice" data-choice="${choice}"` : ''}>
          <span class="choice-label">${label}</span>
          <span class="choice-desc">${desc}</span>
        </button>
      `;

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel">
            <div class="panel-title">${icon('t-rest','icon-title')} Rest Site ${icon('t-rest','icon-title')}</div>
            <div class="panel-content">
              <div class="panel-text">You've reached a safe place to rest. Choose one action:</div>
              ${option('rest', 'Rest',
                restBlocked ? 'A relic denies you the campfire’s warmth.' : `Heal ${healAmt} HP (30% of max)`,
                !restBlocked)}
              ${option('refine', 'Refine (Upgrade a Card)',
                canRefine ? 'Permanently upgrade one card in your deck' : 'Every card is already upgraded',
                canRefine)}
              ${option('purge', 'Purge (Remove a Card)',
                canPurge ? 'Permanently remove one card from your deck — free' : 'Your deck is too small to thin',
                canPurge)}
              ${option('fortify', 'Fortify',
                `Gain ${REST_FORTIFY_HP} max HP and heal for the same amount`,
                true)}
            </div>
            <button class="leave-button" data-action="leaveRest">Continue</button>
          </div>
        </div>
      `;
    }

    function renderShop() {
      const node = STATE.run.map.nodes.find(n => n.id === STATE.run.currentNodeId);
      const { cards, relics, potions } = node.shopInventory;
      const gold = STATE.run.gold;

      const shopItem = (label, price, sold, canBuy, action, dataAttr, desc, iconHtml) => {
        const affordable = !sold && canBuy && gold >= price;
        // Sold is inert; unaffordable is something you could buy with more gold,
        // so the cursor distinguishes them.
        const style = sold ? 'opacity:0.35; cursor:default;' : (!affordable ? 'opacity:0.55; cursor:not-allowed;' : '');
