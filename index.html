<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cinder Vault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Fluid type anchor: 16px at the 1000px minimum window, 19px at >=1900px.
         Under the old scaled stage the design implicitly assumed a multiplier
         (a 1440x900 window ran at scale 1.4), so raising this restores the
         intended physical size rather than enlarging anything. */
      font-size: clamp(16px, 0.35vw + 12.5px, 19px);

      /* === Type scale — non-compounding by construction (rem, not em). ===
         RULE: font sizes come from --fs-* only. Never set a fractional `em`
         font-size on an element whose ancestor already set one — that is how
         .card-desc became 0.7em of 0.75em = 8.4px. 12px is the floor. */
      --fs-xs:   0.75rem;    /* 12.0-14.3px — chip counts, card type, hints */
      --fs-sm:   0.8125rem;  /* 13.0-15.4px — card rules text, log, descriptions */
      --fs-md:   0.875rem;   /* 14.0-16.6px — status bar, stat readouts */
      --fs-base: 1rem;       /* 16.0-19.0px — body copy, buttons */
      --fs-lg:   1.125rem;   /* 18.0-21.4px — card/enemy names, panel labels */
      --fs-xl:   1.375rem;   /* 22.0-26.1px — panel titles, floating numbers */
      --fs-2xl:  2rem;       /* 32.0-38.0px — VICTORY / DEFEAT */
      --fs-3xl:  2.75rem;    /* 44.0-52.3px — menu title */

      /* Block-level artwork. Not `em`: these size against a BOX (a map node, a
         card), so coupling them to label text would be wrong. */
      --icon-art:       2rem;    /* card art, shop item art (was 30px) */
      --icon-node:      2.25rem; /* map node (was 34px) */
      --icon-node-boss: 2.75rem; /* boss node (was 44px) */
      --icon-title:     1.5rem;  /* icons flanking panel titles (was 24px) */
      --icon-portrait:  4rem;    /* enemy portrait (was 44px) — desktop has room */

      /* === Solarized Light (Ethan Schoonover) === */
      --bg-dark: #fdf6e3;        /* base3  — main background */
      --bg-panel: #eee8d5;       /* base2  — panels / cards */
      --text-primary: #586e75;   /* base01 — primary text */
      --text-muted: #93a1a1;     /* base1  — muted text */
      --border-color: #b6b193;   /* softened base2/base1 border */
      --color-attack: #dc322f;   /* red */
      --color-skill: #268bd2;    /* blue */
      --color-power: #b58900;    /* yellow */
      --color-block: #2aa198;    /* cyan (block) */
      --color-heal: #859900;     /* green (heal / HP) */
      --color-danger: #dc322f;   /* red */
      --color-gold: #b58900;     /* yellow */
      --color-elite: #cb4b16;    /* orange */
      --color-relic: #6c71c4;    /* violet */

      /* Reserved gutter on the right of the status bar so it clears #mute-btn,
         which is a fixed overlay outside #app. */
      --mute-gutter: 3.25rem;

      /* Combat layout. --card-min is 92px, the historical card width, and it sets
         the window floor: 10 cards + gaps + padding needs ~972px. */
      --card-w: 8rem;
      --card-min: 5.75rem;
      --dock-h: 7.5rem;
      /* Fluid, because a fixed 21rem log left the hand 23px short at 1366 wide:
         10 cards at --card-min need ~1008px, so the log can claim at most
         (viewport - 1016). 20vw keeps it on the right side of that everywhere. */
      --log-w: clamp(15rem, 20vw, 20rem);
    }

    html {
      height: 100%;
    }

    html, body {
      width: 100%;
      overflow: hidden;   /* every screen owns an internal scroller; see .screen */
      background: var(--bg-dark);
      /* Kept deliberately: this is on GitHub Pages, so phones will load it and
         font-boosting would garble the min-size guard message. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      height: 100dvh;
      font-family: 'Courier New', monospace;
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* The app IS the viewport. There is no design stage and no scaling: layout is
       real flex/grid at native 1:1 pixels, and each screen scrolls internally. */
    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-primary);
    }

    /* Text stays selectable (a desktop affordance), but controls and the cards you
       drag past during play must not smear a selection. */
    button, .map-node, .status-chip, .relic-chip, .potion-slot, .energy-orb,
    .card-cost, .card-name, .card-type, .shop-item-price {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Persistent sound toggle — a body-level sibling of #app, so render() never
       wipes it and it exists on every screen including the menu. It is the one
       control outside #app, and so the one that does not use data-action. */
    #mute-btn {
      position: fixed;
      top: 6px;
      right: 8px;
      width: 2rem;
      height: 2rem;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 4px;
      font-family: inherit;
      font-size: var(--fs-lg);
      line-height: 1;
      cursor: pointer;
      opacity: 0.85;
    }
    #mute-btn:hover { opacity: 1; border-color: var(--text-primary); }
    #mute-btn.muted { color: var(--text-muted); opacity: 0.6; }
    #mute-btn.muted::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 50%;
      height: 2px;
      background: var(--color-danger);
      transform: rotate(-24deg);
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* === Menu Screen === */
    .menu-screen {
      justify-content: flex-start;
      align-items: center;
      overflow-y: auto;
    }

    .menu-panel {
      text-align: center;
      border: 2px solid var(--border-color);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
      /* Definite width, not max-width: .menu-characters uses auto-fit with 1fr
         tracks, and in a shrink-to-fit panel those resolve against max-content, so
         it settled on two columns and the third character wrapped to its own row.
         58rem fits all three side by side at every supported size. */
      width: min(58rem, 100%);
      max-width: min(58rem, 100%);
      /* Load-bearing pair with .menu-screen's justify-content: flex-start. Auto
         top/bottom margins centre the panel when it fits and keep the top
         REACHABLE when it doesn't. justify-content: center would put the title
         above the scroll origin in a short window. */
      margin: auto 0;
    }

    /* Three character columns instead of one ~1130px stack. */
    .menu-characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1.25rem;
      text-align: left;
      margin: 1.25rem 0;
    }

    .menu-character {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 0.875rem;
    }

    .menu-character-name { font-weight: bold; margin-bottom: 0.25rem; }

    .asc-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    .menu-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
      align-items: start;
      text-align: left;
    }
    .menu-stats .stats-box { margin: 0; }
    .stats-box-label { color: var(--text-muted); margin-bottom: 6px; }
    .menu-section-label { margin: 1.25rem 0 0.5rem; color: var(--text-muted); }

    .menu-title {
      font-size: var(--fs-3xl);
      margin-bottom: 20px;
      color: var(--color-danger);
      text-shadow: 0 0 10px rgba(220, 50, 47, 0.25);
    }

    .menu-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-lg);
      transition: all 0.2s;
    }

    .menu-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    /* === Status Bar === */
    /* Emitted by render() for every in-run screen (see statusBarHTML), so it is a
       flex sibling of .screen inside #app rather than part of any one screen. */
    .status-bar {
      flex: 0 0 auto;
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      padding: 0.5rem var(--mute-gutter) 0.5rem 1rem;   /* right gutter clears #mute-btn */
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: var(--fs-md);
    }

    /* Wrapping matters late in a run: 8-12 relics used to squeeze the HP and gold
       readouts instead of moving to a second row. */
    .status-left, .status-right {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      min-width: 0;
    }

    .status-right { justify-content: flex-end; }

    .relic-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: flex-end;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hp-bar {
      display: inline-block;
      width: 5rem;
      height: 0.625rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      position: relative;
      margin-left: 5px;
    }

    .hp-fill {
      height: 100%;
      background: var(--color-heal);
      transition: width 0.2s;
    }

    /* Flex-centred rather than line-height-centred: the icon runs at 1.35em with a
       negative vertical-align, which used to push its descender ~2px past a
       line-height box at every scale. */
    .relic-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border: 1px solid var(--color-relic);
      background: rgba(108, 113, 196, 0.12);
      font-size: var(--fs-xs);
      line-height: 1;
      cursor: help;
      border-radius: 2px;
    }
    /* Inside a centred flex box the nudge is unnecessary and re-introduces overflow. */
    .relic-chip .icon { vertical-align: 0; }

    /* === Map Screen === */
    .map-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: 1.25rem;
      cursor: grab;
    }

    /* Belt-and-braces alongside the click-suppression in initMapDrag: a node
       cannot be the drag's click target if it takes no pointer events. */
    .map-screen.dragging { cursor: grabbing; }
    .map-screen.dragging .map-node { pointer-events: none; }

    /* The canvas takes the width it is given and the geometry follows: node
       `left` is a PERCENTAGE of canvasW and the edge SVG carries
       viewBox="0 0 canvasW canvasH" with preserveAspectRatio="none", so both
       stretch by the same factor with no measurement and no ResizeObserver.
       Height stays inline (canvasH) because the map scrolls vertically.
       max-width is px, not rem: rem would track the fluid type scale and drift
       to ~1425px at large windows, spreading 6 lanes into whitespace. */
    .map-canvas {
      position: relative;
      width: 100%;
      max-width: 1200px;   /* 6 lanes at ~195px pitch; wider is just whitespace */
      margin: 0 auto;
      /* .map-screen is a column flex container, so height is the MAIN axis and
         the canvas's inline height (FLOORS * FLOOR_HEIGHT) was being flex-shrunk
         to the viewport. Nodes are absolutely positioned so they looked fine,
         but the edge SVG sizes to the canvas and squashed every line into the
         top quarter of the map. */
      flex-shrink: 0;
    }

    .map-edges {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Routes now genuinely fork, so the edges have to be readable — at
       --border-color on the cream background they were nearly invisible.
       The <line>s carry vector-effect="non-scaling-stroke": the canvas stretches
       horizontally against a fixed viewBox, so without it a stroke-width of 2
       renders thinner on near-vertical lines than on near-horizontal ones (and
       the dash pattern below stretches with it). */
    .map-edge {
      stroke: var(--text-muted);
      stroke-width: 2;
      opacity: 0.5;
    }

    .map-edge.reachable {
      stroke: var(--color-gold);
      stroke-width: 3;
      opacity: 1;
      stroke-dasharray: 5 4;
      animation: edge-flow 1.2s linear infinite;
    }

    @keyframes edge-flow {
      to { stroke-dashoffset: -18; }
    }

    .map-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: default;
      /* rem, not px: the node holds a --icon-node glyph plus a --fs-xs label, so a
         fixed box overflowed once the type scale grew. Phase 6 owns the node's
         POSITION; this is only its size. */
      width: 4.75rem;
      height: 4.75rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
    }

    .map-node.available {
      border-color: var(--text-primary);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(88, 110, 117, 0.35);
    }

    .map-node.available:hover {
      background: var(--border-color);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .map-node.current {
      border-color: var(--color-gold);
      box-shadow: 0 0 14px rgba(181, 137, 0, 0.45);
    }

    .map-node.visited {
      opacity: 0.45;
    }

    .map-node.locked {
      opacity: 0.28;
    }

    .map-node.elite-node { border-color: var(--color-elite); }
    .map-node.boss-node { border-color: var(--color-danger); width: 5.75rem; height: 5.75rem; }

    .map-node-icon {
      line-height: 1;
    }

    .map-node-type {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    .map-floor-label {
      position: absolute;
      left: 6px;
      transform: translateY(-50%);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      z-index: 1;
    }

    /* === Combat Screen === */
    .combat-screen {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Two columns: the fight on the left, the log on the right. */
    .combat-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr var(--log-w);
    }

    .combat-main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* `flex: 1 1 auto` (not the old `flex: 1`, i.e. basis 0): with overflow set,
       min-height:auto resolves to 0, so a basis of 0 made the row's hypothetical
       size 0 and it only ever got leftover space — which is why it lost the height
       fight to the player section and had to scroll. */
    .combat-enemies {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.25rem;
      padding: 1rem 1.25rem;
      border-bottom: 2px solid var(--border-color);
      overflow: auto;
      /* Centred on both axes: the enemy row absorbs the leftover vertical space, so
         without this the panels stretched to fill it and left a void under the HP
         bar. Enemies now float in the middle of the arena. */
      justify-content: center;
      align-items: center;
    }

    /* Capped: without a max-width one enemy spanned the entire row (1576px at
       1600 wide), throwing its portrait and HP number to opposite edges. */
    .enemy-panel {
      flex: 0 1 clamp(13rem, 20vw, 20rem);
      min-width: 0;
      /* Enough presence that a lone enemy reads as an opponent rather than a chip
         floating in the arena, without stretching to the whole band. */
      min-height: 9rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      padding: 0.75rem 0.875rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
    }

    /* The enemy row is height-constrained, so trim the shared stat spacing here. */
    .enemy-info .hp-display { margin-bottom: 3px; }
    .enemy-info .hp-bar-long { margin-bottom: 3px; }

    .enemy-panel.targetable {
      border-color: var(--color-danger);
      cursor: pointer;
      background: rgba(220, 50, 47, 0.12);
    }

    /* Pinned inspect panel: floats over whatever screen is showing, including
       the pile viewer and card picker overlays.
       `fixed` now resolves against the real viewport (there is no transformed
       ancestor any more). Never add a transform to an ancestor of this element —
       that would re-create the containment bug the stage used to have. */
    .inspect-panel {
      position: fixed;
      left: 50%;
      /* End Turn lives in the dock's RIGHT column, so a horizontally-centred
         panel cannot cover it — this no longer has to clear the whole dock. */
      bottom: 2rem;
      transform: translateX(-50%);
      z-index: 60;
      min-width: 220px;
      max-width: min(28rem, 60vw);
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 2px solid var(--color-relic);
      border-radius: 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      text-align: center;
    }

    /* Keyboard reference (?). A full-screen scrim inside #app, so the delegated
       click handler dismisses it wherever you click. */
    .key-help {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .key-help-panel {
      max-width: min(32rem, 100%);
      max-height: 100%;
      overflow-y: auto;
      padding: 1.75rem 2rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .key-help-list {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      align-items: baseline;
      margin: 1rem 0;
    }
    .key-help-list dt { margin: 0; }
    .key-help-list dd { margin: 0; color: var(--text-muted); }
    .key-help-list kbd {
      display: inline-block;
      padding: 0.125rem 0.4rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background: var(--bg-dark);
      font-family: inherit;
      font-size: var(--fs-sm);
      white-space: nowrap;
    }

    .inspect-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .inspect-body {
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }

    .inspect-hint {
      margin-top: 6px;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Predicted damage from the card awaiting a target. */
    .dmg-preview {
      text-align: center;
      font-weight: bold;
      font-size: var(--fs-md);
      line-height: 1.2;
      color: var(--color-gold);
    }

    .dmg-preview.lethal {
      color: var(--color-danger);
      letter-spacing: 1px;
    }

    .enemy-panel.lethal-target {
      border-color: var(--color-danger);
      box-shadow: 0 0 12px rgba(220, 50, 47, 0.5);
    }

    .energy-warning {
      align-self: center;
      font-size: var(--fs-md);
      color: var(--color-gold);
    }

    .end-turn-btn.warn {
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    /* Enemy portrait. Combat used to show nothing but a name and a bar, while
       cards, relics and map nodes all had art. Sits BESIDE the stat block, and
       still should: the enemy row is horizontal, so panels are wide and short.
       Stacking the portrait above the stats would push each panel to ~250px tall and blow
       the height budget that sets the 660px minimum window. */
    .enemy-body {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 0;
    }

    .enemy-portrait {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-danger);
      opacity: 0.85;
    }

    .enemy-portrait .icon {
      width: var(--icon-portrait);
      height: var(--icon-portrait);
    }

    .enemy-info {
      flex: 1;
      min-width: 0;
    }

    .enemy-panel.targetable .enemy-portrait {
      opacity: 1;
    }

    .enemy-name {
      font-weight: bold;
      text-align: center;
      word-break: break-word;
    }

    .enemy-intent {
      text-align: center;
      font-size: var(--fs-lg);
      color: var(--color-danger);
      min-height: 1.75rem;   /* was a hard 25px; now grows with the type scale */
      flex-shrink: 0;    /* otherwise it compresses and the icon overlaps the name */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .hp-display {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-md);
      margin-bottom: 5px;
    }

    .hp-bar-long {
      width: 100%;
      height: 0.875rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      position: relative;
    }

    .hp-fill-long {
      height: 100%;
      background: var(--color-heal);
      transition: width 0.2s;
    }

    .block-display {
      text-align: center;
      color: var(--color-block);
      font-weight: bold;
    }

    .statuses {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      font-size: var(--fs-xs);
      text-align: center;
      cursor: help;
      border-radius: 2px;
    }

    /* The hand gets its own full-width band. It used to sit beside the player
       panel, which left it ~786px for 992px of cards — hence the old scroller. */
    .combat-hand-row {
      flex: 0 0 auto;
      padding: 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .combat-dock {
      flex: 0 0 auto;
      min-height: var(--dock-h);
      display: grid;
      grid-template-columns: minmax(11rem, 14rem) 1fr minmax(9rem, 12rem);
      gap: 1rem;
      align-items: stretch;
      padding: 0.75rem 1.25rem;
      border-top: 2px solid var(--border-color);
      background: var(--bg-panel);
    }

    .dock-center {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      min-width: 0;
      min-height: 0;
    }

    .player-panel {
      border: 2px solid var(--border-color);
      padding: 0.625rem 0.75rem;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .player-name { text-align: center; font-weight: bold; }

    /* Energy, its label and block on one line instead of a 150px vertical stack. */
    .player-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .energy-display {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .energy-orb {
      width: 1.5rem;
      height: 1.5rem;
      border: 1px solid var(--color-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-xs);
    }

    .energy-orb.full {
      background: var(--color-gold);
      color: var(--bg-dark);
    }

    .energy-orb.empty {
      background: transparent;
    }

    .potion-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    /* Status-bar potion: the slot itself uses/quaffs, the corner button dumps it
       so a full belt never blocks a better drop.
       The padding is load-bearing: .potion-discard is absolutely positioned into
       the top-right corner, and without room reserved for it the button hung 5px
       outside the wrapper and overflowed .potion-row. */
    .potion-slot-wrap {
      position: relative;
      display: inline-flex;
      padding: 0.3rem 0.3rem 0 0;
    }

    .potion-discard {
      position: absolute;
      top: 0;
      right: 0;
      width: 1.125rem;
      height: 1.125rem;
      padding: 0;
      line-height: 1;
      font-size: var(--fs-xs);
      font-family: inherit;
      color: var(--color-danger);
      background: var(--bg-panel);
      border: 1px solid var(--color-danger);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s;
    }

    .potion-discard:hover {
      opacity: 1;
    }

    .potion-slot {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--color-relic);
      background: rgba(108, 113, 196, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: var(--fs-md);
      border-radius: 3px;
      transition: all 0.2s;
    }

    .potion-slot:hover {
      background: rgba(108, 113, 196, 0.32);
    }

    .potion-slot.empty {
      border-color: var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: default;
    }

    /* Elastic hand: cards shrink from --card-w toward --card-min and never scroll,
       so no card you are holding can be off-screen. overflow is visible so the
       :hover lift isn't clipped. */
    .combat-hand {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 0.25rem;
      flex-wrap: nowrap;
      overflow: visible;
    }
    .combat-hand .card {
      flex: 1 1 0;
      max-width: var(--card-w);
      min-width: var(--card-min);
    }

    .card {
      flex-shrink: 0;
      width: 92px;
      border: 2px solid var(--border-color);
      background: var(--bg-dark);
      padding: 8px;
      cursor: pointer;
      /* Named properties, not `all`: `all` also animates border-color and
         opacity, which made the unaffordable/lethal state changes lag a frame
         behind the energy they describe. */
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      position: relative;   /* required for the :hover z-index below */
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* A real lift, not just a scale. Safe to transform: a .card is never an
       ancestor of .inspect-panel or #tooltip, so this cannot re-create the
       position:fixed containment bug the old stage had. Phase 5's
       `.combat-hand { overflow: visible }` is what stops it being clipped. */
    .card:hover {
      transform: translateY(-0.75rem) scale(1.04);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      border-color: var(--text-primary);
      z-index: 10;          /* lift above its neighbours in the hand */
    }

    /* The card awaiting a target reads as held: it stays lifted without hover. */
    .card.pending {
      transform: translateY(-1.25rem);
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), 0 8px 18px rgba(0, 0, 0, 0.3);
      z-index: 11;
    }

    .card.unaffordable {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card.unaffordable:hover {
      transform: none;
      box-shadow: none;
    }

    .card.unaffordable .card-cost {
      color: var(--color-danger);
      border-color: var(--color-danger);
    }

    /* Blood-cost card that would drop you to 0 HP if played. */
    .card.lethal-cost {
      border-color: var(--color-danger);
      box-shadow: 0 0 0 1px var(--color-danger), 0 0 10px rgba(220, 50, 47, 0.55);
    }

    .card-lethal-warning {
      margin-top: auto;
      text-align: center;
      font-size: var(--fs-xs);
      font-weight: bold;
      letter-spacing: 0.5px;
      color: var(--color-danger);
      border-top: 1px solid var(--color-danger);
      padding-top: 3px;
    }

    .card-cost {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 1.5rem;
      height: 1.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: var(--fs-sm);
    }

    .card-name {
      font-size: var(--fs-md);   /* was inheriting .card's 0.75em, now deleted */
      font-weight: bold;
      text-align: center;
      margin-top: 15px;    /* clears the absolutely-positioned .card-cost badge */
      word-break: break-word;
    }

    .card-type {
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }

    .card-desc {
      font-size: var(--fs-sm);
      text-align: center;
      color: var(--text-muted);
      line-height: 1.2;
      /* .card is still a fixed 92px until Phase 5 makes it elastic; without this a
         long keyword ("Unplayable.") overruns it at the top of the type scale. */
      word-break: break-word;
    }

    .card.attack {
      border-left: 3px solid var(--color-attack);
    }

    .card.skill {
      border-left: 3px solid var(--color-skill);
    }

    .card.power {
      border-left: 3px solid var(--color-power);
    }

    /* ===== Combat log panel ===== */
    .combat-log-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 2px solid var(--border-color);
      background: var(--bg-panel);
      font-size: var(--fs-sm);
    }

    .log-head {
      flex: 0 0 auto;
      padding: 0.5rem 0.75rem;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .log-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .log-block {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
    }

    /* The turn header is the collapse control, so it is a real button. */
    .log-block-head {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 0.375rem;
      padding: 0.3rem 0.5rem;
      background: none;
      border: none;
      font-family: inherit;
      font-size: var(--fs-sm);
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
    }
    .log-block-head:hover { background: var(--bg-panel); }
    .log-caret { color: var(--text-muted); flex-shrink: 0; }
    .log-summary {
      margin-left: auto;
      color: var(--text-muted);
      font-size: var(--fs-xs);
      text-align: right;
      flex-shrink: 0;
    }

    .log-block-body {
      padding: 0.25rem 0.5rem 0.4rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .log-row {
      line-height: 1.35;
      padding-left: 0.5rem;
      border-left: 2px solid transparent;
    }
    /* Actor is carried by the left edge, so scanning "who did what" is a glance. */
    .log-you  { border-left-color: var(--color-skill); }
    .log-foe  { border-left-color: var(--color-attack); }
    .log-sys  { border-left-color: var(--text-muted); }
    .log-minor { color: var(--text-muted); font-size: var(--fs-xs); }
    .log-kind-death { color: var(--color-elite); font-weight: bold; }
    .log-kind-phase {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: var(--fs-xs);
      margin-top: 0.2rem;
    }
    .log-snap {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      border-left-color: var(--border-color);
      margin-bottom: 0.15rem;
    }

    /* Incoming block: what the enemies will do next. Always open, accented so it
       reads as a warning rather than history. */
    .log-incoming { border-color: var(--color-attack); }
    .log-incoming .log-block-head {
      cursor: default;
      font-weight: bold;
      color: var(--color-attack);
      border-bottom: 1px solid var(--border-color);
    }
    .log-incoming .log-block-body { border-top: none; gap: 0.25rem; }
    /* Wraps rather than overflowing: a long enemy name plus "Attacks 14" does not
       fit one line once --log-w narrows toward its 15rem minimum. */
    .log-incoming-row {
      display: flex;
      justify-content: space-between;
      gap: 0.25rem 0.5rem;
      flex-wrap: wrap;
    }
    .log-incoming-row .log-foe {
      border-left: none;
      padding-left: 0;
      color: var(--text-primary);
      min-width: 0;
    }
    .log-incoming-what { color: var(--text-muted); text-align: right; min-width: 0; }
    .log-total { color: var(--color-attack); font-weight: bold; }

    .combat-controls {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
      padding: 0;
    }

    .end-turn-btn {
      /* Deliberately large (this is the primary action) but capped: in the dock's
         column it used to `flex: 1` and grow to the full ~200px band height. */
      flex: 0 1 auto;
      min-height: 2.75rem;
      max-height: 4.5rem;
      padding: 10px;
      background: var(--color-skill);
      border: 2px solid var(--color-skill);
      color: var(--bg-dark);
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: var(--fs-base);
      transition: all 0.2s;
    }

    .end-turn-btn:hover {
      background: rgba(38, 139, 210, 0.8);
    }

    .end-turn-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* === Rest/Shop/Event/Reward Screens === */
    .center-panel-screen {
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      min-height: 0;   /* lets the panel actually shrink instead of overflowing */
    }

    /* Shared by all eight panel screens (boon, rest, shop, event, card reward,
       treasure, card picker, pile viewer). The scroller lives on .panel-content,
       one level down, so the title and the Leave/Skip/Close button stay pinned on
       every one of them. max-height was a fixed 540px, which is why content grew
       past it as the type scale went up. */
    .center-panel {
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      padding: 1.75rem 2rem;
      max-width: min(42rem, 100%);
      max-height: 100%;
      overflow: hidden;
    }

    /* Grid screens need a DEFINITE width. .card-list uses
       repeat(auto-fill, minmax(..,1fr)), and inside a shrink-to-fit flex item those
       1fr tracks resolve against max-content, collapsing auto-fill toward one
       column. This is the one place shrink-to-fit must not apply. */
    .center-panel.wide {
      width: min(64rem, 100%);
      max-width: min(64rem, 100%);   /* must also lift the base 42rem cap */
    }

    .panel-title {
      flex: 0 0 auto;
      font-size: var(--fs-xl);
      margin-bottom: 20px;
      color: var(--text-primary);
      text-align: center;
    }

    .panel-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      margin-bottom: 1.25rem;
    }

    .panel-text {
      line-height: 1.6;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    .choice-button {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: left;
      transition: all 0.2s;
    }

    .choice-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    .choice-label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .choice-desc {
      display: block;
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }

    .card-list {
      display: grid;
      /* auto-fill, not auto-fit: auto-fit collapses empty tracks, so a 2-card row
         would stretch its cards to half the panel. Tracks are sized from the same
         token the hand uses, so a deck card and a held card read alike. */
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
      align-items: start;
    }

    /* .card carries width: 92px for the hand's flex row; in a grid the track owns
       the width, so release it. */
    .card-list .card {
      width: auto;
      max-width: none;
      flex-shrink: 1;
    }

    /* Readable but not interactive (the pile viewer lists your deck — it is not
       "disabled", it just isn't clickable, so it keeps full opacity). */
    .card.static-face { cursor: default; }
    .card.static-face:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--border-color);
    }

    .card.disabled-choice { opacity: 0.45; cursor: not-allowed; }
    .card.disabled-choice:hover { transform: none; box-shadow: none; }

    /* Mouse affordances. The tablet build had no cursor to speak of, so nothing
       here distinguished "you can click this" from "you cannot" except colour.
       .card carries its own cursor rules above. */
    .map-node.available, .choice-button, .menu-button, .end-turn-btn,
    .inline-chip-button, .potion-slot, .status-chip, .relic-chip, .skip-button,
    .leave-button, .new-run-button, .shop-item, #mute-btn { cursor: pointer; }
    .potion-slot.empty { cursor: default; }
    .disabled-choice { cursor: not-allowed; }

    /* Targeting: the enemy you are about to hit should say so under the cursor. */
    .enemy-panel.targetable { cursor: crosshair; }
    .enemy-panel.targetable:hover {
      border-color: var(--text-primary);
      background: rgba(88, 110, 117, 0.12);
    }

    /* Muted sibling of .card-lethal-warning: why a card can't be picked. */
    .card-note {
      margin-top: auto;
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 3px;
    }

    .shop-item {
      border: 2px solid var(--border-color);
      background: var(--bg-dark);
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-item:hover {
      border-color: var(--text-primary);
    }

    .shop-item-price {
      color: var(--color-gold);
      font-weight: bold;
      font-size: var(--fs-md);
    }

    .leave-button, .skip-button, .new-run-button {
      display: block;
      flex: 0 0 auto;   /* pinned below the .panel-content scroller */
      width: 100%;
      margin-top: 0;
      padding: 0.625rem 1rem;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      transition: all 0.2s;
    }

    .leave-button:hover, .skip-button:hover, .new-run-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    /* === Victory/GameOver Screens === */
    /* renderGameOver reuses class="victory-screen", so this covers both. */
    .victory-screen {
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      min-height: 0;
    }

    /* Both panels had no max-height and no scroller, so growth clipped silently. */
    .victory-panel, .gameover-panel {
      display: flex;
      flex-direction: column;
      max-width: min(34rem, 100%);
      max-height: 100%;
      overflow: hidden;
    }
    .victory-panel .panel-content, .gameover-panel .panel-content {
      min-height: 0;
      overflow-y: auto;
    }

    .victory-panel {
      text-align: center;
      border: 2px solid var(--color-heal);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
    }

    .victory-title {
      font-size: var(--fs-2xl);
      color: var(--color-heal);
      margin-bottom: 20px;
    }

    .gameover-panel {
      text-align: center;
      border: 2px solid var(--color-danger);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
    }

    .gameover-title {
      font-size: var(--fs-2xl);
      color: var(--color-danger);
      margin-bottom: 20px;
    }

    .stats-box {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin: 15px 0;
      text-align: left;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      font-size: var(--fs-md);
    }

    /* Floating combat numbers (fire-and-forget overlay) */
    .floating-number {
      position: fixed;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: var(--fs-xl);
      pointer-events: none;
      z-index: 1000;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      animation: float-up 0.9s ease-out forwards;
    }

    .floating-number.floating-dmg { color: var(--color-danger); }
    .floating-number.floating-block { color: var(--color-block); }

    @keyframes float-up {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
    }

    .disabled-choice, .disabled-choice:hover {
      opacity: 0.45;
      cursor: default;
      background: var(--bg-dark);
      border-color: var(--border-color);
    }

    .inline-chip-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.75rem;
      padding: 0.25rem 0.5rem;
      margin: 2px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
      border-radius: 3px;
    }

    .inline-chip-button:hover {
      border-color: var(--text-primary);
      background: var(--border-color);
    }

    .debug-panel {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: var(--fs-sm);
      text-align: left;
    }

    .reward-summary {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 12px;
      margin: 12px 0;
      color: var(--text-muted);
    }

    .deck-stats {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 10px;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      line-height: 1.5;
    }

    .active-power-chip {
      display: inline-block;
      border: 1px solid var(--color-power);
      color: var(--color-power);
      padding: 2px 5px;
      margin: 2px;
      font-size: var(--fs-xs);
      border-radius: 3px;
    }

    /* Short windows (a maximised 1366x768 lands near 680 of viewport): reclaim
       vertical padding before anything has to scroll. Shrink order is deliberate —
       padding, then the log, then the enemy row scrolls. The hand and dock never
       shrink, because a card you cannot see is a move you do not know you have. */
    /* Short windows (a maximised 1366x768 lands near 680 of viewport): reclaim
       vertical padding before anything has to scroll. Deliberately does NOT cap the
       log's height — at >=1280px the log is a full-height side column, and capping
       it here crushed it to ~65px. */
    @media (max-height: 780px) {
      :root { --dock-h: 6.5rem; }
      /* flex-start, not center: at the floor the panel can exceed the arena by a
         few px, and centred overflow clips BOTH edges with no way to scroll to
         either. Top-aligned, any residue goes to the bottom and is reachable. */
      .combat-enemies  { padding: 0.5rem 1rem; align-items: flex-start; }
      .combat-hand-row { padding: 0.5rem; }
      .combat-dock     { padding: 0.5rem 1rem; }
      /* The panel's CONTENT is what sets the arena's requirement here, not its
         min-height: a 4rem portrait plus a name wrapping to two lines at this width.
         3rem is still larger than the pre-retarget 44px. */
      :root            { --icon-portrait: 3rem; --icon-art: 1.5rem; }
      .enemy-panel     { min-height: 7rem; padding: 0.5rem 0.625rem; gap: 0.25rem; }
      /* The player panel is a 6-row stack and was the tallest thing in the dock.
         Both of these are redundant here: the panel's position identifies it, and
         the orbs already show energy as filled/empty. Reclaims ~40px for the arena. */
      .player-name     { display: none; }
      .energy-label    { display: none; }
      .potion-slot     { width: 2rem; height: 2rem; }
      .player-panel    { gap: 0.15rem; padding: 0.5rem; }
      /* The hand is the tallest band (a 92px-wide card runs ~195px tall once its
         rules text wraps). Shrinking the art and padding costs no information;
         clipping the enemy panel would cost its HP and intent, so trim here first. */
      .card            { padding: 6px; gap: 3px; }
      .card-name       { margin-top: 13px; }
    }

    /* Narrow windows cannot afford a side log beside a ~1008px hand, so it moves
       under the dock as a strip rather than disappearing. */
    @media (max-width: 1279px) {
      .combat-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .combat-log-panel {
        border-left: none;
        border-top: 2px solid var(--border-color);
        max-height: 9rem;
      }
      .log-head { display: none; }
    }

    /* Narrow AND short — the 1000x660 floor, which is also a maximised browser on a
       1366x768 laptop, so it has to work. Measured budget there: status 60 + arena
       128 + hand 211 + dock 160 + log 80 = 639 of 660. The log strip gives back the
       last of it; scroll it or widen the window for more history. Must come after
       both tiers above to win on source order. */
    @media (max-width: 1279px) and (max-height: 780px) {
      .combat-log-panel { max-height: 5rem; }
    }

    /* Minimum supported window. The floor is derived, not chosen: a 10-card hand
       at >=92px cards needs >=972px of width, and the combat band budget needs
       ~645px of height. Retune BOTH numbers here after any combat layout change.
       #mute-btn, #fx-layer and #tooltip must be hidden too, and z-index must beat
       the 9999 on #fx-layer, or they float over the message. (#tooltip cannot be
       triggered once #app is gone, but one already open when the window shrinks
       would linger.) */
    @media (max-width: 999px), (max-height: 659px) {
      #app, #mute-btn, #fx-layer, #tooltip { display: none; }
      body::after {
        content: "The Cinder Vault needs a window at least 1000 x 660. Resize or maximise your browser.";
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2.5rem;
        font-family: 'Courier New', monospace;
        font-size: var(--fs-lg);
        color: var(--text-primary);
        background: var(--bg-dark);
      }
    }

    /* Scrollbar styling. The -webkit-* block covers older WebKit; the standard
       properties cover Firefox and are what modern Chromium honours. */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) var(--bg-dark);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Classes replacing inline font-size styles in the render templates, so every
       size in the game comes from the --fs-* scale and the <12px audit in
       tools/cdp-verify.mjs cannot be dodged by an inline style. */
    .menu-blurb      { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 6px; }
    .asc-text        { font-size: var(--fs-sm); color: var(--text-muted); }
    .menu-tagline    { font-size: var(--fs-sm); color: var(--text-muted); text-align: center; margin-top: 20px; }
    .energy-label    { font-size: var(--fs-xs); color: var(--text-muted); text-align: center; }
    .pile-row        { font-size: var(--fs-md); color: var(--text-muted); }
    .active-powers   { font-size: var(--fs-sm); color: var(--text-muted); }
    .targeting-hint  { font-size: var(--fs-sm); color: var(--color-gold); }
    .shop-item-desc  { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 6px; }

    /* ===== ICONS (game-icons.net) ===== */
    .icon {
      width: 1em; height: 1em;
      display: inline-block;
      vertical-align: -0.15em;
      fill: currentColor;
      pointer-events: none;   /* clicks fall through to the data-action parent */
      flex-shrink: 0;
    }
    /* Inline glyphs: the base rule above (1em) already tracks the type scale, so
       most per-context px overrides were redundant and have been deleted. Only
       these four need to run slightly larger than their label. */
    .status-chip .icon { width: 1.15em; height: 1.15em; }
    .relic-chip .icon { width: 1.35em; height: 1.35em; vertical-align: -0.2em; color: var(--color-relic); }
    .potion-slot .icon { width: 1.35em; height: 1.35em; }
    .card-type .icon { width: 1.1em; height: 1.1em; vertical-align: -0.1em; }

    /* Block-level artwork: sized against a box, not a text run — hence tokens. */
    .map-node-icon .icon { width: var(--icon-node); height: var(--icon-node); }
    .map-node.boss-node .map-node-icon .icon { width: var(--icon-node-boss); height: var(--icon-node-boss); }
    .card-art .icon { width: var(--icon-art); height: var(--icon-art); }
    .shop-item-icon .icon { width: var(--icon-art); height: var(--icon-art); }
    .icon-title { width: var(--icon-title); height: var(--icon-title); margin: 0 8px; vertical-align: -0.15em; }

    .status-chip { gap: 1px; }
    .status-chip .chip-count { font-size: var(--fs-xs); font-weight: bold; }
    .status-item .icon { margin-right: 3px; }
    .status-item.stat-hp .icon { color: var(--color-heal); }
    .status-item.stat-gold .icon { color: var(--color-gold); }
    .status-item.stat-floor .icon { color: var(--text-muted); }
    .card-art { text-align: center; margin: 2px 0; color: var(--text-muted); }
    .card.attack .card-art .icon { color: var(--color-attack); }
    .card.skill .card-art .icon { color: var(--color-skill); }
    .card.power .card-art .icon { color: var(--color-power); }
    .card.curse .card-art .icon { color: var(--color-relic); }
    .icon-block { color: var(--color-block); }
    .shop-item-icon { text-align: center; margin-bottom: 4px; color: var(--text-muted); }
    .choice-label .icon { vertical-align: -0.2em; margin-right: 2px; }
    .choice-desc .icon { vertical-align: -0.1em; }
    .reward-summary .icon { vertical-align: -0.15em; }
    .inline-chip-button .icon { vertical-align: -0.1em; }
    /* Curated colored pixel-art icons (relics/potions). Inherit per-context .icon sizing above;
       render crisply (no smoothing) and keep their own colors (no currentColor tint). */
    img.icon-img { image-rendering: pixelated; image-rendering: crisp-edges; object-fit: contain; fill: none; }
    .relic-chip img.icon-img { color: initial; }
    /* Transient combat effect sprites (pixel-art), layered above everything, click-through. */
    #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
    .fx-sprite { position: fixed; image-rendering: pixelated; pointer-events: none; will-change: transform, opacity; }

    /* Hover tooltip. Lives outside #app so render() never destroys it, and is
       pointer-events:none because a hoverable tooltip would sit under the cursor
       and steal its own mouseout. */
    #tooltip[hidden] { display: none; }
    #tooltip {
      position: fixed;
      z-index: 600;
      pointer-events: none;
      max-width: 24rem;
      padding: 0.625rem 0.875rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      font-size: var(--fs-sm);
      line-height: 1.4;
      text-align: left;
    }
    .tooltip-title { font-weight: bold; margin-bottom: 0.25rem; }
    .tooltip-body { color: var(--text-muted); white-space: pre-line; }
  </style>
</head>

    // ============ 3. STATE ============

    let STATE = null;

    function createNewRun(characterId) {
      const character = CHARACTERS_DB[characterId] || CHARACTERS_DB['cinder-knight'];
      return {
        characterId: character.id,
        characterName: character.name,
        deck: character.deck.map(defId => ({ uid: uid(), defId, upgraded: false })),
        maxHp: character.maxHp,
        hp: character.maxHp,
        gold: character.gold != null ? character.gold : LAYOUT.STARTING_GOLD,
        relics: [...character.relics],
        potions: [null, null, null],
        floor: 1,
        map: null,
        currentNodeId: null,
        seenEventIds: [],
        removalsThisRun: 0
      };
    }

    // ============ 4. UTILS ============

    // Seedable PRNG (mulberry32). All game randomness routes through rand()
    // so runs can be reproduced from a seed.
    let _rngState = (Math.random() * 4294967296) >>> 0;

    function seedRng(seed) {
      _rngState = (seed >>> 0) || 1;
    }

    function rand() {
      _rngState |= 0;
      _rngState = (_rngState + 0x6D2B79F5) | 0;
      let t = Math.imul(_rngState ^ (_rngState >>> 15), 1 | _rngState);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function randInt(min, max) {
      // inclusive min, exclusive max
      return min + Math.floor(rand() * (max - min));
    }

    function pickOne(arr) {
      return arr[Math.floor(rand() * arr.length)];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function weightedPick(weights) {
      const sum = Object.values(weights).reduce((a, b) => a + b, 0);
      let roll = rand() * sum;
      for (const [key, weight] of Object.entries(weights)) {
        roll -= weight;
        if (roll <= 0) return key;
      }
      return Object.keys(weights)[0];
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function uid() {
      return Math.random().toString(36).substring(2, 11);
    }

    function statusLabel(statusName) {
      return (STATUS_INFO[statusName] && STATUS_INFO[statusName].label) || statusName;
    }

    function statusShort(statusName) {
      return (STATUS_INFO[statusName] && STATUS_INFO[statusName].short) || statusName.slice(0, 3);
    }

    function healRun(game, amount, source) {
      if (!game || !game.run) return 0;
      const before = game.run.hp;
      game.run.hp = Math.min(game.run.maxHp, game.run.hp + amount);
      const healed = game.run.hp - before;
      if (healed > 0 && game.combat && game.combat.log) combatLog(game, 'you', 'heal', `${source || 'Healing'} restores ${healed} HP.`);
      return healed;
    }

    // Self-inflicted HP loss (blood-cost cards, the Decay curse, event prices).
    // Unlike the old inline `Math.max(1, ...)` clamps, this CAN take you to 0 —
    // otherwise "pay life for power" is strictly free once you're low, which
    // removed all risk from the Cinder Knight's whole identity.
    // In combat, death is picked up by checkCombatEnd (playCard and endPlayerTurn
    // both call it). Outside combat, callers use checkRunDeath below.
    function loseHp(game, amount, source) {
      if (!game || !game.run || amount <= 0) return 0;
      const before = game.run.hp;
      game.run.hp = Math.max(0, game.run.hp - amount);
      const lost = before - game.run.hp;
      if (lost > 0 && game.combat && game.combat.log) {
        combatLog(game, 'you', 'cost', `${source || 'The cost'} drains ${lost} HP.`);
      }
      return lost;
    }

    // Death check for HP lost outside combat (events). Returns true if the run ended.
    function checkRunDeath(game) {
      if (!game || !game.run || game.run.hp > 0) return false;
      game.run.hp = 0;
      recordRunResult(game, false);
      goTo(SCREENS.GAMEOVER);
      return true;
    }

    // The self-inflicted HP a card costs to play, for the lethal-cost warning in
    // the hand. Declared alongside the card's own numbers in CARDS_DB.
    function cardHpCost(cardDef, upgraded) {
      if (!cardDef || cardDef.hpCost == null) return 0;
      return typeof cardDef.hpCost === 'function' ? cardDef.hpCost(!!upgraded) : cardDef.hpCost;
    }

    function gainMaxHp(game, amount, alsoHeal) {
      if (!game || !game.run || amount <= 0) return 0;
      game.run.maxHp += amount;
      if (alsoHeal) game.run.hp = Math.min(game.run.maxHp, game.run.hp + amount);
      if (game.combat && game.combat.log) combatLog(game, 'you', 'heal', `Max HP increased by ${amount}.`);
      return amount;
    }

    // The card pool visible to the current run: the character's own cards plus
    // (by default) SHARED neutrals. BASIC and CURSE cards never appear.
    function cardPoolFor(game, opts) {
      opts = opts || {};
      const characterId = game && game.run ? game.run.characterId : null;
      return Object.values(CARDS_DB).filter(c => {
        if (c.rarity === CARD_RARITIES.BASIC || c.type === CARD_TYPES.CURSE) return false;
        if (opts.rarity && c.rarity !== opts.rarity) return false;
        if (opts.exclude && opts.exclude.has(c.id)) return false;
        if (c.character === 'SHARED') return opts.includeShared !== false;
        return !characterId || c.character === characterId;
      });
    }

    function grantRandomCard(game, rarity) {
      const pool = cardPoolFor(game, { rarity });
      if (!pool.length) return null;
      const card = pickOne(pool);
      game.run.deck.push({ uid: uid(), defId: card.id, upgraded: false });
      return card.id;
    }

    function isCurseCardInstance(card) {
      const def = card && CARDS_DB[card.defId];
      return !!def && def.type === CARD_TYPES.CURSE;
    }

    function upgradeRandomCard(game) {
      const pool = game.run.deck.filter(c => !c.upgraded && !isCurseCardInstance(c));
      if (!pool.length) return null;
      const card = pickOne(pool);
      card.upgraded = true;
      return card.uid;
    }

    // --- Persistence / meta-stats ---
    const SAVE_KEY = 'cinderVaultSave';
    const META_KEY = 'cinderVaultMeta';

    function clearSave() {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }

    function defaultMeta() {
      return { wins: 0, losses: 0, bestFloor: 0, bestGold: 0, highestAscensionUnlocked: 0, runs: [] };
    }

    function loadMeta() {
      try { return { ...defaultMeta(), ...(JSON.parse(localStorage.getItem(META_KEY)) || {}) }; }
      catch (e) { return defaultMeta(); }
    }

    function saveMeta(meta) {
      try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
    }

    function hasSave() {
      try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
    }

    // True while a headless autoplay/smoke run is driving the game; blocks the
    // real save file and meta stats from being touched by simulated runs.
    let _headless = false;

    function saveGame(game) {
      if (_headless) return;
      if (!game || !game.run || game.screen === SCREENS.MENU || game.screen === SCREENS.VICTORY || game.screen === SCREENS.GAMEOVER) return;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ version: 5, rngState: _rngState, savedAt: Date.now(), state: game }));
      } catch (e) {}
    }

    // Fills defaults for fields added after older save versions. Content ids are
    // never renamed or removed across versions, so decks/relics load as-is.
    function migrateSave(game) {
      if (!game || !game.run) return game;
      const run = game.run;
      if (!run.characterId) {
        const match = Object.values(CHARACTERS_DB).find(c => c.name === run.characterName);
        run.characterId = match ? match.id : 'cinder-knight';
      }
      if (run.removalsThisRun == null) run.removalsThisRun = 0;
      if (!run.seenEventIds) run.seenEventIds = [];
      if (game.act == null) game.act = 1;
      // Treasure nodes used to record only a boolean. Give already-looted ones a
      // result object so the new cache screen doesn't hand out a second reward.
      if (run.map && run.map.nodes) {
        for (const node of run.map.nodes) {
          if (node.rewardedTreasure && !node.treasureResult) node.treasureResult = { cache: 'legacy', gold: 0 };
        }
      }
      // SAVE v5: the combat log became objects (turn/actor/kind) so it can be
      // grouped and styled. Wrap any v<=4 plain strings; they keep their text and
      // simply carry no turn attribution.
      if (game.combat && Array.isArray(game.combat.log)) {
        game.combat.log = game.combat.log.map(e =>
          typeof e === 'string' ? { t: 0, side: 'sys', kind: 'info', text: e } : e);
      }
      return game;
    }

    function rehydrateState(game) {
      if (!game) return game;
      game.ui = game.ui || {};
      // saveGame() serialises all of STATE, so this would otherwise come back
      // with the help overlay up. It is a keypress away; it is not run state.
      game.ui.keyHelp = false;
      game.act = game.act || 1;
      if (game.combat && game.combat.enemies) {
        for (const enemy of game.combat.enemies) enemy.template = ENEMIES_DB[enemy.defId];
      }
      if (game.ui.eventDef && game.ui.eventDef.id) {
        game.ui.eventDef = EVENTS_DB.find(e => e.id === game.ui.eventDef.id) || game.ui.eventDef;
      }
      if (game.ui.cardRewardChoices) {
        game.ui.cardRewardChoices = game.ui.cardRewardChoices.map(c => CARDS_DB[c.id] || c).filter(Boolean);
      }
      return game;
    }

    function loadGame() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!saved || !saved.state || saved.version < 2 || saved.version > 5) return false;
        STATE = rehydrateState(migrateSave(saved.state));
        _rngState = saved.rngState || STATE.seed || 1;
        render();
        return true;
      } catch (e) { return false; }
    }

    function recordRunResult(game, won) {
      if (_headless) return;
      try {
        const meta = loadMeta();
        if (won) meta.wins++; else meta.losses++;
        meta.bestFloor = Math.max(meta.bestFloor || 0, game.run.floor || 0);
        meta.bestGold = Math.max(meta.bestGold || 0, game.run.gold || 0);
        if (won) meta.highestAscensionUnlocked = Math.min(5, Math.max(meta.highestAscensionUnlocked || 0, (game.ascension || 0) + 1));
        meta.runs = meta.runs || [];
        meta.runs.unshift({
          won,
          date: new Date().toISOString(),
          character: game.run.characterName || 'Cinder Knight',
          boss: game.run.bossName || 'Unknown',
          floor: game.run.floor || 0,
          gold: game.run.gold || 0,
          deckSize: game.run.deck ? game.run.deck.length : 0,
          relics: game.run.relics ? game.run.relics.length : 0,
          ascension: game.ascension || 0,
          act: game.act || 1,
          seed: game.seed
        });
        meta.runs = meta.runs.slice(0, 10);
        saveMeta(meta);
      } catch (e) {}
      clearSave();
    }

    // ============ COMBAT LOG ============
    // Entries are objects, not strings, so the log can be grouped by turn and
    // styled by actor: { t, side, kind, text, minor?, snap? }.
    //   side  'you' | 'foe' | 'sys'   — drives the accent colour
    //   kind  attack/block/status/heal/death/card/relic/power/tick/turn/info
    //   minor true for background chatter (status ticks, relic procs) so the panel
    //         can de-emphasise it without hiding it
    //   snap  only on kind:'turn' — the HP/energy state entering that turn
    // Older saves stored plain strings; migrateSave() wraps them (see SAVE v5).
    const LOG_CAP = 400;   // bounded: combat.log lives inside the saved state

    function combatLog(game, side, kind, text, opts) {
      if (!game || !game.combat || !Array.isArray(game.combat.log)) return;
      const entry = { t: game.combat.turnNum || 1, side, kind, text };
      if (opts && opts.minor) entry.minor = true;
      if (opts && opts.snap) entry.snap = opts.snap;
      game.combat.log.push(entry);
      const over = game.combat.log.length - LOG_CAP;
      if (over > 0) game.combat.log.splice(0, over);
    }

    // Snapshot of everything the turn header summarises. Taken entering a turn, so
    // consecutive snapshots give the deltas the log panel shows.
    function turnSnapshot(game) {
      const c = game.combat;
      return {
        hp: game.run.hp,
        maxHp: game.run.maxHp,
        block: c.player.block || 0,
        energy: c.energyMax,
        foes: c.enemies.filter(e => e.alive).map(e => ({ name: e.name, hp: e.hp, maxHp: e.maxHp }))
      };
    }

    // --- Fire-and-forget floating combat numbers (Phase 1.7) ---
    // Appends a transient element over the target's panel, outside the
    // full-rerender cycle, and removes itself when the animation ends.
    function spawnFloatingNumber(targetKey, text, kind) {
      // Audio cue: block gains vs damage impacts.
      AudioEngine.sfx(kind === 'block' ? 'block' : 'hit');
      // Deferred so it runs after render() repaints the DOM for this action.
      setTimeout(() => {
        const sel = targetKey === 'player'
          ? '.player-panel'
          : `.enemy-panel[data-enemyuid="${targetKey}"]`;
        let anchor = document.querySelector(sel);
        if (!anchor && targetKey !== 'player') anchor = document.querySelector('.combat-enemies');
        if (!anchor) return;
        const rect = anchor.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'floating-number ' + (kind === 'block' ? 'floating-block' : 'floating-dmg');
        el.textContent = text;
        el.style.left = (rect.left + rect.width / 2) + 'px';
        el.style.top = (rect.top + rect.height / 3) + 'px';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
        setTimeout(() => el.remove(), 1200);
      }, 0);
    }

    // --- Fire-and-forget pixel-art combat effect sprites ---
    // Cycles a folder of numbered frames (assets/art/fx/<name>/<i>.png) over the
    // target's panel. Mirrors spawnFloatingNumber: deferred past render(), lives in
    // #fx-layer (outside #app so it survives re-render), self-removes when done.
    const FX_DEFS = {
      attack: { frames: 8, size: 108, dur: 45 },  // fiery burst when an enemy is hit
      block:  { frames: 7, size: 88, dur: 55 },   // shield orb when the player gains block
      potion: { frames: 7, size: 96, dur: 55 },   // magical burst when a potion is quaffed
    };
    function playEffect(targetKey, name) {
      const def = FX_DEFS[name];
      if (!def) return;
      setTimeout(() => {
        const sel = targetKey === 'player'
          ? '.player-panel'
          : `.enemy-panel[data-enemyuid="${targetKey}"]`;
        let anchor = document.querySelector(sel);
        if (!anchor && targetKey !== 'player') anchor = document.querySelector('.combat-enemies');
        if (!anchor) return;
        const rect = anchor.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        // Anchor to the upper third, aligning with where floating damage/block numbers pop.
        const cy = rect.top + rect.height / 3;
        let layer = document.getElementById('fx-layer');
        if (!layer) { layer = document.createElement('div'); layer.id = 'fx-layer'; document.body.appendChild(layer); }
        const img = document.createElement('img');
        img.className = 'fx-sprite';
        img.alt = '';
        img.style.width = def.size + 'px';
        img.style.height = def.size + 'px';
        img.style.left = (cx - def.size / 2) + 'px';
        img.style.top = (cy - def.size / 2) + 'px';
        img.src = 'assets/art/fx/' + name + '/0.png';
        layer.appendChild(img);
        let i = 0;
        const timer = setInterval(() => {
          i++;
          if (i >= def.frames) { clearInterval(timer); img.remove(); return; }
          img.src = 'assets/art/fx/' + name + '/' + i + '.png';
        }, def.dur);
        // Safety net in case the interval is throttled (background tab, etc.).
        setTimeout(() => { clearInterval(timer); img.remove(); }, def.dur * (def.frames + 2) + 300);
      }, 0);
    }

    // ============ 5. MAP GENERATION ============

    function generateMap() {
      const nodes = [];
      const nodeIds = {};

      // ELITE is capped high enough that the floor-6+ weight actually spreads
      // across the back half instead of exhausting itself by floor 8.
      const nodeCaps = { ELITE: 8, SHOP: 3, TREASURE: 3, REST: 6 };
      let nodeCounts = { ELITE: 0, SHOP: 0, TREASURE: 0, REST: 0 };

      for (let floor = 1; floor <= LAYOUT.FLOORS; floor++) {
        const numNodesOnFloor = floor === LAYOUT.FLOORS ? 1 : (floor === 1 ? 3 : Math.floor(3 + rand() * 3));

        // Spread nodes across distinct lanes so they don't overlap on screen.
        const lanes = [];
        for (let c = 0; c < LAYOUT.COLS; c++) lanes.push(c);
        const chosenLanes = shuffle(lanes).slice(0, numNodesOnFloor).sort((a, b) => a - b);

        for (let nodeNum = 0; nodeNum < numNodesOnFloor; nodeNum++) {
          let col;
          if (floor === LAYOUT.FLOORS) {
            col = Math.floor(LAYOUT.COLS / 2); // boss centered
          } else {
            col = chosenLanes[nodeNum];
          }
          const nodeId = `node_${floor}_${nodeNum}`;
          nodeIds[nodeId] = { floor, col };

          let nodeType;
          if (floor === 1) {
            nodeType = NODE_TYPES.COMBAT;
          } else if (floor === LAYOUT.FLOORS) {
            nodeType = NODE_TYPES.BOSS;
          } else if (floor === LAYOUT.FLOORS - 1) {
            nodeType = NODE_TYPES.REST;
          } else if (GUARANTEED_FLOORS[floor]) {
            // Whole reserved floors (like the boss/rest floors) are how we make
            // sure a shop and a treasure are reachable on EVERY path. Weighted
            // placement used to leave ~45% of runs with no shop at all, which
            // made gold and the gold relics dead in those runs.
            nodeType = GUARANTEED_FLOORS[floor];
          } else {
            // Elites ramp up in the back half so taking one is a real
            // risk/reward call rather than a rare coin flip.
            const eliteWeight = nodeCounts.ELITE >= nodeCaps.ELITE ? 0
              : floor >= 6 ? ((STATE && STATE.ascension >= 2) ? 0.24 : 0.18)
              : floor >= 3 ? 0.10
              : 0;
            const weights = {
              [NODE_TYPES.COMBAT]: 0.42,
              [NODE_TYPES.EVENT]: 0.20,
              [NODE_TYPES.ELITE]: eliteWeight,
              [NODE_TYPES.REST]: nodeCounts.REST < nodeCaps.REST ? 0.12 : 0,
              // Shop/treasure keep a small weight so bonus ones still appear
              // beyond the guaranteed floors.
              [NODE_TYPES.SHOP]: nodeCounts.SHOP < nodeCaps.SHOP ? 0.05 : 0,
              [NODE_TYPES.TREASURE]: nodeCounts.TREASURE < nodeCaps.TREASURE ? 0.04 : 0
            };

            nodeType = weightedPick(Object.fromEntries(Object.entries(weights).filter(([k, v]) => v > 0)));
          }

          if (nodeType in nodeCounts) nodeCounts[nodeType]++;

          nodes.push({ id: nodeId, floor, col, type: nodeType, connections: [], visited: false });
        }
      }

      // Connect nodes
      for (let floor = 1; floor < LAYOUT.FLOORS; floor++) {
        const currentFloor = nodes.filter(n => n.floor === floor);
        const nextFloor = nodes.filter(n => n.floor === floor + 1);

        for (const node of currentFloor) {
          // Lanes are re-randomized every floor, so a +/-1 reach frequently
          // matched nothing and fell through to the repair pass (which forces
          // exactly one edge). +/-2 lets most nodes find real targets.
          const targetsInRange = nextFloor.filter(n => Math.abs(n.col - node.col) <= 2);
          if (targetsInRange.length > 0) {
            // Two outgoing edges is the common case, so standing on a node
            // usually means a choice. Targets are picked at random — the old
            // slice(0, n) always took the leftmost, which biased every map.
            const roll = rand();
            const numConnections = roll < 0.25 ? 1 : roll < 0.80 ? 2 : 3;
            // Shuffle first (random tie-breaking), then take the NEAREST lanes so
            // the drawn graph stays readable instead of a mess of long diagonals.
            const targets = shuffle(targetsInRange)
              .sort((a, b) => Math.abs(a.col - node.col) - Math.abs(b.col - node.col))
              .slice(0, numConnections);
            for (const target of targets) {
              if (!node.connections.includes(target.id)) node.connections.push(target.id);
            }
          }
        }
      }

      // Repair pass: ensure all nodes have paths
      for (let floor = 1; floor < LAYOUT.FLOORS; floor++) {
        const currentFloor = nodes.filter(n => n.floor === floor);
        const nextFloor = nodes.filter(n => n.floor === floor + 1);

        for (const node of currentFloor) {
          if (node.connections.length === 0 && nextFloor.length > 0) {
            const closest = nextFloor.reduce((a, b) => Math.abs(a.col - node.col) < Math.abs(b.col - node.col) ? a : b);
            node.connections.push(closest.id);
          }
        }

        for (const node of nextFloor) {
          const hasPredecessor = currentFloor.some(n => n.connections.includes(node.id));
          if (!hasPredecessor && currentFloor.length > 0) {
            const closest = currentFloor.reduce((a, b) => Math.abs(a.col - node.col) < Math.abs(b.col - node.col) ? a : b);
            if (!closest.connections.includes(node.id)) closest.connections.push(node.id);
          }
        }
      }

      // Floor 15 -> Boss
      for (const node of nodes.filter(n => n.floor === LAYOUT.FLOORS - 1)) {
        const bossNode = nodes.find(n => n.floor === LAYOUT.FLOORS);
        if (!node.connections.includes(bossNode.id)) node.connections.push(bossNode.id);
      }

      return { nodes, edges: [] };
    }

    function availableNodeIds(game) {
      if (!game.run.currentNodeId) {
        return game.run.map.nodes.filter(n => n.floor === 1).map(n => n.id);
      }
      const current = game.run.map.nodes.find(n => n.id === game.run.currentNodeId);
      return current ? current.connections : [];
    }

    function travelToNode(game, nodeId) {
      const node = game.run.map.nodes.find(n => n.id === nodeId);
      if (!node) return;

      game.run.currentNodeId = nodeId;
      node.visited = true;
      game.run.floor = node.floor;

      switch (node.type) {
        case NODE_TYPES.COMBAT:
          startCombat(game, selectEncounter(game, false));
          goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.ELITE:
          startCombat(game, selectEncounter(game, true));
          goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.BOSS:
          startCombat(game, selectEncounter(game, 'boss'));
          goTo(SCREENS.COMBAT);
          break;
        case NODE_TYPES.REST:
          goTo(SCREENS.REST);
          break;
        case NODE_TYPES.SHOP:
          goTo(SCREENS.SHOP);
          break;
        case NODE_TYPES.EVENT:
          goTo(SCREENS.EVENT);
          break;
        case NODE_TYPES.TREASURE:
          goTo(SCREENS.TREASURE);
          break;
      }
    }

    // Encounter tables. Each entry is a list of enemy ids that fight together.
    // Bands scale with floor so late floors are meaningfully harder.
    const ENCOUNTER_TABLES = {
      early: [ // floors 1-5
        ['ooze-crawler'], ['wraith', 'wraith'], ['molten-egg'], ['ashhound'],
        ['cultist'], ['ooze-crawler', 'molten-egg']
      ],
      mid: [ // floors 6-10
        ['shade'], ['harpy'], ['phantom', 'phantom'], ['guardian'], ['crypt-mender', 'ashhound'],
        ['basilisk'], ['wraith', 'wraith', 'ashhound'], ['cultist', 'molten-egg']
      ],
      late: [ // floors 11-15
        ['golem'], ['gravemaw'], ['revenant'], ['harpy', 'harpy'], ['grave-summoner'],
        ['gravemaw', 'ashhound'], ['revenant', 'phantom'], ['golem', 'molten-egg'], ['grave-summoner', 'crypt-mender']
      ]
    };

    const ELITE_TABLES = {
      early: [['chanter'], ['warden']],
      mid: [['warden'], ['pyromancer'], ['chanter'], ['mirror-thief']],
      late: [['pyromancer'], ['leviathan'], ['warden'], ['slag-titan'], ['mirror-thief']]
    };

    function encounterBand(floor) {
      if (floor <= 5) return 'early';
      if (floor <= 10) return 'mid';
      return 'late';
    }

    function selectEncounter(game, type) {
      if (type === 'boss') {
        return { enemies: [game.run.bossId || 'bonelord'] };
      }
      if (type === true) {
        const band = encounterBand(game.run.floor);
        return { enemies: pickOne(ELITE_TABLES[band]).slice() };
      }
      const band = encounterBand(game.run.floor);
      return { enemies: pickOne(ENCOUNTER_TABLES[band]).slice() };
    }

    // ============ 6. RELIC HELPERS ============

    function hasRelic(game, relicId) {
      return game.run.relics && game.run.relics.includes(relicId);
    }

    function grantRelic(game, relicId) {
      if (!game.run.relics.includes(relicId)) {
        game.run.relics.push(relicId);
      }
    }

    // Archetype-locked relics are weighted DOWN for the wrong class rather than
    // excluded, so off-class rolls stay possible (and can still enable a pivot)
    // but an elite kill rarely hands you a relic your deck can't use at all.
    const OFF_CLASS_RELIC_WEIGHT = 0.25;

    function relicWeightFor(game, relicId) {
      const def = RELICS_DB[relicId];
      if (!def || !def.characters) return 1;
      return def.characters.includes(game.run.characterId) ? 1 : OFF_CLASS_RELIC_WEIGHT;
    }

    function getRandomRelic(game, exclude) {
      exclude = exclude || [];
      const owned = game.run.relics || [];
      const pool = Object.keys(RELICS_DB).filter(rid => !owned.includes(rid) && !exclude.includes(rid));
      if (!pool.length) return null;
