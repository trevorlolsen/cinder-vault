<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cinder Vault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Fluid type anchor: 16px at the 1000px minimum window, 19px at >=1900px.
         Under the old scaled stage the design implicitly assumed a multiplier
         (a 1440x900 window ran at scale 1.4), so raising this restores the
         intended physical size rather than enlarging anything. */
      font-size: clamp(16px, 0.35vw + 12.5px, 19px);

      /* === Type scale — non-compounding by construction (rem, not em). ===
         RULE: font sizes come from --fs-* only. Never set a fractional `em`
         font-size on an element whose ancestor already set one — that is how
         .card-desc became 0.7em of 0.75em = 8.4px. 12px is the floor. */
      --fs-xs:   0.75rem;    /* 12.0-14.3px — chip counts, card type, hints */
      --fs-sm:   0.8125rem;  /* 13.0-15.4px — card rules text, log, descriptions */
      --fs-md:   0.875rem;   /* 14.0-16.6px — status bar, stat readouts */
      --fs-base: 1rem;       /* 16.0-19.0px — body copy, buttons */
      --fs-lg:   1.125rem;   /* 18.0-21.4px — card/enemy names, panel labels */
      --fs-xl:   1.375rem;   /* 22.0-26.1px — panel titles, floating numbers */
      --fs-2xl:  2rem;       /* 32.0-38.0px — VICTORY / DEFEAT */
      --fs-3xl:  2.75rem;    /* 44.0-52.3px — menu title */

      /* Block-level artwork. Not `em`: these size against a BOX (a map node, a
         card), so coupling them to label text would be wrong. */
      --icon-art:       2rem;    /* card art, shop item art (was 30px) */
      --icon-node:      2.25rem; /* map node (was 34px) */
      --icon-node-boss: 2.75rem; /* boss node (was 44px) */
      --icon-title:     1.5rem;  /* icons flanking panel titles (was 24px) */
      --icon-portrait:  4rem;    /* enemy portrait (was 44px) — desktop has room */

      /* === Solarized Light (Ethan Schoonover), darkened for contrast ===
         Stock Solarized accents are tuned for syntax highlighting on a light
         ground, where they sit beside plenty of high-contrast text. Here they
         ARE the text: --text-muted alone carries card rules text, tooltip
         bodies, shop descriptions and the minor combat log across 40-odd
         usages, and at #93a1a1 it measured 2.48:1 on base3 — below even the
         3:1 large-text floor. Gold at 2.98:1 was every shop price.

         Each value below is the original darkened along its own RGB ray, so
         the hue is unchanged and the palette still reads as Solarized, until
         it clears 4.5:1 against BOTH grounds — base3 for screens, base2 for
         cards, panels and tooltips. Checking only base3 would have left every
         card face marginal, which is where the rules text actually lives.
         tools/cdp-verify.mjs asserts the computed values, so this cannot rot.

         Measured (base3 / base2), all >= 4.5:1 except the border, which is a
         non-text UI boundary and takes the 3:1 target instead. */
      --bg-dark: #fdf6e3;        /* base3  — main background */
      --bg-panel: #eee8d5;       /* base2  — panels / cards */
      --text-primary: #576c73;   /* was #586e75 — 5.13 / 4.51 */
      --text-muted: #616a6a;     /* was #93a1a1 (2.48!) — 5.15 / 4.54 */
      --border-color: #89856f;   /* was #b6b193 (2.01) — 3.45 / 3.03 */
      --color-attack: #c52d2a;   /* red     — 5.15 / 4.53 */
      --color-skill: #1e6da5;    /* blue    — 5.14 / 4.53 */
      --color-power: #846400;    /* yellow  — 5.12 / 4.51 */
      --color-block: #1e746e;    /* cyan    — 5.15 / 4.54 */
      --color-heal: #616f00;     /* green   — 5.15 / 4.53 */
      --color-danger: #c52d2a;   /* red     — 5.15 / 4.53 */
      --color-gold: #846400;     /* yellow  — 5.12 / 4.51 */
      --color-elite: #b64314;    /* orange  — 5.12 / 4.51 */
      --color-relic: #5e62aa;    /* violet  — 5.12 / 4.51 */

      /* Reserved gutter on the right of the status bar so it clears #mute-btn,
         which is a fixed overlay outside #app. */
      --mute-gutter: 3.25rem;

      /* Combat layout. --card-min is 92px, the historical card width, and it sets
         the window floor: 10 cards + gaps + padding needs ~972px. */
      --card-w: 8rem;
      --card-min: 5.75rem;
      --dock-h: 7.5rem;
      /* Fluid, because a fixed 21rem log left the hand 23px short at 1366 wide:
         10 cards at --card-min need ~1008px, so the log can claim at most
         (viewport - 1016). 20vw keeps it on the right side of that everywhere. */
      --log-w: clamp(15rem, 20vw, 20rem);
    }

    html {
      height: 100%;
    }

    html, body {
      width: 100%;
      overflow: hidden;   /* every screen owns an internal scroller; see .screen */
      background: var(--bg-dark);
      /* Kept deliberately: this is on GitHub Pages, so phones will load it and
         font-boosting would garble the min-size guard message. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      height: 100dvh;
      font-family: 'Courier New', monospace;
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* The app IS the viewport. There is no design stage and no scaling: layout is
       real flex/grid at native 1:1 pixels, and each screen scrolls internally. */
    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-primary);
    }

    /* Text stays selectable (a desktop affordance), but controls and the cards you
       drag past during play must not smear a selection. */
    button, .map-node, .status-chip, .relic-chip, .potion-slot, .energy-orb,
    .card-cost, .card-name, .card-type, .shop-item-price {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Persistent sound toggle — a body-level sibling of #app, so render() never
       wipes it and it exists on every screen including the menu. It is the one
       control outside #app, and so the one that does not use data-action. */
    #mute-btn {
      position: fixed;
      top: 6px;
      right: 8px;
      width: 2rem;
      height: 2rem;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 4px;
      font-family: inherit;
      font-size: var(--fs-lg);
      line-height: 1;
      cursor: pointer;
      opacity: 0.85;
    }
    #mute-btn:hover { opacity: 1; border-color: var(--text-primary); }
    #mute-btn.muted { color: var(--text-muted); opacity: 0.6; }
    #mute-btn.muted::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      top: 50%;
      height: 2px;
      background: var(--color-danger);
      transform: rotate(-24deg);
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* === Menu Screen === */
    .menu-screen {
      justify-content: flex-start;
      align-items: center;
      overflow-y: auto;
    }

    .menu-panel {
      text-align: center;
      border: 2px solid var(--border-color);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
      /* Definite width, not max-width: .menu-characters uses auto-fit with 1fr
         tracks, and in a shrink-to-fit panel those resolve against max-content, so
         it settled on two columns and the third character wrapped to its own row.
         58rem fits all three side by side at every supported size. */
      width: min(58rem, 100%);
      max-width: min(58rem, 100%);
      /* Load-bearing pair with .menu-screen's justify-content: flex-start. Auto
         top/bottom margins centre the panel when it fits and keep the top
         REACHABLE when it doesn't. justify-content: center would put the title
         above the scroll origin in a short window. */
      margin: auto 0;
    }

    /* Three character columns instead of one ~1130px stack. */
    .menu-characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1.25rem;
      text-align: left;
      margin: 1.25rem 0;
    }

    .menu-character {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 0.875rem;
    }

    .menu-character-name { font-weight: bold; margin-bottom: 0.25rem; }

    .asc-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    .menu-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
      align-items: start;
      text-align: left;
    }
    .menu-stats .stats-box { margin: 0; }
    .stats-box-label { color: var(--text-muted); margin-bottom: 6px; }
    .menu-section-label { margin: 1.25rem 0 0.5rem; color: var(--text-muted); }

    .menu-title {
      font-size: var(--fs-3xl);
      margin: 0 0 20px;
      font-weight: normal;
      color: var(--color-danger);
      text-shadow: 0 0 10px rgba(220, 50, 47, 0.25);
    }

    .menu-subtitle {
      color: var(--text-muted);
      /* 30px -> 20px. The menu fits the 1000x660 minimum with almost nothing
         spare, and the seed row added a line; this decorative gap is where the
         room came from, rather than letting the menu become a scroller. */
      margin-bottom: 20px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-lg);
      transition: all 0.2s;
    }

    .menu-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    /* === Status Bar === */
    /* Emitted by render() for every in-run screen (see statusBarHTML), so it is a
       flex sibling of .screen inside #app rather than part of any one screen. */
    .status-bar {
      flex: 0 0 auto;
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      padding: 0.5rem var(--mute-gutter) 0.5rem 1rem;   /* right gutter clears #mute-btn */
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: var(--fs-md);
    }

    /* Wrapping matters late in a run: 8-12 relics used to squeeze the HP and gold
       readouts instead of moving to a second row. */
    .status-left, .status-right {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      min-width: 0;
    }

    .status-right { justify-content: flex-end; }

    .relic-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: flex-end;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hp-bar {
      display: inline-block;
      width: 5rem;
      height: 0.625rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      position: relative;
      margin-left: 5px;
    }

    .hp-fill {
      height: 100%;
      background: var(--color-heal);
      transition: width 0.2s;
    }

    /* Flex-centred rather than line-height-centred: the icon runs at 1.35em with a
       negative vertical-align, which used to push its descender ~2px past a
       line-height box at every scale. */
    .relic-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border: 1px solid var(--color-relic);
      background: rgba(108, 113, 196, 0.12);
      font-size: var(--fs-xs);
      line-height: 1;
      cursor: help;
      border-radius: 2px;
    }
    /* Inside a centred flex box the nudge is unnecessary and re-introduces overflow. */
    .relic-chip .icon { vertical-align: 0; }

    /* === Map Screen === */
    .map-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: 1.25rem;
      cursor: grab;
    }

    /* Belt-and-braces alongside the click-suppression in initMapDrag: a node
       cannot be the drag's click target if it takes no pointer events. */
    .map-screen.dragging { cursor: grabbing; }
    .map-screen.dragging .map-node { pointer-events: none; }

    /* The canvas takes the width it is given and the geometry follows: node
       `left` is a PERCENTAGE of canvasW and the edge SVG carries
       viewBox="0 0 canvasW canvasH" with preserveAspectRatio="none", so both
       stretch by the same factor with no measurement and no ResizeObserver.
       Height stays inline (canvasH) because the map scrolls vertically.
       max-width is px, not rem: rem would track the fluid type scale and drift
       to ~1425px at large windows, spreading 6 lanes into whitespace. */
    .map-canvas {
      position: relative;
      width: 100%;
      max-width: 1200px;   /* 6 lanes at ~195px pitch; wider is just whitespace */
      margin: 0 auto;
      /* .map-screen is a column flex container, so height is the MAIN axis and
         the canvas's inline height (FLOORS * FLOOR_HEIGHT) was being flex-shrunk
         to the viewport. Nodes are absolutely positioned so they looked fine,
         but the edge SVG sizes to the canvas and squashed every line into the
         top quarter of the map. */
      flex-shrink: 0;
    }

    .map-edges {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Routes now genuinely fork, so the edges have to be readable — at
       --border-color on the cream background they were nearly invisible.
       The <line>s carry vector-effect="non-scaling-stroke": the canvas stretches
       horizontally against a fixed viewBox, so without it a stroke-width of 2
       renders thinner on near-vertical lines than on near-horizontal ones (and
       the dash pattern below stretches with it). */
    .map-edge {
      stroke: var(--text-muted);
      stroke-width: 2;
      opacity: 0.5;
    }

    .map-edge.reachable {
      stroke: var(--color-gold);
      stroke-width: 3;
      opacity: 1;
      stroke-dasharray: 5 4;
      animation: edge-flow 1.2s linear infinite;
    }

    @keyframes edge-flow {
      to { stroke-dashoffset: -18; }
    }

    .map-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: default;
      /* rem, not px: the node holds a --icon-node glyph plus a --fs-xs label, so a
         fixed box overflowed once the type scale grew. Phase 6 owns the node's
         POSITION; this is only its size. */
      width: 4.75rem;
      height: 4.75rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
    }

    .map-node.available {
      border-color: var(--text-primary);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(88, 110, 117, 0.35);
    }

    .map-node.available:hover {
      background: var(--border-color);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .map-node.current {
      border-color: var(--color-gold);
      box-shadow: 0 0 14px rgba(181, 137, 0, 0.45);
    }

    .map-node.visited {
      opacity: 0.45;
    }

    .map-node.locked {
      opacity: 0.28;
    }

    .map-node.elite-node { border-color: var(--color-elite); }
    .map-node.boss-node { border-color: var(--color-danger); width: 5.75rem; height: 5.75rem; }

    .map-node-icon {
      line-height: 1;
    }

    .map-node-type {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    .map-floor-label {
      position: absolute;
      left: 6px;
      transform: translateY(-50%);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      z-index: 1;
    }

    /* === Combat Screen === */
    .combat-screen {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Two columns: the fight on the left, the log on the right. */
    .combat-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr var(--log-w);
    }

    .combat-main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* `flex: 1 1 auto` (not the old `flex: 1`, i.e. basis 0): with overflow set,
       min-height:auto resolves to 0, so a basis of 0 made the row's hypothetical
       size 0 and it only ever got leftover space — which is why it lost the height
       fight to the player section and had to scroll. */
    .combat-enemies {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 1.25rem;
      padding: 1rem 1.25rem;
      border-bottom: 2px solid var(--border-color);
      overflow: auto;
      /* Centred on both axes: the enemy row absorbs the leftover vertical space, so
         without this the panels stretched to fill it and left a void under the HP
         bar. Enemies now float in the middle of the arena. */
      justify-content: center;
      align-items: center;
    }

    /* Capped: without a max-width one enemy spanned the entire row (1576px at
       1600 wide), throwing its portrait and HP number to opposite edges. */
    .enemy-panel {
      flex: 0 1 clamp(13rem, 20vw, 20rem);
      min-width: 0;
      /* Enough presence that a lone enemy reads as an opponent rather than a chip
         floating in the arena, without stretching to the whole band. */
      min-height: 9rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      padding: 0.75rem 0.875rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
    }

    /* The enemy row is height-constrained, so trim the shared stat spacing here. */
    .enemy-info .hp-display { margin-bottom: 3px; }
    .enemy-info .hp-bar-long { margin-bottom: 3px; }

    .enemy-panel.targetable {
      border-color: var(--color-danger);
      cursor: pointer;
      background: rgba(220, 50, 47, 0.12);
    }

    /* Pinned inspect panel: floats over whatever screen is showing, including
       the pile viewer and card picker overlays.
       `fixed` now resolves against the real viewport (there is no transformed
       ancestor any more). Never add a transform to an ancestor of this element —
       that would re-create the containment bug the stage used to have. */
    .inspect-panel {
      /* A <button> now (keyboard reachability), so it needs the native reset
         the other converted controls got. */
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
      position: fixed;
      left: 50%;
      /* End Turn lives in the dock's RIGHT column, so a horizontally-centred
         panel cannot cover it — this no longer has to clear the whole dock. */
      bottom: 2rem;
      transform: translateX(-50%);
      z-index: 60;
      min-width: 220px;
      max-width: min(28rem, 60vw);
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 2px solid var(--color-relic);
      border-radius: 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      text-align: center;
    }

    /* Keyboard reference (?). A full-screen scrim inside #app, so the delegated
       click handler dismisses it wherever you click. */
    .key-help {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* The dismiss target, behind the panel rather than wrapping it — see
       renderKeyHelp for why that distinction is load-bearing. */
    .key-help-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .key-help-panel {
      position: relative;   /* above the backdrop */
      max-width: min(32rem, 100%);
      max-height: 100%;
      overflow-y: auto;
      padding: 1.75rem 2rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .help-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    .help-tab {
      font: inherit;
      font-size: var(--fs-sm);
      padding: 0.3rem 0.75rem;
      color: var(--text-muted);
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      cursor: pointer;
    }
    .help-tab.active { color: var(--text-primary); border-color: var(--color-skill); }

    /* Inline glossary term inside rules text. Deliberately understated: it is a
       hover affordance on text that must stay readable at --card-min, not a
       link. A dotted underline reads as "there is more here" without competing
       with the card's own colour coding. */
    .kw {
      text-decoration: underline dotted currentColor;
      text-underline-offset: 0.15em;
      cursor: help;
    }

    .key-help-list {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      align-items: baseline;
      margin: 1rem 0;
    }
    .key-help-list dt { margin: 0; }
    .key-help-list dd { margin: 0; color: var(--text-muted); }
    .key-help-list kbd {
      display: inline-block;
      padding: 0.125rem 0.4rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background: var(--bg-dark);
      font-family: inherit;
      font-size: var(--fs-sm);
      white-space: nowrap;
    }

    /* Error boundary. Sits above the key help (70) and the inspect panel (60)
       because it reports on state those may be describing wrongly. */
    .error-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.55);
    }

    .error-panel {
      max-width: min(34rem, 100%);
      max-height: 100%;
      overflow-y: auto;
      padding: 1.75rem 2rem;
      border: 2px solid var(--color-danger);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .error-title {
      font-size: var(--fs-lg);
      color: var(--color-danger);
      margin-bottom: 0.75rem;
    }

    .error-body { font-size: var(--fs-base); margin-bottom: 0.75rem; }

    .error-detail {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      border-left: 3px solid var(--border-color);
      background: var(--bg-dark);
      word-break: break-word;
    }

    .error-actions { display: flex; flex-direction: column; gap: 0.5rem; }

    /* Confirm gate. Below the error banner (80) because an error reports on
       state a confirm might be about to act on, above everything else. */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 75;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.55);
    }
    .confirm-panel {
      max-width: min(30rem, 100%);
      padding: 1.75rem 2rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .confirm-title { font-size: var(--fs-lg); margin: 0 0 0.75rem; font-weight: normal; }
    .confirm-body { font-size: var(--fs-base); margin-bottom: 1.25rem; color: var(--text-primary); }
    .confirm-actions { display: flex; gap: 0.75rem; }
    .confirm-actions .choice-button { flex: 1 1 0; }

    /* Settings. Between the confirm gate and the reading material. */
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 74;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.5);
    }
    .settings-panel {
      display: flex;
      flex-direction: column;
      width: min(34rem, 100%);
      max-height: 100%;
      padding: 1.5rem 1.75rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .settings-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .setting-row {
      display: grid;
      grid-template-columns: 9rem 1fr auto;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .setting-label { color: var(--text-primary); font-size: var(--fs-sm); }
    .setting-value { color: var(--text-muted); font-size: var(--fs-sm); min-width: 3rem; text-align: right; }
    .setting-hint { color: var(--text-muted); font-size: var(--fs-xs); grid-column: 2 / -1; }
    .setting-slider { width: 100%; accent-color: var(--color-skill); }
    .setting-toggle.on { border-color: var(--color-heal); color: var(--color-heal); }
    .settings-danger { border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 0.5rem; }

    /* Run history. Reference material, so it sits under the confirm gate. */
    .history-overlay {
      position: fixed;
      inset: 0;
      z-index: 72;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.5);
    }
    .history-panel {
      display: flex;
      flex-direction: column;
      width: min(64rem, 100%);
      max-height: 100%;
      padding: 1.5rem 1.75rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .history-content { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 1rem; }
    /* The table is the one thing here allowed to scroll sideways; the page
       itself must never (html/body are overflow:hidden). */
    .history-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .history-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .history-table th, .history-table td {
      padding: 0.35rem 0.6rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border-color);
    }
    .history-table th { color: var(--text-muted); font-weight: normal; }
    .history-table tr.run-win td:first-child { color: var(--color-heal); }
    .history-table tr.run-loss td:first-child { color: var(--color-danger); }
    .history-table tr.run-abandoned td:first-child { color: var(--text-muted); }
    .history-open { margin-top: 0.5rem; }

    /* Seed entry on the menu, and the seed readout on the end screens. */
    /* Margins deliberately tight: the menu fits the 1000x660 minimum window with
       almost nothing to spare, and the first draft of this row put it 12px over,
       turning the menu into a scroller at the smallest supported size. */
    .seed-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin: 0.25rem 0 0;
      flex-wrap: wrap;
    }
    .seed-label { color: var(--text-muted); font-size: var(--fs-sm); }
    .seed-input {
      font: inherit;
      font-size: var(--fs-sm);
      padding: 0.3rem 0.5rem;
      width: 15rem;
      max-width: 100%;
      color: var(--text-primary);
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
    }
    .run-seed-line { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: 0.75rem; }
    .run-seed-line code { font-family: inherit; color: var(--text-primary); }

    /* Painted only when renderScreen() itself throws, so it uses no tokens that
       a broken render could have been mid-way through changing. */
    .fatal-panel {
      max-width: 34rem;
      margin: 4rem auto;
      padding: 2rem;
      border: 2px solid #dc322f;
      background: #eee8d5;
      color: #586e75;
      font-family: inherit;
    }
    .fatal-panel h2 { color: #dc322f; margin: 0 0 1rem; }
    .fatal-detail {
      font-size: 0.875rem;
      padding: 0.5rem;
      background: #fdf6e3;
      word-break: break-word;
    }
    .fatal-panel .menu-button { margin-top: 0.5rem; }

    .inspect-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .inspect-body {
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }

    .inspect-hint {
      margin-top: 6px;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Predicted damage from the card awaiting a target. */
    .dmg-preview {
      text-align: center;
      font-weight: bold;
      font-size: var(--fs-md);
      line-height: 1.2;
      color: var(--color-gold);
    }

    .dmg-preview.lethal {
      color: var(--color-danger);
      letter-spacing: 1px;
    }

    .enemy-panel.lethal-target {
      border-color: var(--color-danger);
      box-shadow: 0 0 12px rgba(220, 50, 47, 0.5);
    }

    .energy-warning {
      align-self: center;
      font-size: var(--fs-md);
      color: var(--color-gold);
    }

    /* "You still have energy to spend." This used to override only the border
       and the text, leaving the base rule's blue background underneath — gold
       on blue measured 1.15:1, so the warning has been invisible for its whole
       life. It recolours the whole button now, which is also what actually
       reads as a warning at a glance. */
    .end-turn-btn.warn {
      background: var(--color-gold);
      border-color: var(--color-gold);
      color: var(--bg-dark);
    }

    /* Enemy portrait. Combat used to show nothing but a name and a bar, while
       cards, relics and map nodes all had art. Sits BESIDE the stat block, and
       still should: the enemy row is horizontal, so panels are wide and short.
       Stacking the portrait above the stats would push each panel to ~250px tall and blow
       the height budget that sets the 660px minimum window. */
    .enemy-body {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 0;
    }

    .enemy-portrait {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-danger);
      opacity: 0.85;
    }

    .enemy-portrait .icon {
      width: var(--icon-portrait);
      height: var(--icon-portrait);
    }

    .enemy-info {
      flex: 1;
      min-width: 0;
    }

    .enemy-panel.targetable .enemy-portrait {
      opacity: 1;
    }

    .enemy-name {
      font-weight: bold;
      text-align: center;
      word-break: break-word;
    }

    .enemy-intent {
      text-align: center;
      font-size: var(--fs-lg);
      color: var(--color-danger);
      min-height: 1.75rem;   /* was a hard 25px; now grows with the type scale */
      flex-shrink: 0;    /* otherwise it compresses and the icon overlaps the name */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .hp-display {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-md);
      margin-bottom: 5px;
    }

    .hp-bar-long {
      width: 100%;
      height: 0.875rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      position: relative;
    }

    .hp-fill-long {
      height: 100%;
      background: var(--color-heal);
      transition: width 0.2s;
    }

    .block-display {
      text-align: center;
      color: var(--color-block);
      font-weight: bold;
    }

    .statuses {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      font-size: var(--fs-xs);
      text-align: center;
      cursor: help;
      border-radius: 2px;
    }

    /* The hand gets its own full-width band. It used to sit beside the player
       panel, which left it ~786px for 992px of cards — hence the old scroller. */
    .combat-hand-row {
      flex: 0 0 auto;
      padding: 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .combat-dock {
      flex: 0 0 auto;
      min-height: var(--dock-h);
      display: grid;
      grid-template-columns: minmax(11rem, 14rem) 1fr minmax(9rem, 12rem);
      gap: 1rem;
      align-items: stretch;
      padding: 0.75rem 1.25rem;
      border-top: 2px solid var(--border-color);
      background: var(--bg-panel);
    }

    .dock-center {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      min-width: 0;
      min-height: 0;
    }

    .player-panel {
      border: 2px solid var(--border-color);
      padding: 0.625rem 0.75rem;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .player-name { text-align: center; font-weight: bold; }

    /* Energy, its label and block on one line instead of a 150px vertical stack. */
    .player-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .energy-display {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .energy-orb {
      width: 1.5rem;
      height: 1.5rem;
      border: 1px solid var(--color-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-xs);
    }

    .energy-orb.full {
      background: var(--color-gold);
      color: var(--bg-dark);
    }

    .energy-orb.empty {
      background: transparent;
    }

    .potion-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    /* Status-bar potion: the slot itself uses/quaffs, the corner button dumps it
       so a full belt never blocks a better drop.
       The padding is load-bearing: .potion-discard is absolutely positioned into
       the top-right corner, and without room reserved for it the button hung 5px
       outside the wrapper and overflowed .potion-row. */
    .potion-slot-wrap {
      position: relative;
      display: inline-flex;
      padding: 0.3rem 0.3rem 0 0;
    }

    .potion-discard {
      position: absolute;
      top: 0;
      right: 0;
      width: 1.125rem;
      height: 1.125rem;
      padding: 0;
      line-height: 1;
      font-size: var(--fs-xs);
      font-family: inherit;
      color: var(--color-danger);
      background: var(--bg-panel);
      border: 1px solid var(--color-danger);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s;
    }

    .potion-discard:hover {
      opacity: 1;
    }

    .potion-slot {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--color-relic);
      background: rgba(108, 113, 196, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: var(--fs-md);
      border-radius: 3px;
      transition: all 0.2s;
    }

    .potion-slot:hover {
      background: rgba(108, 113, 196, 0.32);
    }

    .potion-slot.empty {
      border-color: var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: default;
    }

    /* Elastic hand: cards shrink from --card-w toward --card-min and never scroll,
       so no card you are holding can be off-screen. overflow is visible so the
       :hover lift isn't clipped. */
    .combat-hand {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 0.25rem;
      flex-wrap: nowrap;
      overflow: visible;
    }
    .combat-hand .card {
      flex: 1 1 0;
      max-width: var(--card-w);
      min-width: var(--card-min);
    }

    .card {
      flex-shrink: 0;
      width: 92px;
      border: 2px solid var(--border-color);
      background: var(--bg-dark);
      padding: 8px;
      cursor: pointer;
      /* Named properties, not `all`: `all` also animates border-color and
         opacity, which made the unaffordable/lethal state changes lag a frame
         behind the energy they describe. */
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      position: relative;   /* required for the :hover z-index below */
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* A real lift, not just a scale. Safe to transform: a .card is never an
       ancestor of .inspect-panel or #tooltip, so this cannot re-create the
       position:fixed containment bug the old stage had. Phase 5's
       `.combat-hand { overflow: visible }` is what stops it being clipped. */
    .card:hover {
      transform: translateY(-0.75rem) scale(1.04);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      border-color: var(--text-primary);
      z-index: 10;          /* lift above its neighbours in the hand */
    }

    /* The card awaiting a target reads as held: it stays lifted without hover. */
    .card.pending {
      transform: translateY(-1.25rem);
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), 0 8px 18px rgba(0, 0, 0, 0.3);
      z-index: 11;
    }

    .card.unaffordable {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .card.unaffordable:hover {
      transform: none;
      box-shadow: none;
    }

    .card.unaffordable .card-cost {
      color: var(--color-danger);
      border-color: var(--color-danger);
    }

    /* Blood-cost card that would drop you to 0 HP if played. */
    .card.lethal-cost {
      border-color: var(--color-danger);
      box-shadow: 0 0 0 1px var(--color-danger), 0 0 10px rgba(220, 50, 47, 0.55);
    }

    .card-lethal-warning {
      margin-top: auto;
      text-align: center;
      font-size: var(--fs-xs);
      font-weight: bold;
      letter-spacing: 0.5px;
      color: var(--color-danger);
      border-top: 1px solid var(--color-danger);
      padding-top: 3px;
    }

    .card-cost {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 1.5rem;
      height: 1.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: var(--fs-sm);
    }

    .card-name {
      font-size: var(--fs-md);   /* was inheriting .card's 0.75em, now deleted */
      font-weight: bold;
      text-align: center;
      margin-top: 15px;    /* clears the absolutely-positioned .card-cost badge */
      word-break: break-word;
    }

    .card-type {
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }

    .card-desc {
      font-size: var(--fs-sm);
      text-align: center;
      color: var(--text-muted);
      line-height: 1.2;
      /* .card is still a fixed 92px until Phase 5 makes it elastic; without this a
         long keyword ("Unplayable.") overruns it at the top of the type scale. */
      word-break: break-word;
    }

    .card.attack {
      border-left: 3px solid var(--color-attack);
    }

    .card.skill {
      border-left: 3px solid var(--color-skill);
    }

    .card.power {
      border-left: 3px solid var(--color-power);
    }

    /* ===== Combat log panel ===== */
    .combat-log-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 2px solid var(--border-color);
      background: var(--bg-panel);
      font-size: var(--fs-sm);
    }

    .log-head {
      flex: 0 0 auto;
      padding: 0.5rem 0.75rem;
      margin: 0;                       /* it is an <h2> now; UA margin would offset the panel */
      font-size: var(--fs-base);
      border-bottom: 2px solid var(--border-color);
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .log-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .log-block {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
    }

    /* The turn header is the collapse control, so it is a real button. */
    .log-block-head {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 0.375rem;
      padding: 0.3rem 0.5rem;
      background: none;
      border: none;
      font-family: inherit;
      font-size: var(--fs-sm);
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
    }
    .log-block-head:hover { background: var(--bg-panel); }
    .log-caret { color: var(--text-muted); flex-shrink: 0; }
    .log-summary {
      margin-left: auto;
      color: var(--text-muted);
      font-size: var(--fs-xs);
      text-align: right;
      flex-shrink: 0;
    }

    .log-block-body {
      padding: 0.25rem 0.5rem 0.4rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .log-row {
      line-height: 1.35;
      padding-left: 0.5rem;
      border-left: 2px solid transparent;
    }
    /* Actor is carried by the left edge, so scanning "who did what" is a glance. */
    .log-you  { border-left-color: var(--color-skill); }
    .log-foe  { border-left-color: var(--color-attack); }
    .log-sys  { border-left-color: var(--text-muted); }
    .log-minor { color: var(--text-muted); font-size: var(--fs-xs); }
    .log-kind-death { color: var(--color-elite); font-weight: bold; }
    .log-kind-phase {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: var(--fs-xs);
      margin-top: 0.2rem;
    }
    .log-snap {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      border-left-color: var(--border-color);
      margin-bottom: 0.15rem;
    }

    /* Incoming block: what the enemies will do next. Always open, accented so it
       reads as a warning rather than history. */
    .log-incoming { border-color: var(--color-attack); }
    .log-incoming .log-block-head {
      cursor: default;
      font-weight: bold;
      color: var(--color-attack);
      border-bottom: 1px solid var(--border-color);
    }
    .log-incoming .log-block-body { border-top: none; gap: 0.25rem; }
    /* Wraps rather than overflowing: a long enemy name plus "Attacks 14" does not
       fit one line once --log-w narrows toward its 15rem minimum. */
    .log-incoming-row {
      display: flex;
      justify-content: space-between;
      gap: 0.25rem 0.5rem;
      flex-wrap: wrap;
    }
    .log-incoming-row .log-foe {
      border-left: none;
      padding-left: 0;
      color: var(--text-primary);
      min-width: 0;
    }
    .log-incoming-what { color: var(--text-muted); text-align: right; min-width: 0; }
    .log-total { color: var(--color-attack); font-weight: bold; }

    .combat-controls {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
      padding: 0;
    }

    .end-turn-btn {
      /* Deliberately large (this is the primary action) but capped: in the dock's
         column it used to `flex: 1` and grow to the full ~200px band height. */
      flex: 0 1 auto;
      min-height: 2.75rem;
      max-height: 4.5rem;
      padding: 10px;
      background: var(--color-skill);
      border: 2px solid var(--color-skill);
      color: var(--bg-dark);
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: var(--fs-base);
      transition: all 0.2s;
    }

    .end-turn-btn:hover {
      background: rgba(38, 139, 210, 0.8);
    }

    .end-turn-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* === Rest/Shop/Event/Reward Screens === */
    .center-panel-screen {
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      min-height: 0;   /* lets the panel actually shrink instead of overflowing */
    }

    /* Shared by all eight panel screens (boon, rest, shop, event, card reward,
       treasure, card picker, pile viewer). The scroller lives on .panel-content,
       one level down, so the title and the Leave/Skip/Close button stay pinned on
       every one of them. max-height was a fixed 540px, which is why content grew
       past it as the type scale went up. */
    .center-panel {
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      padding: 1.75rem 2rem;
      max-width: min(42rem, 100%);
      max-height: 100%;
      overflow: hidden;
    }

    /* Grid screens need a DEFINITE width. .card-list uses
       repeat(auto-fill, minmax(..,1fr)), and inside a shrink-to-fit flex item those
       1fr tracks resolve against max-content, collapsing auto-fill toward one
       column. This is the one place shrink-to-fit must not apply. */
    .center-panel.wide {
      width: min(64rem, 100%);
      max-width: min(64rem, 100%);   /* must also lift the base 42rem cap */
    }

    /* These are <h1>/<h2> now — the file had zero heading elements, so assistive
       tech had no structure to navigate by. margin-top and font-weight are reset
       explicitly because the UA sets both on headings and neither was declared
       here, so adopting the tag would otherwise have moved every panel. */
    .panel-title {
      flex: 0 0 auto;
      font-size: var(--fs-xl);
      margin: 0 0 20px;
      font-weight: normal;
      color: var(--text-primary);
      text-align: center;
    }

    .panel-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      margin-bottom: 1.25rem;
    }

    .panel-text {
      line-height: 1.6;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    .choice-button {
      display: block;
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 10px 0;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      text-align: left;
      transition: all 0.2s;
    }

    .choice-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    .choice-label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .choice-desc {
      display: block;
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }

    .card-list {
      display: grid;
      /* auto-fill, not auto-fit: auto-fit collapses empty tracks, so a 2-card row
         would stretch its cards to half the panel. Tracks are sized from the same
         token the hand uses, so a deck card and a held card read alike. */
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
      align-items: start;
    }

    /* .card carries width: 92px for the hand's flex row; in a grid the track owns
       the width, so release it. */
    .card-list .card {
      width: auto;
      max-width: none;
      flex-shrink: 1;
    }

    /* Readable but not interactive (the pile viewer lists your deck — it is not
       "disabled", it just isn't clickable, so it keeps full opacity). */
    .card.static-face { cursor: default; }
    .card.static-face:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--border-color);
    }

    .card.disabled-choice { opacity: 0.45; cursor: not-allowed; }
    .card.disabled-choice:hover { transform: none; box-shadow: none; }

    /* Mouse affordances. The tablet build had no cursor to speak of, so nothing
       here distinguished "you can click this" from "you cannot" except colour.
       .card carries its own cursor rules above. */
    .map-node.available, .choice-button, .menu-button, .end-turn-btn,
    .inline-chip-button, .potion-slot, .status-chip, .relic-chip, .skip-button,
    .leave-button, .new-run-button, .shop-item, #mute-btn { cursor: pointer; }
    .potion-slot.empty { cursor: default; }
    .disabled-choice { cursor: not-allowed; }

    /* === Native control reset ===
       Phase 5 turned map nodes, enemy panels, cards, shop items, potion slots,
       status chips and relic chips from <div data-action> into real <button>s,
       so that the game is reachable by keyboard at all. A <button> brings the
       UA stylesheet with it — centred text, its own font, a system border and
       background — which would otherwise redraw all of those. These properties
       are exactly the ones the UA sets and each element's own rule does not. */
    button.card, button.map-node, button.enemy-panel, button.shop-item,
    button.potion-slot, button.status-chip, button.relic-chip {
      font: inherit;
      color: inherit;
      text-align: inherit;
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }
    /* The UA's disabled greying would fight each element's own dim state. */
    button.card:disabled, button.map-node:disabled, button.shop-item:disabled,
    button.potion-slot:disabled, .choice-button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.map-node:disabled { opacity: 1; }   /* locked nodes have their own .locked styling */

    /* === Focus ===
       There was no :focus rule anywhere in this file, against 22 :hover rules —
       so even the elements that WERE buttons showed only the browser default,
       and the ones that were divs could not be focused at all. Keyboard players
       need to see where they are. :focus-visible, so a mouse click does not
       leave a ring behind. */
    :focus-visible {
      outline: 3px solid var(--color-skill);
      outline-offset: 2px;
    }
    .map-node:focus-visible { outline-offset: 4px; }
    .card:focus-visible { outline-offset: -3px; }   /* cards sit flush in the hand */

    /* Targeting: the enemy you are about to hit should say so under the cursor. */
    .enemy-panel.targetable { cursor: crosshair; }
    .enemy-panel.targetable:hover {
      border-color: var(--text-primary);
      background: rgba(88, 110, 117, 0.12);
    }

    /* Muted sibling of .card-lethal-warning: why a card can't be picked. */
    .card-note {
      margin-top: auto;
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 3px;
    }

    .shop-item {
      border: 2px solid var(--border-color);
      background: var(--bg-dark);
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-item:hover:not(:disabled) {
      border-color: var(--text-primary);
    }

    /* Sold is inert; unaffordable is something more gold would fix, so they
       read differently rather than sharing one dim. Replaces the inline
       styles renderShop used to hand-roll on every item. */
    .shop-item.sold { opacity: 0.35; cursor: default; }
    .shop-item.unaffordable { opacity: 0.55; cursor: not-allowed; }
    .shop-item-name {
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      margin-bottom: 5px;
    }

    .shop-gold { color: var(--color-gold); font-weight: bold; margin-bottom: 15px; }
    .shop-gold-note { color: var(--text-muted); font-weight: normal; }
    .shop-section { margin-bottom: 20px; }
    .shop-section-title {
      color: var(--text-muted);
      margin: 0 0 10px;
      font-size: var(--fs-base);
      font-weight: normal;
    }
    .shop-removal { border-top: 1px solid var(--border-color); padding-top: 15px; }
    .removal-button { color: var(--color-danger); }

    .shop-item-price {
      color: var(--color-gold);
      font-weight: bold;
      font-size: var(--fs-md);
    }

    .leave-button, .skip-button, .new-run-button {
      display: block;
      flex: 0 0 auto;   /* pinned below the .panel-content scroller */
      width: 100%;
      margin-top: 0;
      padding: 0.625rem 1rem;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-base);
      transition: all 0.2s;
    }

    .leave-button:hover, .skip-button:hover, .new-run-button:hover {
      background: var(--border-color);
      border-color: var(--text-primary);
    }

    /* === Victory/GameOver Screens === */
    /* renderGameOver reuses class="victory-screen", so this covers both. */
    .victory-screen {
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      min-height: 0;
    }

    /* Both panels had no max-height and no scroller, so growth clipped silently. */
    .victory-panel, .gameover-panel {
      display: flex;
      flex-direction: column;
      max-width: min(34rem, 100%);
      max-height: 100%;
      overflow: hidden;
    }
    .victory-panel .panel-content, .gameover-panel .panel-content {
      min-height: 0;
      overflow-y: auto;
    }

    .victory-panel {
      text-align: center;
      border: 2px solid var(--color-heal);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
    }

    .victory-title {
      font-size: var(--fs-2xl);
      color: var(--color-heal);
      margin: 0 0 20px;
      font-weight: normal;
    }

    .gameover-panel {
      text-align: center;
      border: 2px solid var(--color-danger);
      padding: 2rem 2.5rem;
      background: var(--bg-panel);
    }

    .gameover-title {
      font-size: var(--fs-2xl);
      color: var(--color-danger);
      margin-bottom: 20px;
    }

    .stats-box {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin: 15px 0;
      text-align: left;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      font-size: var(--fs-md);
    }

    /* Floating combat numbers (fire-and-forget overlay).
       Lives inside #fx-layer now, so this z-index competes only with .fx-sprite
       (which sets none) rather than with the layer itself. It used to be
       appended to document.body at z-index 1000 against the layer's 9999, so the
       attack burst drew OVER the damage number it was meant to accompany. */
    .floating-number {
      position: fixed;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: var(--fs-xl);
      pointer-events: none;
      z-index: 1000;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      animation: float-up 0.9s ease-out forwards;
    }

    .floating-number.floating-dmg { color: var(--color-danger); }
    .floating-number.floating-block { color: var(--color-block); }
    .floating-number.floating-heal { color: var(--color-heal); }

    @keyframes float-up {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
    }

    /* === Impact === */
    /* Nothing in this game shook, flashed or recoiled: taking 30 damage looked
       exactly like taking 3, plus a different numeral. Both animations are
       transform/filter only, so they composite rather than repaint, and both are
       neutered by the reduced-motion rules further down. */
    @keyframes shake-light {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(3px, -1px); }
      75% { transform: translate(-2px, 0); }
    }
    @keyframes shake-heavy {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-7px, 2px); }
      30% { transform: translate(7px, -3px); }
      45% { transform: translate(-6px, 1px); }
      60% { transform: translate(5px, 2px); }
      80% { transform: translate(-3px, -1px); }
    }
    #app.shake-light { animation: shake-light 0.22s ease-in-out; }
    #app.shake-heavy { animation: shake-heavy 0.38s ease-in-out; }

    @keyframes hit-flash {
      0% { filter: brightness(1); }
      30% { filter: brightness(1.9) saturate(0.4); }
      100% { filter: brightness(1); }
    }
    .hit-flash { animation: hit-flash 0.26s ease-out; }

    .disabled-choice, .disabled-choice:hover {
      opacity: 0.45;
      cursor: default;
      background: var(--bg-dark);
      border-color: var(--border-color);
    }

    .inline-chip-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.75rem;
      padding: 0.25rem 0.5rem;
      margin: 2px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--fs-sm);
      border-radius: 3px;
    }

    .inline-chip-button:hover {
      border-color: var(--text-primary);
      background: var(--border-color);
    }

    .debug-panel {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: var(--fs-sm);
      text-align: left;
    }

    /* Shown when Continue Run finds a save it cannot load. Body text colour,
       not danger-red: it sits on the menu panel and must hold 4.5:1. */
    .menu-notice {
      margin: 8px 0 4px;
      padding: 8px 10px;
      border: 1px solid var(--color-danger);
      border-radius: 4px;
      font-size: var(--fs-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .reward-summary {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 12px;
      margin: 12px 0;
      color: var(--text-muted);
    }

    .deck-stats {
      border: 1px solid var(--border-color);
      background: var(--bg-dark);
      padding: 10px;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: var(--fs-sm);
      line-height: 1.5;
    }

    .active-power-chip {
      display: inline-block;
      border: 1px solid var(--color-power);
      color: var(--color-power);
      padding: 2px 5px;
      margin: 2px;
      font-size: var(--fs-xs);
      border-radius: 3px;
    }

    /* Short windows (a maximised 1366x768 lands near 680 of viewport): reclaim
       vertical padding before anything has to scroll. Shrink order is deliberate —
       padding, then the log, then the enemy row scrolls. The hand and dock never
       shrink, because a card you cannot see is a move you do not know you have. */
    /* Short windows (a maximised 1366x768 lands near 680 of viewport): reclaim
       vertical padding before anything has to scroll. Deliberately does NOT cap the
       log's height — at >=1280px the log is a full-height side column, and capping
       it here crushed it to ~65px. */
    @media (max-height: 780px) {
      :root { --dock-h: 6.5rem; }
      /* flex-start, not center: at the floor the panel can exceed the arena by a
         few px, and centred overflow clips BOTH edges with no way to scroll to
         either. Top-aligned, any residue goes to the bottom and is reachable. */
      .combat-enemies  { padding: 0.5rem 1rem; align-items: flex-start; }
      .combat-hand-row { padding: 0.5rem; }
      .combat-dock     { padding: 0.5rem 1rem; }
      /* The panel's CONTENT is what sets the arena's requirement here, not its
         min-height: a 4rem portrait plus a name wrapping to two lines at this width.
         3rem is still larger than the pre-retarget 44px. */
      :root            { --icon-portrait: 3rem; --icon-art: 1.5rem; }
      .enemy-panel     { min-height: 7rem; padding: 0.5rem 0.625rem; gap: 0.25rem; }
      /* The player panel is a 6-row stack and was the tallest thing in the dock.
         Both of these are redundant here: the panel's position identifies it, and
         the orbs already show energy as filled/empty. Reclaims ~40px for the arena. */
      .player-name     { display: none; }
      .energy-label    { display: none; }
      .potion-slot     { width: 2rem; height: 2rem; }
      .player-panel    { gap: 0.15rem; padding: 0.5rem; }
      /* The hand is the tallest band (a 92px-wide card runs ~195px tall once its
         rules text wraps). Shrinking the art and padding costs no information;
         clipping the enemy panel would cost its HP and intent, so trim here first. */
      .card            { padding: 6px; gap: 3px; }
      .card-name       { margin-top: 13px; }
    }

    /* Narrow windows cannot afford a side log beside a ~1008px hand, so it moves
       under the dock as a strip rather than disappearing. */
    @media (max-width: 1279px) {
      .combat-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .combat-log-panel {
        border-left: none;
        border-top: 2px solid var(--border-color);
        max-height: 9rem;
      }
      .log-head { display: none; }
    }

    /* Narrow AND short — the 1000x660 floor, which is also a maximised browser on a
       1366x768 laptop, so it has to work. Measured budget there: status 60 + arena
       128 + hand 211 + dock 160 + log 80 = 639 of 660. The log strip gives back the
       last of it; scroll it or widen the window for more history. Must come after
       both tiers above to win on source order. */
    @media (max-width: 1279px) and (max-height: 780px) {
      .combat-log-panel { max-height: 5rem; }
    }

    /* Minimum supported window. The floor is derived, not chosen: a 10-card hand
       at >=92px cards needs >=972px of width, and the combat band budget needs
       ~645px of height. Retune BOTH numbers here after any combat layout change.
       #mute-btn, #fx-layer and #tooltip must be hidden too, and z-index must beat
       the 9999 on #fx-layer, or they float over the message. (#tooltip cannot be
       triggered once #app is gone, but one already open when the window shrinks
       would linger.) */
    @media (max-width: 999px), (max-height: 659px) {
      #app, #mute-btn, #fx-layer, #tooltip { display: none; }
      body::after {
        content: "The Cinder Vault needs a window at least 1000 x 660. Resize or maximise your browser.";
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2.5rem;
        font-family: 'Courier New', monospace;
        font-size: var(--fs-lg);
        color: var(--text-primary);
        background: var(--bg-dark);
      }
    }

    /* Scrollbar styling. The -webkit-* block covers older WebKit; the standard
       properties cover Firefox and are what modern Chromium honours. */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) var(--bg-dark);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Classes replacing inline font-size styles in the render templates, so every
       size in the game comes from the --fs-* scale and the <12px audit in
       tools/cdp-verify.mjs cannot be dodged by an inline style. */
    .menu-blurb      { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 6px; }
    .asc-text        { font-size: var(--fs-sm); color: var(--text-muted); }
    .menu-tagline    { font-size: var(--fs-sm); color: var(--text-muted); text-align: center; margin-top: 20px; }
    .energy-label    { font-size: var(--fs-xs); color: var(--text-muted); text-align: center; }
    .pile-row        { font-size: var(--fs-md); color: var(--text-muted); }
    .active-powers   { font-size: var(--fs-sm); color: var(--text-muted); }
    .targeting-hint  { font-size: var(--fs-sm); color: var(--color-gold); }
    .shop-item-desc  { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 6px; }

    /* ===== ICONS (game-icons.net) ===== */
    .icon {
      width: 1em; height: 1em;
      display: inline-block;
      vertical-align: -0.15em;
      fill: currentColor;
      pointer-events: none;   /* clicks fall through to the data-action parent */
      flex-shrink: 0;
    }
    /* Inline glyphs: the base rule above (1em) already tracks the type scale, so
       most per-context px overrides were redundant and have been deleted. Only
       these four need to run slightly larger than their label. */
    .status-chip .icon { width: 1.15em; height: 1.15em; }
    .relic-chip .icon { width: 1.35em; height: 1.35em; vertical-align: -0.2em; color: var(--color-relic); }
    .potion-slot .icon { width: 1.35em; height: 1.35em; }
    .card-type .icon { width: 1.1em; height: 1.1em; vertical-align: -0.1em; }

    /* Block-level artwork: sized against a box, not a text run — hence tokens. */
    .map-node-icon .icon { width: var(--icon-node); height: var(--icon-node); }
    .map-node.boss-node .map-node-icon .icon { width: var(--icon-node-boss); height: var(--icon-node-boss); }
    .card-art .icon { width: var(--icon-art); height: var(--icon-art); }
    .shop-item-icon .icon { width: var(--icon-art); height: var(--icon-art); }
    .icon-title { width: var(--icon-title); height: var(--icon-title); margin: 0 8px; vertical-align: -0.15em; }

    .status-chip { gap: 1px; }
    .status-chip .chip-count { font-size: var(--fs-xs); font-weight: bold; }
    .status-item .icon { margin-right: 3px; }
    .status-item.stat-hp .icon { color: var(--color-heal); }
    .status-item.stat-gold .icon { color: var(--color-gold); }
    .status-item.stat-floor .icon { color: var(--text-muted); }
    .card-art { text-align: center; margin: 2px 0; color: var(--text-muted); }
    .card.attack .card-art .icon { color: var(--color-attack); }
    .card.skill .card-art .icon { color: var(--color-skill); }
    .card.power .card-art .icon { color: var(--color-power); }
    .card.curse .card-art .icon { color: var(--color-relic); }
    .icon-block { color: var(--color-block); }
    .shop-item-icon { text-align: center; margin-bottom: 4px; color: var(--text-muted); }
    .choice-label .icon { vertical-align: -0.2em; margin-right: 2px; }
    .choice-desc .icon { vertical-align: -0.1em; }
    .reward-summary .icon { vertical-align: -0.15em; }
    .inline-chip-button .icon { vertical-align: -0.1em; }
    /* Curated colored pixel-art icons (relics/potions). Inherit per-context .icon sizing above;
       render crisply (no smoothing) and keep their own colors (no currentColor tint). */
    img.icon-img { image-rendering: pixelated; image-rendering: crisp-edges; object-fit: contain; fill: none; }
    .relic-chip img.icon-img { color: initial; }
    /* Transient combat effect sprites (pixel-art), layered above everything, click-through. */
    #fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
    .fx-sprite { position: fixed; image-rendering: pixelated; pointer-events: none; will-change: transform, opacity; }

    /* === Reduced motion ===
       Honours the OS setting; Phase 8 adds a manual toggle that sets
       .reduced-motion on <body> and reuses these same rules.

       Two things here are deliberate and easy to get wrong:

       1. .map-node's `transform: translate(-50%, -50%)` is LAYOUT, not motion —
          it is how a node centres on its coordinate. A blanket `transform: none`
          teleports every node up-left by half its size and the whole map
          visibly misaligns. Only the scale() on top of it may go, so the hover
          rule is restated with the translate kept.

       2. Killing float-up is only safe because spawnFloatingNumber() already
          backs its animationend listener with a 1200ms setTimeout removal
          (see section 4). Without that fallback, `animation: none` means the
          event never fires and every damage number stays on screen forever.

       The JS frame-sequence sprites in #fx-layer are motion by construction, so
       they are hidden outright rather than slowed. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .map-edge.reachable { animation: none; }
      .map-node.available:hover { transform: translate(-50%, -50%); }   /* keep the centring, drop the scale */
      .card:hover { transform: none; }                                  /* .card has no layout transform */
      .floating-number { animation: none; opacity: 1; }
      #fx-layer { display: none; }
    }

    /* Manual override (Phase 8 settings). Same rules, same caveats. */
    body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    body.reduced-motion .map-edge.reachable { animation: none; }
    body.reduced-motion .map-node.available:hover { transform: translate(-50%, -50%); }
    body.reduced-motion .card:hover { transform: none; }
    body.reduced-motion .floating-number { animation: none; opacity: 1; }
    body.reduced-motion #fx-layer { display: none; }

    /* Hover tooltip. Lives outside #app so render() never destroys it, and is
       pointer-events:none because a hoverable tooltip would sit under the cursor
       and steal its own mouseout. */
    #tooltip[hidden] { display: none; }
    #tooltip {
      position: fixed;
      z-index: 600;
      pointer-events: none;
      max-width: 24rem;
      padding: 0.625rem 0.875rem;
      border: 2px solid var(--border-color);
      background: var(--bg-panel);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      font-size: var(--fs-sm);
      line-height: 1.4;
      text-align: left;
    }
    .tooltip-title { font-weight: bold; margin-bottom: 0.25rem; }
    .tooltip-body { color: var(--text-muted); white-space: pre-line; }
  </style>
</head>
<body>
  <div id="app"></div>
  <button id="mute-btn" title="Toggle sound" aria-label="Toggle sound">&#9834;</button>
  <div id="fx-layer"></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <script src="assets/icons.js"></script>
  <script>
    // ============ 1. CONSTANTS ============
    const SCREENS = {
      MENU: 'MENU',
      BOON: 'BOON',
      MAP: 'MAP',
      COMBAT: 'COMBAT',
      REST: 'REST',
      SHOP: 'SHOP',
      EVENT: 'EVENT',
      CARD_REWARD: 'CARD_REWARD',
      TREASURE: 'TREASURE',
      VICTORY: 'VICTORY',
      GAMEOVER: 'GAMEOVER'
    };

    const CARD_TYPES = { ATTACK: 'ATTACK', SKILL: 'SKILL', POWER: 'POWER', CURSE: 'CURSE' };
    const CARD_RARITIES = { BASIC: 'BASIC', COMMON: 'COMMON', UNCOMMON: 'UNCOMMON', RARE: 'RARE' };
    const NODE_TYPES = { COMBAT: 'COMBAT', ELITE: 'ELITE', REST: 'REST', SHOP: 'SHOP', EVENT: 'EVENT', TREASURE: 'TREASURE', BOSS: 'BOSS' };

    const LAYOUT = {
      ENERGY_MAX: 3,
      HAND_SIZE: 10,
      STARTING_MAX_HP: 80,
      STARTING_GOLD: 0,
      // FLOORS and COLS are game rules: generateMap(), validateContent() and
      // autoplayAll() read them. Map pixel geometry lives in MAP_LAYOUT instead.
      FLOORS: 16,
      COLS: 6
    };

    // Max HP the Fortify rest option grants. Rest sites are the only repeatable
    // source of max HP, which is what gives a long run a growth axis.
    const REST_FORTIFY_HP = 6;

    // Floors reserved entirely for one node type, so every route through the map
    // passes a treasure and a shop. (Floors 1, 15 and 16 are reserved in
    // generateMap itself as combat / rest / boss.)
    const GUARANTEED_FLOORS = { 5: NODE_TYPES.TREASURE, 9: NODE_TYPES.SHOP };
    // Act 2 reserves a SECOND shop, and that is the load-bearing part of it.
    // rollCombatGold inflates 15% per act, so an Act 2 with Act 1's single shop
    // hands you a larger and larger pile of gold with nowhere to spend it.
    // Treasure drops to one because Act 2 pays relics out of its denser elites.
    const GUARANTEED_FLOORS_ACT2 = { 4: NODE_TYPES.TREASURE, 8: NODE_TYPES.SHOP, 12: NODE_TYPES.SHOP };
    function guaranteedFloorsFor(act) {
      return act >= 2 ? GUARANTEED_FLOORS_ACT2 : GUARANTEED_FLOORS;
    }

    // Elite node weight by act, highest floor threshold first:
    // [fromFloor, weight, weightAtAscension2+]. Act 1's rows are the exact
    // numbers this was written with as three inline literals; Act 2 starts the
    // ramp three floors earlier and ends it higher, because by then you have a
    // deck worth spending on a relic. Act 3+ reuses Act 2's.
    const ELITE_RAMP = {
      1: [[6, 0.18, 0.24], [3, 0.10, 0.10]],
      2: [[5, 0.26, 0.34], [2, 0.16, 0.16]]
    };

    const RARITY_WEIGHTS = { COMMON: 0.6, UNCOMMON: 0.3, RARE: 0.1 };
    const ELITE_RARITY_WEIGHTS = { COMMON: 0.45, UNCOMMON: 0.35, RARE: 0.20 };
    const BOSS_RARITY_WEIGHTS = { COMMON: 0.35, UNCOMMON: 0.40, RARE: 0.25 };
    // Every potion has declared a `rarity` since they were written and NOTHING
    // read it: both roll sites picked uniformly from Object.keys(POTIONS_DB), so
    // Overcharge Vial — the run-winning 2-energy burst — was exactly as likely as
    // a 5 HP heal. Flatter than the card table because a potion is one use, not a
    // permanent deck slot.
    const POTION_RARITY_WEIGHTS = { COMMON: 0.55, UNCOMMON: 0.34, RARE: 0.11 };
    // How many of BOONS_DB the opening screen offers. The screen used to render
    // the whole table, so growing the table was the only way to change the offer
    // and doing so would have shown every boon at once.
    const BOON_OFFER_SIZE = 4;
    const DEV_TOOLS = true;

    // Each level is implemented in exactly ONE place. Levels that change a number
    // read during play keep an `ascension >= N` test at the site they affect
    // (findable with one grep); levels that shape the run before it starts
    // declare an applyOnRunStart here, so the bootstrap does not accumulate a
    // pile of magic numbers — `ascension >= 5` for the Doubt curse was already
    // the third one written out by hand.
    //
    // The gate walks every level and asserts it is observably different from the
    // level below it, because a level added here with no implementation anywhere
    // is silent: ASCENSION_MAX is derived, so the menu offers it regardless.
    const ASCENSIONS = [
      { level: 1, name: 'Hardened Foes', desc: 'Enemies have 10% more HP.' },
      { level: 2, name: 'Dangerous Paths', desc: 'Elites appear more often on the map.' },
      { level: 3, name: 'Lean Spoils', desc: 'Combat gold rewards are reduced by 15%.' },
      { level: 4, name: 'Vault Tyrant', desc: 'Bosses have 25% more HP.' },
      {
        level: 5, name: 'Dark Burden', desc: 'Start each run with a Doubt curse.',
        applyOnRunStart: (state) => { state.run.deck.push({ uid: uid(), defId: 'curse-doubt', upgraded: false }); }
      },
      {
        level: 6, name: 'Narrow Belt', desc: 'You carry two potions instead of three.',
        applyOnRunStart: (state) => { state.run.potions = state.run.potions.slice(0, 2); }
      },
      { level: 7, name: 'Cold Embers', desc: 'Resting heals 20% of max HP instead of 30%.' },
      { level: 8, name: 'Bare Shelves', desc: 'Shops stock three class cards instead of four.' },
      { level: 9, name: 'Tainted Air', desc: 'Start every combat with 2 Blight.' },
      { level: 10, name: 'Crowned in Ash', desc: 'Bosses begin each fight with 2 Might.' }
    ];
    // Derived, not a literal. The cap used to be a bare `5` in recordRunResult
    // and again in renderMenu, so adding a level meant finding both — and
    // missing one silently caps unlocks below the content that exists.
    const ASCENSION_MAX = ASCENSIONS.length;

    const STATUS_INFO = {
      might: { label: 'Might', short: 'M', desc: 'Increases damage dealt.' },
      sapped: { label: 'Sapped', short: 'Sap', desc: 'Damage dealt is reduced.' },
      exposed: { label: 'Exposed', short: 'Exp', desc: 'Incoming damage is increased.' },
      mending: { label: 'Mending', short: 'Mend', desc: 'Heals at the start of turn, then decays.' },
      blight: { label: 'Blight', short: 'Blt', desc: 'Takes damage at the start of turn, then decays.' },
      warded: { label: 'Warded', short: 'Ward', desc: 'Adds extra block whenever block is gained.' },
      grace: { label: 'Grace', short: 'Grc', desc: 'Gain that much Block at the start of each turn.' },
      brittle: { label: 'Brittle', short: 'Brt', desc: 'Block gained is reduced by 25%. Decays each turn.' },
      aegis: { label: 'Aegis', short: 'Aeg', desc: 'Negates the next debuff applied. One stack per debuff.' }
    };

    // Card keywords. These existed only as boolean flags on card definitions and
    // as words appended to rules text; nothing in the game ever said what they
    // meant. Documented here so the glossary and the inline tooltips read from
    // one source rather than each carrying its own copy of the wording.
    const KEYWORD_INFO = {
      Exhaust:    { label: 'Exhaust', desc: 'When played, this card leaves the fight entirely instead of going to your discard pile. It comes back next combat.' },
      Ethereal:   { label: 'Ethereal', desc: 'If this card is still in your hand when your turn ends, it is exhausted instead of discarded.' },
      Retain:     { label: 'Retain', desc: 'This card is not discarded at the end of your turn — you keep it in hand.' },
      Innate:     { label: 'Innate', desc: 'This card is always drawn in your opening hand.' },
      Unplayable: { label: 'Unplayable', desc: 'This card cannot be played. It clogs your hand until something removes it.' },
      Block:      { label: 'Block', desc: 'Absorbs incoming damage before it reaches your HP. Unspent block is lost at the start of your next turn.' },
      Energy:     { label: 'Energy', desc: 'Spent to play cards. Refills to your maximum at the start of each turn; unspent energy is lost.' },
      Exhausted:  { label: 'Exhausted', desc: 'Removed from the fight. Exhausted cards return to your deck for the next combat.' }
    };

    // Every term the inline annotator and the glossary both know about, keyed by
    // the lowercase word so matching is case-insensitive but display keeps the
    // casing the card text used.
    const GLOSSARY_TERMS = (() => {
      const terms = {};
      for (const info of Object.values(STATUS_INFO)) {
        terms[info.label.toLowerCase()] = { title: info.label, body: info.desc };
      }
      for (const [word, info] of Object.entries(KEYWORD_INFO)) {
        terms[word.toLowerCase()] = { title: info.label, body: info.desc };
      }
      return terms;
    })();

    // Longest-first, so "Exhausted" is not matched as "Exhaust" + "ed".
    const GLOSSARY_RE = new RegExp(
