        const it = enemy.intent ? enemy.intent.type : 'UNKNOWN';
        const intentIcon = intentIconFor(it);
        const showValue = ['ATTACK','ATTACK_ALL','BUFF_MIGHT','BLOCK_INTENT','SAPPED','EXPOSED','BLIGHT','BRITTLE','HEAL','ADD_CURSE'].includes(it);
        const intentValue = showValue ? (it === 'ATTACK' || it === 'ATTACK_ALL' ? previewEnemyAttack(enemy, STATE.combat.player) : (enemy.intent.value || 1)) : '';

        const predicted = pendingDef ? previewCardDamage(STATE, pendingDef, pendingCard, enemy) : null;
        const lethal = predicted != null && predicted >= enemy.hp + enemy.block;
        const previewHTML = predicted != null
          ? `<div class="dmg-preview ${lethal ? 'lethal' : ''}">${lethal ? 'LETHAL' : `−${predicted}`}</div>`
          : '';

        // Always a <button>, never `disabled` — the action swaps instead. Two
        // reasons it is not a disabled button when you are not targeting:
        // Chrome suppresses pointer events on disabled controls, which would
        // kill the hover tooltip that is this panel's main job; and the panel
        // is still useful as a click-to-pin inspect target between targets.
        // The nested inspect anchor that used to sit on .enemy-intent is gone
        // with it — nesting a second control inside a button is invalid, and
        // this panel's own tooltip already states the intent.
        const panelBody = `${enemy.hp}/${enemy.maxHp} HP.\nNext turn: ${intentDesc[it] || 'unknown'}${intentValue !== '' ? ' for ' + intentValue : ''}.`;
        return `
          <button type="button" class="enemy-panel ${targeting ? 'targetable' : ''} ${lethal ? 'lethal-target' : ''}" data-enemyuid="${enemy.uid}"
               data-action="${targeting ? 'targetEnemy' : 'inspect'}"
               aria-label="${attrEscape(`${enemy.name}, ${enemy.hp} of ${enemy.maxHp} HP${targeting ? ', press to target' : ''}`)}"
               data-ititle="${attrEscape(enemy.name)}" data-ibody="${attrEscape(panelBody)}">
            <div class="enemy-intent">${intentIcon} ${intentValue}</div>
            <div class="enemy-body">
              <div class="enemy-portrait">${enemyIcon(enemy.defId)}</div>
              <div class="enemy-info">
                <div class="enemy-name">${enemy.name}</div>
                <div class="hp-display"><span>HP</span><span>${enemy.hp} / ${enemy.maxHp}</span></div>
                <div class="hp-bar-long"><div class="hp-fill-long" style="width: ${hpPercent}%"></div></div>
                ${previewHTML}
                ${enemy.block > 0 ? `<div class="block-display">${icon('block','icon-block')} ${enemy.block}</div>` : ''}
                <div class="statuses">${statusHTML}</div>
              </div>
            </div>
          </button>
        `;
      }).join('');

      // The player's chips are not inside a control, so they keep click-to-pin
      // and become real buttons.
      const playerStatusHTML = Object.entries(player.statuses).filter(([k, v]) => v > 0).map(([k, v]) => {
        const info = STATUS_INFO[k];
        return `<button type="button" class="status-chip" ${inspectAttrs(`${statusLabel(k)} ${v}`, info ? info.desc : '')}>${statusIcon(k)}<span class="chip-count">${v}</span></button>`;
      }).join('');

      const energyOrbs = Array(Math.max(energyMax, energy)).fill(0).map((_, i) => `<div class="energy-orb ${i < energy ? 'full' : 'empty'}">${i < energy ? icon('energy') : ''}</div>`).join('');
      const activePowerHTML = (STATE.combat.activePowers || []).map(card => {
        const def = CARDS_DB[card.defId];
        return def ? `<span class="active-power-chip" ${inspectAttrs(def.name + (card.upgraded ? '+' : ''), describeCard(card))}>${def.name}${card.upgraded ? '+' : ''}</span>` : '';
      }).join('');

      const potionsHTML = STATE.run.potions.map((pid, slot) => {
        if (!pid) return `<div class="potion-slot empty" data-ititle="Empty potion slot" data-ibody="Potions you pick up land here.">·</div>`;
        const pdef = POTIONS_DB[pid];
        const selected = STATE.combat.pendingPotionSlot === slot;
        return `<button type="button" class="potion-slot${selected ? ' selected' : ''}" data-action="usePotion" data-slot="${slot}" aria-label="${attrEscape('Use ' + pdef.name)}" data-ititle="${attrEscape(pdef.name)}" data-ibody="${attrEscape((pdef.desc || 'Use potion.') + (selected ? '\nSelect a target, or press Esc to cancel.' : ''))}">${potionIcon(pid)}</button>`;
      }).join('');

      const handHTML = hand.map(card => {
        const cardDef = CARDS_DB[card.defId];
        const affordable = cardDef.cost === 'X' || cardDef.cost <= energy;
        // Blood-cost cards can kill you now, so say so before it happens.
        const hpCost = cardHpCost(cardDef, card.upgraded);
        const lethal = hpCost > 0 && hpCost >= STATE.run.hp;
        return cardFaceHTML(card, {
          action: 'selectCard',
          dataAttr: 'data-carduid',
          dataValue: card.uid,
          extraClass: [
            affordable ? '' : 'unaffordable',
            lethal ? 'lethal-cost' : '',
            // The card awaiting a target stays lifted, so "which one did I pick?"
            // is answerable without reading the targeting hint.
            card.uid === STATE.combat.pendingCardUid ? 'pending' : ''
          ].filter(Boolean).join(' '),
          warning: lethal ? 'LETHAL COST' : '',
          titleSuffix: lethal ? ` — WARNING: its ${hpCost} HP cost would kill you` : ''
        });
      }).join('');


      // Flag an End Turn that would throw away energy you could still spend.
      const wastedEnergy = energy > 0 && hand.some(c => {
        const def = CARDS_DB[c.defId];
        return def && !def.unplayable && (def.cost === 'X' || def.cost <= energy);
      });

      return `
        <div class="screen combat-screen">
          <div class="combat-body">
            <div class="combat-main">
              <div class="combat-enemies">${enemyHTML}</div>

              <div class="combat-hand-row">
                ${targeting ? '<div class="targeting-hint">Choose a target, or click Cancel (or the selected card/potion again) to cancel.</div>' : ''}
                <div class="combat-hand">${handHTML}</div>
              </div>

              <div class="combat-dock">
                <div class="player-panel">
                  <div class="player-name">Player</div>
                  <div class="hp-display"><span>HP</span><span>${STATE.run.hp} / ${STATE.run.maxHp}</span></div>
                  <div class="hp-bar-long"><div class="hp-fill-long" style="width: ${(STATE.run.hp / STATE.run.maxHp) * 100}%"></div></div>
                  <div class="player-row">
                    <div class="energy-display">${energyOrbs}</div>
                    <div class="energy-label">Energy ${energy}/${energyMax}</div>
                    ${player.block > 0 ? `<div class="block-display">${icon('block','icon-block')} ${player.block}</div>` : ''}
                  </div>
                  <div class="statuses">${playerStatusHTML}</div>
                  <div class="potion-row">${potionsHTML}</div>
                </div>

                <div class="dock-center">
                  <div class="pile-row">
                    Hand (${hand.length}/${LAYOUT.HAND_SIZE})
                    <button class="inline-chip-button" data-action="viewPile" data-pile="drawPile">Draw ${STATE.combat.drawPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="discardPile">Discard ${STATE.combat.discardPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="exhaustPile">Exhaust ${STATE.combat.exhaustPile.length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="activePowers">Powers ${(STATE.combat.activePowers || []).length}</button>
                    <button class="inline-chip-button" data-action="viewPile" data-pile="deck">${icon('deck')} Deck ${STATE.run.deck.length}</button>
                  </div>
                  ${activePowerHTML ? `<div class="active-powers">Active Powers: ${activePowerHTML}</div>` : ''}
                  ${wastedEnergy ? `<div class="energy-warning">${energy} energy unspent — you still have a card you can play.</div>` : ''}
                </div>

                <div class="combat-controls">
                  ${targeting ? '<button class="end-turn-btn" data-action="cancelTargeting">Cancel</button>' : ''}
                  <button class="end-turn-btn ${wastedEnergy ? 'warn' : ''}" data-action="endTurn">End Turn</button>
                </div>
              </div>
            </div>

            ${renderCombatLog(STATE)}
          </div>
        </div>
      `;
    }

    function renderRest() {
      const healAmt = Math.floor(STATE.run.maxHp * 0.3);
      const restBlocked = anyRelic(STATE, r => r.blocksRest);
      const canRefine = STATE.run.deck.some(c => !c.upgraded && !isCurseCardInstance(c));
      const canPurge = STATE.run.deck.length > 1;

      // `disabled`, not "omit the data-action". The old form left a button that
      // was still tab-focusable and still announced as enabled, and did nothing
      // when pressed, with no feedback.
      const option = (choice, label, desc, enabled) => `
        <button type="button" class="choice-button ${enabled ? '' : 'disabled-choice'}" data-action="applyRestChoice" data-choice="${choice}"${enabled ? '' : ' disabled'}>
          <span class="choice-label">${label}</span>
          <span class="choice-desc">${desc}</span>
        </button>
      `;

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel">
            <h2 class="panel-title">${icon('t-rest','icon-title')} Rest Site ${icon('t-rest','icon-title')}</h2>
            <div class="panel-content">
              <div class="panel-text">You've reached a safe place to rest. Choose one action:</div>
              ${option('rest', 'Rest',
                restBlocked ? 'A relic denies you the campfire’s warmth.' : `Heal ${healAmt} HP (30% of max)`,
                !restBlocked)}
              ${option('refine', 'Refine (Upgrade a Card)',
                canRefine ? 'Permanently upgrade one card in your deck' : 'Every card is already upgraded',
                canRefine)}
              ${option('purge', 'Purge (Remove a Card)',
                canPurge ? 'Permanently remove one card from your deck — free' : 'Your deck is too small to thin',
                canPurge)}
              ${option('fortify', 'Fortify',
                `Gain ${REST_FORTIFY_HP} max HP and heal for the same amount`,
                true)}
            </div>
            <button class="leave-button" data-action="leaveRest">Continue</button>
          </div>
        </div>
      `;
    }

    function renderShop() {
      const node = STATE.run.map.nodes.find(n => n.id === STATE.run.currentNodeId);
      const { cards, relics, potions } = node.shopInventory;
      const gold = STATE.run.gold;

      const shopItem = (label, price, sold, canBuy, action, dataAttr, desc, iconHtml) => {
        const affordable = !sold && canBuy && gold >= price;
        // Sold is inert; unaffordable is something you could buy with more gold,
        // so the cursor distinguishes them.
        const priceLabel = sold ? 'SOLD' : `${icon('gold')} ${price}`;
        const state = sold ? ' sold' : (!affordable ? ' unaffordable' : '');
        // Always a real <button> carrying its data-action, `disabled` when it
        // cannot be bought. It used to be a <div> with the action omitted, which
        // made the entire shop unreachable by keyboard and left the dimmed items
        // announcing as ordinary content rather than unavailable controls.
        return `
          <button type="button" class="shop-item${state}" data-action="${action}" ${dataAttr}${sold || !affordable ? ' disabled' : ''}
                  aria-label="${attrEscape(label + (sold ? ', sold out' : !affordable ? ', cannot afford, ' + price + ' gold' : ', ' + price + ' gold'))}">
            ${iconHtml ? `<div class="shop-item-icon">${iconHtml}</div>` : ''}
            <div class="shop-item-name">${label}</div>
            ${desc ? `<div class="shop-item-desc">${annotateKeywords(desc)}</div>` : ''}
            <div class="shop-item-price">${priceLabel}</div>
          </button>
        `;
      };

      const cardsHTML = cards.map(card => shopItem(card.name, card.price, card.sold, true, 'buyCard', `data-cardid="${card.id}"`, describeCard(CARDS_DB[card.id]), cardArtIcon(card.id, CARDS_DB[card.id].type))).join('');
      const relicsHTML = relics.map(relic => shopItem(relic.name, relic.price, relic.sold || hasRelic(STATE, relic.id), !hasRelic(STATE, relic.id), 'buyRelic', `data-relicid="${relic.id}"`, RELICS_DB[relic.id].description, relicIcon(relic.id, ''))).join('');

      const potionsFull = STATE.run.potions.every(p => p !== null);
      const potionsHTML = potions.map((potion, i) => shopItem(potion.name, potion.price, potion.sold, !potionsFull, 'buyPotion', `data-potionidx="${i}"`, POTIONS_DB[potion.id].desc, potionIcon(potion.id))).join('');

      const removalCost = removalPrice(STATE);
      const canRemove = gold >= removalCost && STATE.run.deck.length > 1;

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel wide">
            <h2 class="panel-title">${icon('t-shop','icon-title')} Shop ${icon('t-shop','icon-title')}</h2>
            <div class="panel-content">
              <div class="shop-gold">Gold: ${gold}${potionsFull ? ' <span class="shop-gold-note">(potion slots full)</span>' : ''}</div>
              <section class="shop-section">
                <h3 class="shop-section-title">Cards</h3>
                <div class="card-list">${cardsHTML}</div>
              </section>
              <section class="shop-section">
                <h3 class="shop-section-title">Relics</h3>
                <div class="card-list">${relicsHTML}</div>
              </section>
              <section class="shop-section">
                <h3 class="shop-section-title">Potions</h3>
                <div class="card-list">${potionsHTML}</div>
              </section>
              <div class="shop-removal">
                <button type="button" class="choice-button removal-button" data-action="removeCard"${canRemove ? '' : ' disabled'}>
                  <span class="choice-label">Remove a Card</span>
                  <span class="choice-desc">Remove a card from your deck. Cost: ${icon('gold')} ${removalCost}</span>
                </button>
              </div>
            </div>
            <button class="leave-button" data-action="leaveShop">Leave Shop</button>
          </div>
        </div>
      `;
    }

    function renderEvent() {
      const event = STATE.ui.eventDef;
      if (!event) return renderMap();

      const choicesHTML = event.choices.map((choice, idx) => {
        const canApply = !choice.canApply || choice.canApply(STATE);
        return `
          <button type="button" class="choice-button ${canApply ? '' : 'disabled-choice'}" data-action="chooseEvent" data-choiceidx="${idx}"${canApply ? '' : ' disabled'}>
            <span class="choice-label">${choice.label}</span>
            ${choice.desc ? `<span class="choice-desc">${choice.desc}${canApply ? '' : ' (Unavailable)'}</span>` : ''}
          </button>
        `;
      }).join('');

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel">
            <h2 class="panel-title">${icon('t-event','icon-title')} ${event.title} ${icon('t-event','icon-title')}</h2>
            <div class="panel-content">
              <div class="panel-text">${event.text}</div>
              ${choicesHTML}
              ${STATE.ui.error ? `
              <button class="choice-button" data-action="leaveEvent">
                <span class="choice-label">Walk away</span>
                <span class="choice-desc">Leave without taking a choice.</span>
              </button>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderCardReward() {
      const choices = STATE.ui.cardRewardChoices || [];
      const reward = STATE.ui.combatReward || {};
      const potion = reward.potionId ? POTIONS_DB[reward.potionId] : null;
      const hasPotionRoom = STATE.run.potions.some(p => p === null);

      // These are raw card DEFS from generateCardReward, not instances —
      // cardFaceHTML normalises both.
      const choicesHTML = `<div class="card-list">${choices.map((card, idx) => cardFaceHTML(card, {
        action: 'selectCardRewardChoice',
        dataAttr: 'data-cardidx',
        dataValue: idx
      })).join('')}</div>`;

      const replacePotionHTML = !hasPotionRoom && !reward.potionTaken ? STATE.run.potions.map((pid, slot) => {
        const pdef = pid ? POTIONS_DB[pid] : null;
        return pdef ? `<button class="inline-chip-button" data-action="replacePotion" data-slot="${slot}">Replace ${pdef.name}</button>` : '';
      }).join('') : '';
      const potionHTML = potion ? `
        <div class="reward-summary">
          Potion drop: <strong>${potion.name}</strong> — ${potion.desc || ''}
          ${reward.potionTaken ? '<div style="color:var(--color-heal);">Potion claimed.</div>' : hasPotionRoom ? `<button class="inline-chip-button" data-action="claimPotion">Claim Potion</button>` : `<div style="color:var(--color-danger);">Potion slots full.</div>${replacePotionHTML}`}
        </div>
      ` : '';
      const relicHTML = reward.relicId ? `<div class="reward-summary">Relic gained: <strong style="color:var(--color-relic);">${RELICS_DB[reward.relicId].name}</strong> — ${RELICS_DB[reward.relicId].description}</div>` : '';
      const maxHpHTML = reward.maxHpGained ? `<div class="reward-summary">Max HP gained: <strong style="color:var(--color-heal);">+${reward.maxHpGained}</strong></div>` : '';
      const eventRewardHTML = reward.eventRewardText ? `<div class="reward-summary">${reward.eventRewardText}</div>` : '';

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel wide">
            <h2 class="panel-title">${icon('t-reward','icon-title')} Combat Reward ${icon('t-reward','icon-title')}</h2>
            <div class="panel-content">
              <div class="reward-summary">Gold gained: <strong style="color:var(--color-gold);">${icon('gold')} ${reward.gold || 0}</strong>${reward.isElite ? ' · Elite defeated' : ''}</div>
              ${eventRewardHTML}
              ${relicHTML}
              ${maxHpHTML}
              ${potionHTML}
              <div class="panel-text">Choose a card to add to your deck:</div>
              ${choicesHTML}
            </div>
            <button class="skip-button" data-action="skipCardReward">Skip Card</button>
          </div>
        </div>
      `;
    }

    // The three sealed caches a treasure node offers. Opening one is the whole
    // decision, so each has a distinct shape: a relic gamble, flat gold, or
    // consumables. The outcome is resolved and shown on this screen — it used to
    // be rolled inside the leave handler, where the player never saw it.
    const TREASURE_CACHES = [
      { id: 'relic', label: 'Iron-Bound Chest', desc: 'A relic you do not own. If the vault has none left, gold instead.' },
      { id: 'gold', label: 'Coin Coffer', desc: 'A generous pile of gold.' },
      { id: 'supply', label: 'Quartermaster’s Crate', desc: 'A potion and a modest sum of gold.' }
    ];

    function openTreasureCache(game, cacheId) {
      const node = game.run.map.nodes.find(n => n.id === game.run.currentNodeId);
      if (!node || node.treasureResult) return;
      const result = { cache: cacheId, gold: 0 };

      if (cacheId === 'relic') {
        const relicId = getRandomRelic(game);
        if (relicId) {
          grantRelic(game, relicId);
          result.relicId = relicId;
        } else {
          result.gold = 70 + Math.floor(rand() * 21);
        }
      } else if (cacheId === 'gold') {
        result.gold = 60 + Math.floor(rand() * 31);
      } else {
        result.gold = 40;
        const slot = game.run.potions.findIndex(p => p === null);
        if (slot !== -1) {
          // The third roll site, and the one the plan for this phase missed:
          // the Quartermaster's Crate rolled uniformly too.
          result.potionId = rollPotion();
          game.run.potions[slot] = result.potionId;
        } else {
          result.potionFull = true;
          result.gold += 25; // no room for the potion, so pay out instead
        }
      }

      game.run.gold += result.gold;
      node.treasureResult = result;
      AudioEngine.sfx('reward');
    }

    function renderTreasure() {
      const node = STATE.run.map.nodes.find(n => n.id === STATE.run.currentNodeId);
      const result = node && node.treasureResult;

      let body;
      if (result) {
        const lines = [];
        if (result.relicId) {
          lines.push(`<div class="reward-summary">Relic found: <strong style="color:var(--color-relic);">${RELICS_DB[result.relicId].name}</strong> — ${RELICS_DB[result.relicId].description}</div>`);
        }
        if (result.potionId) {
          lines.push(`<div class="reward-summary">Potion stowed: <strong>${POTIONS_DB[result.potionId].name}</strong> — ${POTIONS_DB[result.potionId].desc || ''}</div>`);
        }
        if (result.potionFull) {
          lines.push(`<div class="reward-summary" style="color:var(--color-danger);">No room on your potion belt — the quartermaster paid you out instead.</div>`);
        }
        if (result.gold > 0) {
          lines.push(`<div class="reward-summary">Gold gained: <strong style="color:var(--color-gold);">${icon('gold')} ${result.gold}</strong></div>`);
        }
        if (result.cache === 'relic' && !result.relicId) {
          lines.push(`<div class="reward-summary">The vault has no relics left to give.</div>`);
        }
        if (!lines.length) {
          lines.push(`<div class="reward-summary">This alcove has already been emptied.</div>`);
        }
        body = `<div class="panel-text">The cache splits open.</div>${lines.join('')}`;
      } else {
        body = `
          <div class="panel-text">Three sealed caches rest in the alcove. You have time to force exactly one.</div>
          ${TREASURE_CACHES.map(c => `
            <button class="choice-button" data-action="pickTreasure" data-cache="${c.id}">
              <span class="choice-label">${c.label}</span>
              <span class="choice-desc">${c.desc}</span>
            </button>
          `).join('')}
        `;
      }

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel">
            <h2 class="panel-title">${icon('t-treasure','icon-title')} Treasure ${icon('t-treasure','icon-title')}</h2>
            <div class="panel-content">${body}</div>
            ${result ? '<button class="leave-button" data-action="leaveTreasure">Continue</button>' : ''}
          </div>
        </div>
      `;
    }

    function renderVictory() {
      return `
        <div class="screen victory-screen">
          <div class="victory-panel">
            <h1 class="victory-title">${icon('t-victory','icon-title')} VICTORY! ${icon('t-victory','icon-title')}</h1>
            <div class="panel-content">
              <div class="panel-text">You have defeated ${STATE.run.bossName || 'the vault boss'} and escaped Act ${STATE.act || 1} of the Cinder Vault!</div>
              <div class="stats-box">
                <div class="stat-line"><span>Act Cleared:</span><span>${STATE.act || 1}</span></div>
                <div class="stat-line"><span>Floors Cleared:</span><span>${STATE.run.floor}</span></div>
                <div class="stat-line"><span>Gold Collected:</span><span>${STATE.run.gold}</span></div>
                <div class="stat-line"><span>Deck Size:</span><span>${STATE.run.deck.length}</span></div>
                <div class="stat-line"><span>Relics Collected:</span><span>${STATE.run.relics.length}</span></div>
              </div>
            </div>
            <div class="run-seed-line">Seed <code>${STATE.seed}</code></div>
            ${(() => {
              // "Continue Into Deeper Vault" read as an endless-mode toggle, which
              // is exactly what it was. Act 2 now has its own encounters, elites,
              // map shape and boss pool, so the button names the act and the line
              // above names what is waiting — and because the pools are disjoint,
              // what is named there can never be the corpse this screen is
              // celebrating. The names sit on their own line rather than in the
              // button because a long button label is how the 1000x660 minimum
              // gets broken.
              const nextAct = (STATE.act || 1) + 1;
              const numeral = ['', 'I', 'II', 'III', 'IV', 'V'][nextAct] || String(nextAct);
              const names = (ACT_TABLES[nextAct] || ACT_TABLES[2]).bosses
                .filter(id => id !== STATE.run.bossId)
                .map(id => ENEMIES_DB[id].name).join(' or ');
              return `${names ? `<div class="run-seed-line">Below: ${names}</div>` : ''}
            <button class="new-run-button" data-action="continueEndless">Descend into Act ${numeral}</button>`;
            })()}
            <button class="new-run-button" data-action="newRun">Play Again (same character)</button>
            <button class="new-run-button" data-action="returnToMenu">Return to Menu</button>
          </div>
        </div>
      `;
    }

    function renderGameOver() {
      return `
        <div class="screen victory-screen">
          <div class="gameover-panel">
            <div class="gameover-title">${icon('t-defeat','icon-title')} DEFEAT ${icon('t-defeat','icon-title')}</div>
            <div class="panel-content">
              <div class="panel-text">Your journey has come to an end...</div>
              <div class="stats-box">
                <div class="stat-line"><span>Reached Floor:</span><span>${STATE.run.floor}</span></div>
                <div class="stat-line"><span>Gold Collected:</span><span>${STATE.run.gold}</span></div>
                <div class="stat-line"><span>Cards in Deck:</span><span>${STATE.run.deck.length}</span></div>
                <div class="stat-line"><span>Relics Collected:</span><span>${STATE.run.relics.length}</span></div>
              </div>
            </div>
            <div class="run-seed-line">Seed <code>${STATE.seed}</code></div>
            <button class="new-run-button" data-action="newRun">Try Again (same character)</button>
            <button class="new-run-button" data-action="returnToMenu">Return to Menu</button>
          </div>
        </div>
      `;
    }

    function renderCardPicker() {
      const picker = STATE.ui.picker;
      // 'remove' (paid, shop), 'purge' (free, rest site) and 'boon' (free, run
      // start) all take a card out of the deck; 'refine' upgrades one.
      const isRemove = picker.purpose === 'remove' || picker.purpose === 'purge' || picker.purpose === 'boon';
      const title = isRemove
        ? `${icon('t-remove','icon-title')} Remove a Card ${icon('t-remove','icon-title')}`
        : `${icon('t-upgrade','icon-title')} Upgrade a Card ${icon('t-upgrade','icon-title')}`;
      const desc = isRemove ? 'Choose a card to permanently remove from your deck:' : 'Choose a card to permanently upgrade:';

      const cardsHTML = `<div class="card-list">${STATE.run.deck.map(card => {
        const cardDef = CARDS_DB[card.defId];
        const disabled = !isRemove && (card.upgraded || cardDef.type === CARD_TYPES.CURSE);
        const note = cardDef.type === CARD_TYPES.CURSE && !isRemove ? 'curses cannot be upgraded'
          : (card.upgraded && !isRemove ? 'already upgraded' : '');
        return cardFaceHTML(card, {
          // Keeps its data-action even when disabled: cardFaceHTML emits a real
          // <button disabled>, so the click never fires and assistive tech
          // announces it as unavailable instead of as a plain element.
          action: 'pickCard',
          dataAttr: 'data-carduid',
          dataValue: card.uid,
          // On the upgrade picker, show what you would GET (the name stays unsuffixed
          // because the card is not upgraded yet).
          previewUpgraded: (!isRemove && !disabled) ? true : undefined,
          disabled,
          note
        });
      }).join('')}</div>`;

      return `
        <div class="screen center-panel-screen">
          <div class="center-panel wide">
            <h2 class="panel-title">${title}</h2>
            <div class="panel-content">
              <div class="panel-text">${desc}</div>
              ${cardsHTML}
            </div>
            <button class="leave-button" data-action="cancelPicker">Cancel</button>
          </div>
        </div>
      `;
    }

    function renderDeckStats(cards) {
      if (!cards || !cards.length) return '';
      const counts = { ATTACK: 0, SKILL: 0, POWER: 0, CURSE: 0 };
      const costs = {};
      let totalCost = 0;
      let countedCost = 0;
      for (const card of cards) {
        const def = CARDS_DB[card.defId];
        if (!def) continue;
        counts[def.type] = (counts[def.type] || 0) + 1;
        const numericCost = typeof def.cost === 'number' ? def.cost : null;
        if (def.type !== CARD_TYPES.CURSE && numericCost != null) { totalCost += numericCost; countedCost++; }
        const key = numericCost == null ? 'X' : (numericCost >= 3 ? '3+' : String(numericCost));
        costs[key] = (costs[key] || 0) + 1;
      }
      const avg = countedCost ? (totalCost / countedCost).toFixed(2) : '0.00';
      const curve = ['0','1','2','3+'].concat(costs['X'] ? ['X'] : []).map(k => `${k}: ${costs[k] || 0}`).join(' · ');
      return `<div class="deck-stats">Types: Attack ${counts.ATTACK || 0} · Skill ${counts.SKILL || 0} · Power ${counts.POWER || 0} · Curse ${counts.CURSE || 0}<br>Average non-curse cost: ${avg}<br>Cost curve: ${curve}</div>`;
    }

    function renderPileViewer() {
      const pile = STATE.ui.pileViewer;
      let title = 'Cards';
      let cards = [];
      if (pile === 'deck') {
        title = `Deck (${STATE.run.deck.length})`;
        cards = STATE.run.deck;
      } else if (STATE.combat && STATE.combat[pile]) {
        const labels = { drawPile: 'Draw Pile', discardPile: 'Discard Pile', exhaustPile: 'Exhaust Pile', activePowers: 'Active Powers', hand: 'Hand' };
        title = `${labels[pile] || pile} (${STATE.combat[pile].length})`;
        cards = STATE.combat[pile];
      }
      // Real card faces in a grid: a 30-card deck used to show about four rows.
      // These are readable but not clickable, hence staticFace rather than the
      // dimmed disabled-choice this list used before.
      const cardsHTML = cards.length
        ? `<div class="card-list">${cards.map(card => cardFaceHTML(card, { staticFace: true })).join('')}</div>`
        : '<div class="panel-text">No cards here.</div>';
      const statsHTML = pile === 'deck' ? renderDeckStats(cards) : '';
      return `
        <div class="screen center-panel-screen">
          <div class="center-panel wide">
            <h2 class="panel-title">${title}</h2>
            ${statsHTML}
            <div class="panel-content">${cardsHTML}</div>
            <button class="leave-button" data-action="closeOverlay">Close</button>
          </div>
        </div>
      `;
    }

    function renderStatusBar() {
      const relicChips = STATE.run.relics.map(relic => {
        const relicDef = RELICS_DB[relic];
        const abbr = relicDef.short || relic.substring(0, 2).toUpperCase();
        return `<button type="button" class="relic-chip" aria-label="${attrEscape(relicDef.name)}" ${inspectAttrs(relicDef.name, relicDef.description)}>${relicIcon(relic, abbr)}</button>`;
      }).join('');
      const potionChips = STATE.run.potions.map((pid, slot) => {
        if (!pid) return `<div class="potion-slot empty" data-ititle="Empty potion slot" data-ibody="Potions you pick up land here.">·</div>`;
        const pdef = POTIONS_DB[pid];
        const usable = STATE.combat || pdef.usableOutOfCombat;
        return `
          <div class="potion-slot-wrap">
            <button type="button" class="potion-slot" data-action="usePotion" data-slot="${slot}"${usable ? '' : ' disabled'} aria-label="${attrEscape('Use ' + pdef.name + (usable ? '' : ' (combat only)'))}" data-ititle="${attrEscape(pdef.name)}" data-ibody="${attrEscape((pdef.desc || '') + (!STATE.combat && !pdef.usableOutOfCombat ? '\nCombat only.' : ''))}">${potionIcon(pid)}</button>
            <button type="button" class="potion-discard" data-action="discardPotion" data-slot="${slot}" aria-label="${attrEscape('Discard ' + pdef.name)}" data-ititle="Discard" data-ibody="${attrEscape('Throw away ' + pdef.name + ' to free the slot.')}">×</button>
          </div>
        `;
      }).join('');

      return `
        <div class="status-bar">
          <div class="status-left">
            <div class="status-item stat-hp">${icon('hp')} <span style="color: var(--color-heal);">${STATE.run.hp}/${STATE.run.maxHp}</span></div>
            <div class="status-item stat-gold">${icon('gold')} <span style="color: var(--color-gold);">${STATE.run.gold}</span></div>
            <div class="status-item stat-floor">${icon('floor')} <span>${STATE.run.floor}/${LAYOUT.FLOORS}</span></div>
            <div class="status-item">${STATE.run.characterName || 'Runner'} A${STATE.ascension || 0} · Act ${STATE.act || 1}</div>
            <button class="inline-chip-button" data-action="viewPile" data-pile="deck">${icon('deck')} Deck ${STATE.run.deck.length}</button>
            <button class="inline-chip-button" data-action="openGlossary" data-tab="statuses"
                    data-ititle="Reference" data-ibody="Keybindings, every status effect, and every card keyword.">Help</button>
            <button class="inline-chip-button" data-action="openSettings"
                    data-ititle="Settings" data-ibody="Volume, reduced motion, and save data.">Settings</button>
            <button class="inline-chip-button" data-action="abandonRun"
                    data-ititle="Leave run" data-ibody="Abandon this run and return to the title screen. The run is recorded as a loss and the save is deleted.">Menu</button>
          </div>
          <div class="status-right">
            <div class="potion-row">${potionChips}</div>
            <div class="relic-tray">${relicChips}</div>
          </div>
        </div>
      `;
    }

    function usePotionFromSlot(game, slot, targetUid) {
      const potionId = game.run.potions[slot];
      const potionDef = potionId ? POTIONS_DB[potionId] : null;
      if (!potionDef) return;
      let target = null;
      if (potionDef.target === 'ENEMY_SINGLE') {
        if (!game.combat) return;
        target = game.combat.enemies.find(e => e.uid === targetUid && e.alive) || game.combat.enemies.find(e => e.alive) || null;
        if (!target) return;
      } else if (!game.combat && !potionDef.usableOutOfCombat) {
        return;
      }
      potionDef.custom(game, target);
      AudioEngine.sfx('potion');
      if (game.combat) playEffect('player', 'potion');  // magical burst on the player when quaffing
      game.run.potions[slot] = null;
      if (game.combat) {
        game.combat.pendingPotionSlot = null;
        game.combat.pendingCardUid = null;
        checkCombatEnd(game);
      }
    }

    function cancelTargeting(game) {
      if (!game || !game.combat) return false;
      const hadTargeting = !!game.combat.pendingCardUid || game.combat.pendingPotionSlot !== null;
      game.combat.pendingCardUid = null;
      game.combat.pendingPotionSlot = null;
      return hadTargeting;
    }

    // ============ 11. HANDLERS ============

    // Hover tooltips. DOM-only and deliberately OUTSIDE render(): inspect state
    // lives in STATE.ui.inspect and dismissing it goes through render(), which
    // rewrites app.innerHTML wholesale. Doing that on mouseover would rebuild the
    // DOM on every pointer movement and destroy the very element being hovered,
    // so the tooltip would flicker and the mouseout would never fire on the
    // original node. Click-to-pin still goes through STATE.ui.inspect.
    //
    // Anchors are any element carrying data-ititle (inspectAttrs emits them on
    // relics, status chips, potions and enemy intents; cardFaceHTML emits them
    // directly, since a card's click must stay selectCard).
    const Tooltip = (function () {
      const tip = document.getElementById('tooltip');
      const DELAY = 120;      // hover-intent: don't flash while sweeping a 10-card hand
      const GAP = 8;
      let timer = null;
      let current = null;

      function hide() {
        clearTimeout(timer);
        current = null;
        tip.hidden = true;
        tip.setAttribute('aria-hidden', 'true');
      }

      function show(el) {
        tip.innerHTML =
          `<div class="tooltip-title">${el.dataset.ititle}</div>` +
          (el.dataset.ibody ? `<div class="tooltip-body">${el.dataset.ibody}</div>` : '');
        // Park at the origin before measuring: measuring at the previous position
        // can be a position where the box is clamped, which rewraps the text and
        // gives a width that no longer applies once it moves.
        tip.style.left = '0px';
        tip.style.top = '0px';
        tip.hidden = false;
        const r = el.getBoundingClientRect();
        const t = tip.getBoundingClientRect();
        // Prefer above the anchor; flip below when that would clip the top edge.
        const top = r.top - t.height - GAP >= GAP ? r.top - t.height - GAP : r.bottom + GAP;
        const left = Math.min(
          Math.max(GAP, r.left + r.width / 2 - t.width / 2),
          window.innerWidth - t.width - GAP
        );
        tip.style.left = `${Math.round(left)}px`;
        tip.style.top = `${Math.round(top)}px`;
        tip.setAttribute('aria-hidden', 'false');
      }

      const app = document.getElementById('app');

      app.addEventListener('mouseover', (e) => {
        const el = e.target.closest('[data-ititle]');
        if (!el || el === current) return;
        current = el;
        clearTimeout(timer);
        timer = setTimeout(() => { if (current === el) show(el); }, DELAY);
      });

      app.addEventListener('mouseout', (e) => {
        if (!e.target.closest('[data-ititle]')) return;
        // Moves that stay inside the SAME anchor are not a real exit. Without
        // this, crossing from .card onto its own .card-desc hides the tooltip and
        // the following mouseover bails on `el === current`, so it never returns.
        const next = e.relatedTarget && e.relatedTarget.closest
          ? e.relatedTarget.closest('[data-ititle]')
          : null;
        if (next === current) return;
        hide();
      });

      // render() can remove the hovered element without any mouseout firing (a
      // click re-renders the whole screen), which would strand the tooltip over a
      // dead anchor. Scrolling the map moves the anchor out from under it too.
      app.addEventListener('click', hide);
      app.addEventListener('scroll', hide, true);   // capture: scroll doesn't bubble
      window.addEventListener('blur', hide);

      return { hide };
    })();

    // Drag-panning the map. Wheel scrolling needs no code — .map-screen is
    // overflow:auto, so the browser already does it.
    //
    // The threshold is the whole point: without it a drag that happens to end on
    // a .map-node fires the delegated click and travels the node, irreversibly
    // advancing the run. Past the threshold we swallow the next click in the
    // CAPTURE phase, which runs before the bubbling #app listener ever sees it —
    // so the game's click handler needs no knowledge of dragging.
    (function initMapDrag() {
      const THRESHOLD = 5;   // px of movement before a press counts as a drag
      let port = null, dragging = false, moved = false;
      let sx = 0, sy = 0, sl = 0, st = 0;

      document.getElementById('app').addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        port = e.target.closest('.map-screen');
        if (!port) return;
        dragging = true;
        moved = false;
        sx = e.clientX; sy = e.clientY;
        sl = port.scrollLeft; st = port.scrollTop;
      });

      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < THRESHOLD) return;
        if (!moved) {
          moved = true;
          port.classList.add('dragging');
          Tooltip.hide();          // a node tooltip would trail the pointer
        }
        port.scrollLeft = sl - dx;
        port.scrollTop = st - dy;
      });

      window.addEventListener('pointerup', () => {
        if (!dragging) return;
        dragging = false;
        if (port) port.classList.remove('dragging');
        if (moved) {
          window.addEventListener('click', (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
          }, { capture: true, once: true });
        }
        port = null;
      });
    })();

    // The action table, extracted from the listener so the error boundary can
    // wrap it without burying a 270-line switch inside a try block. No case
    // returns early — verified — so the caller's tail render/save always runs.
    function dispatchAction(action, btn) {
      switch (action) {
        case 'startGame': {
          // The seed field is read HERE, at click time, rather than through an
          // input listener. #app has exactly one delegated listener by design
          // (see the two rules in OVERVIEW), and one field does not justify a
          // second dispatch path — the value only matters at the moment you
          // press Start.
          const seedEl = document.getElementById('seed-input');
          const raw = seedEl ? String(seedEl.value).trim() : '';
          const parsed = raw === '' ? null : Number(raw);
          const opts = {
            characterId: btn.dataset.characterid || 'cinder-knight',
            ascension: parseInt(btn.dataset.ascension || '0') || 0
          };
          // A non-numeric seed is ignored rather than becoming NaN, which would
          // poison seedRng and make the "same seed, same run" promise a lie.
          if (parsed != null && Number.isFinite(parsed)) opts.seed = parsed >>> 0;
          startNewRun(opts);
          goTo(SCREENS.BOON);
          break;
        }

        // Typing into the seed field does not re-render (no input listener), so
        // the value only needs preserving when something ELSE redraws the menu —
        // opening history, then closing it again.
        case 'useSeed':
          STATE.ui.seedInput = btn.dataset.seed || '';
          STATE.ui.history = false;
          break;

        case 'viewHistory':
          // Keep whatever is already typed so opening history does not discard it.
          {
            const el = document.getElementById('seed-input');
            if (el) STATE.ui.seedInput = el.value;
          }
          STATE.ui.history = true;
          break;

        case 'closeHistory':
          STATE.ui.history = false;
          break;

        case 'abandonRun':
          askConfirm(
            'Leave this run?',
            `You are on floor ${STATE.run.floor} with ${STATE.run.hp} HP. Leaving records the run as a loss and deletes the save. This cannot be undone.`,
            'Leave run', 'doAbandonRun', true);
          break;

        case 'confirmCancel':
          STATE.ui.confirm = null;
          break;

        case 'confirmYes': {
          const pending = STATE.ui.confirm;
          STATE.ui.confirm = null;
          if (pending && pending.action) dispatchAction(pending.action, btn);
          break;
        }

        case 'doAbandonRun':
          // recordRunResult also clears the save, and marks this as a departure
          // rather than a death so the history can tell them apart.
          STATE.run.abandoned = true;
          recordRunResult(STATE, false);
          returnToMenu();
          break;

        case 'returnToMenu':
          returnToMenu();
          break;

        case 'openSettings':
          STATE.ui.settings = true;
          break;

        case 'closeSettings':
          STATE.ui.settings = false;
          break;

        case 'toggleSetting': {
          const key = btn.dataset.key;
          if (key === 'muted' || key === 'reducedMotion') {
            SETTINGS[key] = !SETTINGS[key];
            saveSettings();
            AudioEngine.applySettings();
            applyMotionPreference();
            syncMuteButton();
          }
          break;
        }

        case 'askClearSave':
          askConfirm(
            'Clear all save data?',
            'This deletes the run in progress, your run history, and every ascension unlock. Settings are kept. This cannot be undone.',
            'Delete everything', 'doClearSave', true);
          break;

        case 'doClearSave':
          clearSave();
          try { localStorage.removeItem(META_KEY); } catch (e) {}
          STATE.ui.settings = false;
          returnToMenu();
          break;

        case 'chooseBoon': {
          const boon = BOONS_DB.find(b => b.id === btn.dataset.boonid);
          if (boon) {
            boon.apply(STATE);
            // 'clarity' opens the card picker; every other boon resolves at once.
            if (!STATE.ui.picker) goTo(SCREENS.MAP);
          }
          break;
        }

        case 'continueRun':
          if (!loadGame()) {
            // The save exists but cannot be loaded (wrong version, or names
            // content that no longer exists). Silence here left a Continue
            // button that did nothing, forever. Say so, and offer the fix.
            STATE.ui = STATE.ui || {};
            STATE.ui.menuNotice = 'This save could not be loaded — it was written by an incompatible version of the game.';
            render();
          }
          break;

        case 'clearDeadSave':
          askConfirm(
            'Delete the unloadable save?',
            'This deletes only the stuck run. Your run history, unlocks and settings are kept.',
            'Delete it', 'doClearDeadSave', true);
          break;

        case 'doClearDeadSave':
          clearSave();
          STATE.ui.menuNotice = null;
          break;

        case 'travelNode':
          travelToNode(STATE, btn.dataset.nodeid);
          break;

        case 'selectCard':
          playCard(STATE, btn.dataset.carduid);
          break;

        case 'targetEnemy':
          if (STATE.combat.pendingPotionSlot !== null) {
            usePotionFromSlot(STATE, STATE.combat.pendingPotionSlot, btn.dataset.enemyuid);
          } else if (STATE.combat.pendingCardUid) {
            const card = STATE.combat.hand.find(c => c.uid === STATE.combat.pendingCardUid);
            if (card) playCard(STATE, card.uid, btn.dataset.enemyuid);
          }
          break;

        case 'endTurn':
          endPlayerTurn(STATE);
          break;

        case 'cancelTargeting':
          cancelTargeting(STATE);
          break;

        case 'applyRestChoice':
          applyRest(STATE, btn.dataset.choice);
          break;

        case 'leaveRest':
          goTo(SCREENS.MAP);
          break;

        case 'leaveShop':
          goTo(SCREENS.MAP);
          break;

        case 'pickTreasure':
          openTreasureCache(STATE, btn.dataset.cache);
          break;

        case 'leaveTreasure':
          goTo(SCREENS.MAP);
          break;

        // Braced. A `const` in an unbraced case scopes to the whole switch, so
        // the first later case to reuse one of these names would be a
        // redeclaration SyntaxError that takes the entire file down at load.
        case 'chooseEvent': {
          const eventChoiceIdx = parseInt(btn.dataset.choiceidx);
          const activeEvent = STATE.ui.eventDef;
          const eventChoice = activeEvent.choices[eventChoiceIdx];
          if (!eventChoice.canApply || eventChoice.canApply(STATE)) {
            eventChoice.apply(STATE);
            // Event HP prices can now be fatal, and nothing else checks HP
            // outside combat.
            if (checkRunDeath(STATE)) break;
            if (STATE.screen === SCREENS.COMBAT) {
              STATE.ui.eventDef = null;
            } else {
              fireNonCombatRelicHook(STATE, 'onEventComplete', { event: activeEvent, choice: eventChoice });
              STATE.ui.eventDef = null;
              goTo(SCREENS.MAP);
            }
          }
          break;
        }

        // The one exit from a broken event. An apply() that throws used to strand
        // the player here forever: the boundary rolls the throw back, but the only
        // controls on screen were the same choices that had just failed.
        case 'leaveEvent':
          STATE.ui.eventDef = null;
          goTo(SCREENS.MAP);
          break;

        case 'selectCardRewardChoice': {
          const cardIdx = parseInt(btn.dataset.cardidx);
          selectCardReward(STATE, STATE.ui.cardRewardChoices[cardIdx]);
          break;
        }

        case 'dismissError':
          if (STATE.ui) STATE.ui.error = null;
          break;

        case 'reloadGame':
          location.reload();
          break;

        case 'clearSaveAndReload':
          clearSave();
          location.reload();
          break;

        case 'skipCardReward':
          selectCardReward(STATE, null);
          break;

        case 'claimPotion': {
          const reward = STATE.ui.combatReward;
          const emptySlot = STATE.run.potions.findIndex(p => p === null);
          if (reward && reward.potionId && !reward.potionTaken && emptySlot !== -1) {
            STATE.run.potions[emptySlot] = reward.potionId;
            reward.potionTaken = true;
          }
          break;
        }

        case 'replacePotion': {
          const reward = STATE.ui.combatReward;
          const slot = parseInt(btn.dataset.slot);
          if (reward && reward.potionId && !reward.potionTaken && STATE.run.potions[slot]) {
            STATE.run.potions[slot] = reward.potionId;
            reward.potionTaken = true;
          }
          break;
        }

        case 'continueEndless':
          continueEndlessRun(STATE);
          break;

        case 'newRun': {
          const opts = STATE && STATE.run ? { characterId: STATE.run.characterId || 'cinder-knight', ascension: STATE.ascension || 0 } : {};
          startNewRun(opts);
          goTo(SCREENS.BOON);
          break;
        }

        case 'buyCard':
        case 'buyRelic':
        case 'buyPotion':
          buyShopItem(STATE, action, btn);
          break;

        case 'removeCard':
          if (STATE.run.gold >= removalPrice(STATE) && STATE.run.deck.length > 1) {
            STATE.ui.picker = { purpose: 'remove' };
          }
          break;

        case 'pickCard': {
          const cardUid = btn.dataset.carduid;
          const purpose = STATE.ui.picker.purpose;
          const deckIdx = STATE.run.deck.findIndex(c => c.uid === cardUid);
          if (deckIdx !== -1) {
            if (purpose === 'remove') {
              // Must read the price BEFORE incrementing the counter it depends on.
              STATE.run.gold -= removalPrice(STATE);
              STATE.run.removalsThisRun++;
              STATE.run.deck.splice(deckIdx, 1);
              STATE.ui.picker = null;
              goTo(SCREENS.SHOP);
            } else if (purpose === 'refine') {
              if (!isCurseCardInstance(STATE.run.deck[deckIdx])) STATE.run.deck[deckIdx].upgraded = true;
              STATE.ui.picker = null;
              goTo(SCREENS.MAP);
            } else if (purpose === 'purge' || purpose === 'boon') {
              // Free removals (rest-site Purge, opening boon) — no gold cost and
              // no bump to the shop's escalating removal price.
              STATE.run.deck.splice(deckIdx, 1);
              STATE.ui.picker = null;
              goTo(SCREENS.MAP);
            }
          }
          break;
        }

        case 'cancelPicker': {
          const purpose = STATE.ui.picker ? STATE.ui.picker.purpose : null;
          STATE.ui.picker = null;
          goTo(purpose === 'remove' ? SCREENS.SHOP : purpose === 'boon' ? SCREENS.BOON : SCREENS.REST);
          break;
        }

        case 'usePotion': {
          const slot = parseInt(btn.dataset.slot);
          const potionId = STATE.run.potions[slot];
          const potionDef = potionId ? POTIONS_DB[potionId] : null;
          if (!potionDef) break;
          if (STATE.combat) {
            if (STATE.combat.pendingPotionSlot === slot) {
              STATE.combat.pendingPotionSlot = null;
            } else {
              const aliveEnemies = STATE.combat.enemies.filter(e => e.alive);
              if (potionDef.target === 'ENEMY_SINGLE' && aliveEnemies.length > 1) {
                STATE.combat.pendingPotionSlot = slot;
                STATE.combat.pendingCardUid = null;
              } else {
                usePotionFromSlot(STATE, slot, aliveEnemies[0] ? aliveEnemies[0].uid : null);
              }
            }
          } else {
            usePotionFromSlot(STATE, slot, null);
          }
          break;
        }

        case 'discardPotion': {
          const slot = parseInt(btn.dataset.slot);
          if (STATE.run.potions[slot]) {
            STATE.run.potions[slot] = null;
            if (STATE.combat && STATE.combat.pendingPotionSlot === slot) STATE.combat.pendingPotionSlot = null;
          }
          break;
        }

        case 'inspect':
          STATE.ui.inspect = { title: btn.dataset.ititle || '', body: btn.dataset.ibody || '' };
          break;

        case 'closeInspect':
          STATE.ui.inspect = null;
          break;

        case 'closeKeyHelp':
          STATE.ui.keyHelp = false;
          break;

        case 'helpTab':
          STATE.ui.helpTab = btn.dataset.tab || 'keys';
          break;

        case 'openGlossary':
          STATE.ui.keyHelp = true;
          STATE.ui.helpTab = btn.dataset.tab || 'statuses';
          break;

        case 'viewPile':
          STATE.ui.pileViewer = btn.dataset.pile || 'deck';
          break;
        case 'toggleLogTurn':
          // View-only: flips this turn away from its default open/closed state.
          {
            const turn = parseInt(btn.dataset.turn, 10);
            if (!Number.isNaN(turn)) {
              if (_logToggled.has(turn)) _logToggled.delete(turn);
              else _logToggled.add(turn);
            }
          }
          break;

        case 'closeOverlay':
          STATE.ui.pileViewer = null;
          STATE.ui.picker = null;
          break;
      }
    }

    document.getElementById('app').addEventListener('click', (e) => {
      AudioEngine.unlock();               // first gesture unlocks audio
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      // A disabled control still matches closest('[data-action]') in browsers
      // that dispatch the click; ignore it rather than running the action.
      if (btn.disabled) return;

      AudioEngine.sfx('click');           // light UI tick on any actionable click
      const action = btn.dataset.action;

      // Any action other than opening another inspect dismisses the panel, so it
      // never lingers over a screen it no longer describes.
      if (action !== 'inspect' && STATE.ui) STATE.ui.inspect = null;

      _inDispatch = true;
      try {
        dispatchAction(action, btn);
      } catch (err) {
        _inDispatch = false;
        recoverFromError('click:' + action, err);
        return;
      }
      _inDispatch = false;
      // The single render+save for the whole action. Combat actions
      // (playCard/endTurn/targetEnemy) mutate state without navigating, so this
      // must run whether or not the action called goTo().
      try {
        render();
        checkpoint(STATE);
      } catch (err) {
        recoverFromError('click:' + action + ':render', err);
      }
    });

    function syncMuteButton() {
      const btn = document.getElementById('mute-btn');
      if (btn) btn.classList.toggle('muted', !!SETTINGS.muted);
    }

    // ===== The second delegated listener on #app =====
    //
    // A THIRD rule, alongside the two in OVERVIEW. A range slider cannot be
    // driven by the click-only dispatcher: it emits `input` as it is dragged,
    // and there is no click to hang the value off.
    //
    // THIS HANDLER MUST NEVER CALL render(). Re-rendering on `input` would
    // replace the very slider under the cursor and the drag would die on the
    // first pixel — the same failure the Tooltip IIFE already documents for
    // `mouseover`, and it is handled the same way: mutate the DOM directly and
    // deliberately bypass the render cycle. The panel is redrawn from SETTINGS
    // the next time anything else renders, and the values agree because both
    // read the same store.
    //
    // Scoped to [data-setting] so it cannot touch anything else, and it does not
    // set _inDispatch: nothing here mutates run state, so there is nothing to
    // save and nothing to roll back.
    document.getElementById('app').addEventListener('input', (e) => {
      const el = e.target.closest('[data-setting]');
      if (!el) return;
      const key = el.dataset.setting;
      if (!(key in SETTINGS)) return;
      try {
        const pct = Math.max(0, Math.min(100, Number(el.value) || 0));
        SETTINGS[key] = pct / 100;
        saveSettings();
        AudioEngine.applySettings();
        // DOM-only readout update, for the reason above.
        const out = document.getElementById('out-' + key);
        if (out) out.textContent = pct + '%';
      } catch (err) {
        logError('settings-input:' + key, err);
      }
    });

    document.addEventListener('keydown', (e) => {
      _inDispatch = true;
      try {
        handleKeydown(e);
      } catch (err) {
        recoverFromError('keydown:' + e.key, err);
        return;
      } finally {
        _inDispatch = false;
      }
    });

    // Body kept as its own function rather than wrapped in place: it early-returns
    // in nine places, and every one of them must keep meaning "stop handling this
    // key", not "skip the catch".
    function handleKeydown(e) {
      if (!STATE) return;
      if (e.key === 'Escape') {
        // Dismiss order mirrors overlayHTML()'s stacking order: whatever is on
        // top goes first, so Esc always closes the thing you are looking at.
        if (STATE.ui && STATE.ui.confirm) {
          STATE.ui.confirm = null;
          render();
          return;
        }
        if (STATE.ui && STATE.ui.history) {
          STATE.ui.history = false;
          render();
          return;
        }
        if (STATE.ui && STATE.ui.settings) {
          STATE.ui.settings = false;
          render();
          return;
        }
        if (STATE.ui && STATE.ui.inspect) {
          STATE.ui.inspect = null;
          render();
          return;
        }
        if (STATE.ui && (STATE.ui.pileViewer || STATE.ui.picker)) {
          STATE.ui.pileViewer = null;
          STATE.ui.picker = null;
          render();
          return;
        }
        if (cancelTargeting(STATE)) { render(); return; }
        if (STATE.ui && STATE.ui.keyHelp) { STATE.ui.keyHelp = false; render(); return; }
      }

      // --- Global shortcuts. These MUST stay above the two guards below, which
      // early-return on an open overlay and on any screen that isn't combat.
      // Both are UI-only, so neither calls saveGame(). ---
      if (e.key === '?' || (e.key === '/' && e.shiftKey)) {
        STATE.ui.keyHelp = !STATE.ui.keyHelp;
        render();
        return;
      }
      if (e.key.toLowerCase() === 'd' && STATE.run && !(STATE.ui && (STATE.ui.pileViewer || STATE.ui.picker))) {
        STATE.ui.pileViewer = 'deck';
        render();
        return;
      }

      if (STATE.ui && (STATE.ui.pileViewer || STATE.ui.picker)) return;
      if (STATE.screen !== SCREENS.COMBAT || !STATE.combat || STATE.combat.phase !== 'PLAYER') return;
      if (e.key.toLowerCase() === 'e') {
        endPlayerTurn(STATE);
        render();
        checkpoint(STATE);
        return;
      }
      // 1-9 then 0 for the tenth. HAND_SIZE is 10, so binding only 1-9 left the
      // last card in a full hand unreachable by keyboard.
      const n = e.key === '0' ? 10 : parseInt(e.key, 10);
      if (!Number.isNaN(n) && n >= 1 && n <= 10) {
        if (STATE.combat.pendingCardUid || STATE.combat.pendingPotionSlot !== null) {
          const enemies = STATE.combat.enemies.filter(x => x.alive);
          const enemy = enemies[n - 1];
          if (enemy) {
            if (STATE.combat.pendingPotionSlot !== null) usePotionFromSlot(STATE, STATE.combat.pendingPotionSlot, enemy.uid);
            else playCard(STATE, STATE.combat.pendingCardUid, enemy.uid);
          }
        } else {
          const card = STATE.combat.hand[n - 1];
          if (card) playCard(STATE, card.uid);
        }
        render();
        checkpoint(STATE);
      }
    }

    function validateContent() {
      const warnings = [];
      const knownTargets = ['SELF', 'ENEMY_SINGLE', 'ENEMY_ALL'];
      const knownCardFields = ['id', 'name', 'cost', 'type', 'rarity', 'target', 'values', 'upgradedValues', 'effects', 'custom', 'desc', 'exhaust', 'unplayable', 'ethereal', 'retain', 'innate', 'onEndTurnInHand', 'character', 'onTurnStart', 'onDamageTaken', 'onEnemyKilled', 'onCardPlayed', 'hpCost'];
      const validCharacters = Object.keys(CHARACTERS_DB).concat(['SHARED']);
      for (const [id, card] of Object.entries(CARDS_DB)) {
        if (id !== card.id) warnings.push(`Card key/id mismatch: ${id}`);
        if (!card.name || card.cost == null || !card.type || !card.rarity) warnings.push(`Card missing fields: ${id}`);
        if (card.cost !== 'X' && typeof card.cost !== 'number') warnings.push(`Card cost must be a number or 'X': ${id}`);
        if (card.target && !knownTargets.includes(card.target)) warnings.push(`Unknown card target on ${id}: ${card.target}`);
        if (card.type !== CARD_TYPES.CURSE && !validCharacters.includes(card.character)) warnings.push(`Card ${id} has missing/unknown character: ${card.character}`);
        for (const key of Object.keys(card)) if (!knownCardFields.includes(key)) warnings.push(`Unknown card field '${key}' on ${id} (typo in a keyword flag?)`);
        if (card.hpCost != null && typeof card.hpCost !== 'number' && typeof card.hpCost !== 'function') {
          warnings.push(`Card ${id} hpCost must be a number or (upgraded)=>number`);
        }
        // A card whose whole body is custom() but which declares no desc renders
        // with an empty description box: describeCard has nothing to build from
        // and returns only the keyword suffix.
        if (card.custom && !card.desc && !(card.effects || []).length) {
          warnings.push(`Card ${id} has custom() but no desc — its face will render blank`);
        }
        for (const eff of (card.effects || [])) {
          if (!['DAMAGE','BLOCK','DRAW','ENERGY','HEAL','APPLY_STATUS','APPLY_SELF_STATUS'].includes(eff.type)) warnings.push(`Unsupported effect ${eff.type} on ${id}`);
          if ((eff.type === 'APPLY_STATUS' || eff.type === 'APPLY_SELF_STATUS') && !STATUS_INFO[eff.status]) warnings.push(`Unknown status ${eff.status} on ${id}`);
          // A misspelled key is the quietest bug in the whole data layer:
          // values['blght'] is undefined, DAMAGE deals NaN, and nothing anywhere
          // complains — the card simply does nothing and looks like it should.
          if (eff.key != null) {
            if (!card.values || card.values[eff.key] == null) {
              warnings.push(`Card ${id} effect ${eff.type} reads values.${eff.key}, which is not defined`);
            }
            if (card.upgradedValues && card.upgradedValues[eff.key] == null) {
              warnings.push(`Card ${id} has upgradedValues but none for '${eff.key}' — the upgrade silently drops this effect`);
            }
          }
          // Targeting traps. applyEffects fans APPLY_STATUS out on ENEMY_ALL and
          // otherwise needs a `target`, which playCard only supplies for
          // ENEMY_SINGLE — so APPLY_STATUS on a SELF card runs neither branch and
          // is a silent no-op even after the Phase 10 fix. The inverse is the
          // same shape: APPLY_SELF_STATUS always hits the player, so putting it
          // on an enemy-targeted card reads as a debuff and is a buff.
          if (eff.type === 'APPLY_STATUS' && card.target === 'SELF') {
            warnings.push(`Card ${id} applies ${eff.status} to a target but is target:'SELF' — this is a silent no-op (did you mean APPLY_SELF_STATUS?)`);
          }
          if (eff.type === 'APPLY_SELF_STATUS' && card.target && card.target !== 'SELF' && !(card.effects || []).some(e => e.type === 'DAMAGE')) {
            warnings.push(`Card ${id} is ${card.target} but its only status effect is APPLY_SELF_STATUS — it buffs you, not them`);
          }
        }
      }
      for (const [id, enemy] of Object.entries(ENEMIES_DB)) {
        if (id !== enemy.id) warnings.push(`Enemy key/id mismatch: ${id}`);
        if (!enemy.name || !enemy.maxHp || (!enemy.pattern && !enemy.getIntent)) warnings.push(`Enemy missing fields: ${id}`);
        // Every enemy needs a combat portrait; new ones are easy to forget.
        if (!ENEMY_ICONS[id]) warnings.push(`Enemy ${id} has no ENEMY_ICONS portrait entry`);
        for (const token of (enemy.pattern || [])) {
          const parsed = parseIntentToken(token);
          if (parsed.type === 'UNKNOWN') warnings.push(`Unknown enemy pattern token on ${id}: ${token}`);
        }
        // A `pattern` enemy is fully checked above. A `getIntent` enemy was not
        // checked at all, and getIntent is where every interesting enemy lives.
        //
        // They cannot be CALLED to find out: they mutate enemy.intentIndex, some
        // read combat.enemies, and one of them (hollow-choir) latches a flag. So
        // the source is read instead. Three kinds of literal, three rules:
        //
        //   type: 'X'      a dynamic intent shape -> must be a key of INTENT_DESC
        //   cardId/enemyId  -> must exist in CARDS_DB / ENEMIES_DB. Matched as an
        //                      EXPRESSION up to the next , or }, because the real
        //                      ones are ternaries (grave-summoner, ashen-warden),
        //                      not bare literals.
        //   'ATK13'        anything else in caps -> must parse as an intent token.
        //                  This is what catches the ['ATK18', ...] loop arrays,
        //                  which never pass through parseIntentToken at a call
        //                  site the linter could see.
        //
        // The rule this depends on: keep every NON-token string literal inside a
        // getIntent lowercase. Enemy and card ids already are.
        if (typeof enemy.getIntent === 'function') {
          const src = String(enemy.getIntent);
          const consumed = new Set();
          for (const m of src.matchAll(/\btype:\s*'([^']*)'/g)) {
            consumed.add(m[1]);
            if (!INTENT_DESC[m[1]]) warnings.push(`Enemy ${id} getIntent returns unknown intent type: ${m[1]}`);
          }
          for (const [field, db] of [['cardId', CARDS_DB], ['enemyId', ENEMIES_DB]]) {
            for (const m of src.matchAll(new RegExp('\\b' + field + ':([^,}]+)', 'g'))) {
              for (const q of (m[1].match(/'([^']*)'/g) || [])) {
                const ref = q.slice(1, -1);
                consumed.add(ref);
                if (!db[ref]) warnings.push(`Enemy ${id} getIntent references missing ${field}: ${ref}`);
              }
            }
          }
          for (const m of src.matchAll(/'([A-Z][A-Z0-9_-]*)'/g)) {
            if (consumed.has(m[1])) continue;
            if (parseIntentToken(m[1]).type === 'UNKNOWN') {
              warnings.push(`Enemy ${id} getIntent has an unparseable intent token: ${m[1]}`);
            }
          }
        }
      }
      for (const [id, relic] of Object.entries(RELICS_DB)) {
        if (id !== relic.id) warnings.push(`Relic key/id mismatch: ${id}`);
        if (!relic.name || !relic.description || !relic.short) warnings.push(`Relic missing fields: ${id}`);
        if (relic.energyBonus != null && typeof relic.energyBonus !== 'number') warnings.push(`Relic ${id} energyBonus must be a number`);
        if (relic.characters != null) {
          if (!Array.isArray(relic.characters) || !relic.characters.length) {
            warnings.push(`Relic ${id} characters must be a non-empty array`);
          } else {
            for (const cid of relic.characters) if (!CHARACTERS_DB[cid]) warnings.push(`Relic ${id} references unknown character: ${cid}`);
          }
        }
      }
      // A relic's abbreviation is what renders when it has no art, so two relics
      // sharing one are indistinguishable in the status bar — and nothing checked.
      const shortOwners = {};
      for (const [rid, relic] of Object.entries(RELICS_DB)) {
        if (RELIC_SHORT_SOURCE[rid] === 'id-slice') {
          warnings.push(`Relic ${rid} has no declared short — it fell back to '${relic.short}' from its id`);
        }
        (shortOwners[relic.short] = shortOwners[relic.short] || []).push(rid);
        if (!RELIC_ICONS[rid] && !RASTER_ICONS.has(rid)) warnings.push(`Relic ${rid} has no icon`);
      }
      for (const [short, owners] of Object.entries(shortOwners)) {
        if (owners.length > 1) warnings.push(`Relic short '${short}' is shared by ${owners.join(', ')}`);
      }

      const potionRarityCounts = {};
      for (const [id, potion] of Object.entries(POTIONS_DB)) {
        if (id !== potion.id) warnings.push(`Potion key/id mismatch: ${id}`);
        if (!potion.name || !knownTargets.includes(potion.target)) warnings.push(`Potion missing/unknown target: ${id}`);
        if (typeof potion.custom !== 'function') warnings.push(`Potion ${id} has no custom() effect`);
        if (!potion.desc) warnings.push(`Potion ${id} has no desc — the shop and the belt tooltip render empty`);
        if (!POTION_RARITY_WEIGHTS[potion.rarity]) warnings.push(`Potion ${id} has rarity '${potion.rarity}', which POTION_RARITY_WEIGHTS does not list`);
        else potionRarityCounts[potion.rarity] = (potionRarityCounts[potion.rarity] || 0) + 1;
        if (!POTION_ICONS[id] && !RASTER_ICONS.has(id)) warnings.push(`Potion ${id} has no icon`);
        // The crash class: game.combat is null on the map, so a map-usable potion
        // that reaches into it throws rather than fizzling. Source-scanned here;
        // the gate additionally CALLS each one with combat nulled.
        if (potion.usableOutOfCombat && /\bgame\s*\.\s*combat\b/.test(String(potion.custom))) {
          warnings.push(`Potion ${id} is usableOutOfCombat but its custom() touches game.combat — it will throw on the map`);
        }
      }
      // rollPotion picks a rarity first, then a potion within it, so an empty
      // band is a dead branch and a one-potion band is a guaranteed repeat.
      for (const rarity of Object.keys(POTION_RARITY_WEIGHTS)) {
        if ((potionRarityCounts[rarity] || 0) < 2) {
          warnings.push(`Potion rarity ${rarity} has ${potionRarityCounts[rarity] || 0} entries — rollPotion needs at least 2 per band`);
        }
      }

      const boonIds = new Set();
      for (const boon of BOONS_DB) {
        if (!boon.id || !boon.label || typeof boon.apply !== 'function') warnings.push(`Boon missing fields: ${boon.id || 'unknown'}`);
        if (!boon.desc) warnings.push(`Boon ${boon.id} has no desc`);
        if (boonIds.has(boon.id)) warnings.push(`Duplicate boon id: ${boon.id}`);
        boonIds.add(boon.id);
        // Same optional field RELICS_DB uses — but the relic loop's validation of
        // it lives inside the relic loop, so boons got none of it for free.
        if (boon.characters != null) {
          if (!Array.isArray(boon.characters) || !boon.characters.length) {
            warnings.push(`Boon ${boon.id} characters must be a non-empty array`);
          } else {
            for (const cid of boon.characters) if (!CHARACTERS_DB[cid]) warnings.push(`Boon ${boon.id} references unknown character: ${cid}`);
          }
        }
      }
      // Every character must be able to fill the offer from its own pool.
      for (const cid of Object.keys(CHARACTERS_DB)) {
        const pool = boonPoolFor(cid).length;
        if (pool < BOON_OFFER_SIZE) warnings.push(`Character ${cid} can only be offered ${pool} boons but the screen shows ${BOON_OFFER_SIZE}`);
      }
      // Reserved floors must name a real node type and sit inside the map.
      for (const [label, table] of [['GUARANTEED_FLOORS', GUARANTEED_FLOORS], ['GUARANTEED_FLOORS_ACT2', GUARANTEED_FLOORS_ACT2]]) {
        for (const [floor, type] of Object.entries(table)) {
          const f = parseInt(floor, 10);
          if (!(f > 1 && f < LAYOUT.FLOORS - 1)) warnings.push(`${label} floor ${floor} collides with a reserved floor`);
          if (!Object.values(NODE_TYPES).includes(type)) warnings.push(`${label} floor ${floor} has unknown node type: ${type}`);
        }
      }
      // Every act's ramp must cover the floors its guaranteed table does not, or
      // an act silently generates a map with no elites at all.
      for (const [act, ramp] of Object.entries(ELITE_RAMP)) {
        if (!ramp.length) warnings.push(`ELITE_RAMP act ${act} is empty`);
        for (const row of ramp) {
          if (row.length !== 3) warnings.push(`ELITE_RAMP act ${act} row must be [fromFloor, weight, weightHard]`);
          if (row[2] < row[1]) warnings.push(`ELITE_RAMP act ${act} floor ${row[0]}: ascension weight is lower than base`);
        }
        for (let i = 1; i < ramp.length; i++) {
          if (ramp[i][0] >= ramp[i - 1][0]) warnings.push(`ELITE_RAMP act ${act} rows must be ordered highest floor first`);
        }
      }
      // Walks ACT_TABLES, not the Act 1 tables directly: scoping encounters by act
      // without scoping the linter by act would have left every Act 2 table
      // completely unchecked, which is the worst of both worlds.
      for (const [act, tables] of Object.entries(ACT_TABLES)) {
        for (const kind of ['encounters', 'elites']) {
          for (const [band, entries] of Object.entries(tables[kind])) {
            const where = `Act ${act} ${kind}.${band}`;
            if (entries.length < 3) warnings.push(`${where} has only ${entries.length} entries`);
            for (const encounter of entries) {
              if (!encounter.length) { warnings.push(`${where} has an empty encounter`); continue; }
              // Four panels is what the 1000px minimum window fits (see the note
              // on ENCOUNTER_TABLES); a fifth silently becomes a scroller.
              if (encounter.length > 4) warnings.push(`${where} encounter is ${encounter.length} bodies wide (max 4): ${encounter.join('+')}`);
              for (const enemyId of encounter) if (!ENEMIES_DB[enemyId]) warnings.push(`${where} references missing enemy: ${enemyId}`);
              if (kind === 'elites' && !encounter.some(id => ENEMIES_DB[id] && ENEMIES_DB[id].isElite)) {
                warnings.push(`${where} elite encounter contains no elite: ${encounter.join('+')}`);
              }
            }
          }
        }
        if (!tables.bosses || tables.bosses.length < 2) warnings.push(`Act ${act} has fewer than 2 bosses`);
        for (const bossId of tables.bosses || []) {
          if (!ENEMIES_DB[bossId]) warnings.push(`Act ${act} references missing boss: ${bossId}`);
          else if (!ENEMIES_DB[bossId].isBoss) warnings.push(`Act ${act} boss ${bossId} is not flagged isBoss`);
        }
      }
      // Orphans. An enemy in no table, summoned by nobody and not a boss can
      // never appear in a run, which is indistinguishable from an enemy that
      // does not work — and both look exactly like a finished one in the source.
      const reachable = new Set();
      for (const tables of Object.values(ACT_TABLES)) {
        for (const kind of ['encounters', 'elites']) {
          for (const entries of Object.values(tables[kind])) for (const e of entries) for (const eid of e) reachable.add(eid);
        }
        for (const b of tables.bosses || []) reachable.add(b);
      }
      for (const enemy of Object.values(ENEMIES_DB)) {
        if (typeof enemy.getIntent !== 'function') continue;
        for (const m of String(enemy.getIntent).matchAll(/\benemyId:([^,}]+)/g)) {
          for (const q of (m[1].match(/'([^']*)'/g) || [])) reachable.add(q.slice(1, -1));
        }
      }
      for (const id of Object.keys(ENEMIES_DB)) {
        if (!reachable.has(id)) warnings.push(`Enemy ${id} is in no table and is summoned by nobody — it can never appear`);
      }
      for (const [id, ch] of Object.entries(CHARACTERS_DB)) {
        if (id !== ch.id) warnings.push(`Character key/id mismatch: ${id}`);
        for (const cardId of ch.deck) {
          const def = CARDS_DB[cardId];
          if (!def) { warnings.push(`Character ${id} references missing card: ${cardId}`); continue; }
          // Starting decks may only contain BASIC, SHARED, or own-class cards.
          if (def.rarity !== CARD_RARITIES.BASIC && def.character !== 'SHARED' && def.character !== id) {
            warnings.push(`Character ${id} starts with off-class card: ${cardId} (${def.character})`);
          }
        }
        for (const relicId of ch.relics) if (!RELICS_DB[relicId]) warnings.push(`Character ${id} references missing relic: ${relicId}`);
        // Pool-size floor so reward/shop generation never starves.
        const own = Object.values(CARDS_DB).filter(c => c.character === id && c.rarity !== CARD_RARITIES.BASIC && c.type !== CARD_TYPES.CURSE);
        const commons = own.filter(c => c.rarity === CARD_RARITIES.COMMON);
        if (commons.filter(c => c.type === CARD_TYPES.ATTACK).length < 3) warnings.push(`Character ${id} pool has <3 common attacks`);
        if (commons.filter(c => c.type === CARD_TYPES.SKILL).length < 3) warnings.push(`Character ${id} pool has <3 common skills`);
        if (own.filter(c => c.type === CARD_TYPES.POWER).length < 2) warnings.push(`Character ${id} pool has <2 powers`);
        if (own.filter(c => c.rarity === CARD_RARITIES.RARE).length < 3) warnings.push(`Character ${id} pool has <3 rares`);
        if (own.filter(c => c.rarity === CARD_RARITIES.UNCOMMON).length < 6) warnings.push(`Character ${id} pool has <6 uncommons`);
      }

      // PARITY, which is the check the floors above cannot express. The pools sat
      // at 8/8/8, 8/7/5 and 6/7/5 for a long time and every floor was satisfied
      // throughout: Cinder Knight had three more rares than Plague Seer and
      // nothing anywhere said so. A floor stops a pool starving; only parity
      // stops one class quietly becoming the deep one.
      const classIds = Object.keys(CHARACTERS_DB);
      for (const rarity of [CARD_RARITIES.UNCOMMON, CARD_RARITIES.RARE]) {
        const counts = classIds.map(cid => ({
          cid, n: Object.values(CARDS_DB).filter(c => c.character === cid && c.rarity === rarity && c.type !== CARD_TYPES.CURSE).length
